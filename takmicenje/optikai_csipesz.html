<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optikai csipesz — virtuális kutatólaboratórium</title>
<style>
:root{
  --bg:#e9edf1; --paper:#fbfcfd; --ink:#18212b; --muted:#5b6876; --line:#cfd7df;
  --panel:#1b232d; --panel2:#232d39; --pink:#e6edf3; --pmuted:#9fb0c0; --pline:#34414f;
  --acc:#14877a; --acc2:#2fc2ae; --accd:#0f6e63; --accbg:#eef7f5;
  --warn:#b26a00; --bad:#b3261e; --ok:#1d7a3a; --laser:#d4382c;
  --r:8px; --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
/* Minden résznek saját, élénk színe — csak a hangsúlyszín (--acc/--acc2) változik részenként */
#app[data-part="0"]{--acc:#c2570c; --acc2:#ff9d4d; --accd:#9c4509; --accbg:#fdf0e4;}
#app[data-part="1"]{--acc:#1f63c4; --acc2:#5b9dff; --accd:#17499a; --accbg:#e9f1fd;}
#app[data-part="2"]{--acc:#1f8a4c; --acc2:#4fd080; --accd:#166b3a; --accbg:#e8f7ee;}
#app[data-part="3"]{--acc:#7a3fc4; --acc2:#b084f5; --accd:#5f2f9c; --accbg:#f3ecfc;}
#app[data-part="4"]{--acc:#c22b72; --acc2:#f06bab; --accd:#9b2159; --accbg:#fbe9f1;}
#app[data-part="5"]{--acc:#0d8f9b; --acc2:#4fd2de; --accd:#0a6e78; --accbg:#e4f6f8;}
#app[data-part="6"]{--acc:#c2341f; --acc2:#ff7a5c; --accd:#992716; --accbg:#fbe9e5;}
#app[data-part="7"]{--acc:#3f3fc4; --acc2:#8484f5; --accd:#2f2f9c; --accbg:#ecebfc;}
#app[data-part="8"]{--acc:#a67c00; --acc2:#ffcf4d; --accd:#7a5c00; --accbg:#fbf3e0;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h2{font-size:1.35rem} h3{font-size:1.08rem} h4{font-size:.98rem}
p{margin:.4em 0 .7em}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hidden{display:none!important}

/* --- zaglavlje --- */
header.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;
  padding:.55rem 1rem;background:var(--panel);color:var(--pink);border-bottom:1px solid #0d1218}
header.top .ttl{display:flex;align-items:center;gap:.6rem;font-weight:650;letter-spacing:.01em}
header.top .ttl .dot{width:12px;height:12px;border-radius:50%;background:var(--laser);box-shadow:0 0 10px 2px rgba(212,56,44,.55)}
header.top .tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{font-family:var(--mono);font-size:.82rem;padding:.15rem .5rem;border-radius:99px;background:var(--panel2);border:1px solid var(--pline);color:var(--pink)}
.btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:.35rem .75rem;line-height:1.3}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--accd)}
.btn.sm{padding:.18rem .5rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
header.top .btn{background:var(--panel2);border-color:var(--pline);color:var(--pink)}
header.top .btn:hover{border-color:var(--acc2)}
header.top select{background:var(--panel2);border:1px solid var(--pline);border-radius:6px;padding:.3rem .4rem;color:var(--pink)}

/* --- raspored --- */
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 52px)}
nav.parts{border-right:1px solid var(--line);background:#f3f6f8;padding:.8rem .6rem;position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto}
nav.parts button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--r);padding:.5rem .6rem;margin-bottom:.25rem;cursor:pointer}
nav.parts button:hover{background:#e6ecf0}
nav.parts button.cur{background:#fff;border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05)}
nav.parts .pn{font-weight:650;display:flex;gap:.4rem;align-items:baseline}
nav.parts .st{font-family:var(--mono);font-size:.8rem;width:1.3em;display:inline-block;text-align:center}
nav.parts .st.ok{color:var(--ok)} nav.parts .st.lk{color:var(--muted)} nav.parts .st.op{color:var(--acc)}
nav.parts .pd{font-size:.8rem;color:var(--muted);margin-left:1.7em}
nav.parts .lock{opacity:.65}
main{padding:1.1rem 1.4rem 4rem;max-width:1180px;width:100%}

/* --- kartice --- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin:0 0 1rem}
.card>h3:first-child{margin-top:0}
details.card>summary{cursor:pointer;font-weight:650;font-size:1.05rem;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";display:inline-block;width:1.1em;transition:transform .15s}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:.6rem}
.phead{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline;justify-content:space-between;margin-bottom:.8rem}
.badges{display:flex;flex-wrap:wrap;gap:.35rem}
.badge{font-size:.8rem;padding:.12rem .5rem;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.badge.ok{border-color:#9bd0ae;background:#e8f5ec;color:var(--ok)}
.badge.no{border-color:#e7c38f;background:#fdf4e6;color:var(--warn)}
.goal{border-left:4px solid var(--acc);background:var(--accbg);padding:.6rem .8rem;border-radius:0 var(--r) var(--r) 0;margin-bottom:1rem}
.theory p,.theory li{max-width:78ch}
.theory ul{margin:.3em 0 .6em 1.1em;padding:0}
.steps{margin:.2em 0 .6em 1.2em;padding:0}
.steps li{margin:.25em 0}
.note{background:#fff8e8;border:1px solid #f0d9a8;border-radius:6px;padding:.5rem .7rem;font-size:.92rem}
.lockedbox{text-align:center;padding:2rem 1rem;color:var(--muted)}
.lockedbox .big{font-size:2rem}

/* --- formule --- */
.fx{white-space:nowrap;font-family:"Cambria Math","Times New Roman",Times,serif;font-size:1.06em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em}
.fr>.nu{border-bottom:1px solid currentColor;padding:0 .2em .05em}
.fr>.de{padding:.05em .2em 0}
.sq{white-space:nowrap}
.sq>.sqa{display:inline-block;border-top:1px solid currentColor;padding:.12em .12em 0;margin-left:.02em;vertical-align:middle}
.fxb{display:block;text-align:center;margin:.5em 0}

/* --- kontrolne tačke --- */
.cp{border:1px solid var(--line);border-radius:var(--r);padding:.6rem .75rem;margin:.5rem 0;background:#fff}
.cp.pass{border-color:#9bd0ae;background:#f3faf5}
.cp .lab{font-weight:600}
.cp .row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.35rem}
.cp input[type=text]{width:9.5em;padding:.3rem .45rem;border:1px solid var(--line);border-radius:5px;font-family:var(--mono)}
.cp input[type=text]:disabled{background:#eef3ee}
.cp .unit{color:var(--muted);font-size:.9rem}
.cp .msg{font-size:.88rem;margin-top:.3rem}
.cp .msg.ok{color:var(--ok)} .cp .msg.bad{color:var(--bad)}
.cp .hint{margin-top:.35rem;font-size:.88rem;background:#f1f5fa;border-left:3px solid #7a9cc6;padding:.3rem .55rem}
.cp .att{font-size:.78rem;color:var(--muted)}
.cp .mc label{display:block;padding:.15rem 0;cursor:pointer}
.tol{font-size:.78rem;color:var(--muted)}

/* --- laboratorijski sto --- */
.bench{background:#2a3440;border-radius:12px;padding:.75rem;margin:0 0 1rem;position:relative}
.bench.off::after{content:attr(data-msg);position:absolute;inset:0;border-radius:12px;background:rgba(30,38,48,.86);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-size:1.02rem}
.ins{background:var(--panel);color:var(--pink);border:1px solid var(--pline);border-radius:10px;padding:.65rem .75rem;margin-bottom:.65rem}
.ins:last-child{margin-bottom:0}
.ins h4{color:#fff;font-size:.92rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:.45rem;margin-bottom:.5rem}
.ins h4 .led{width:8px;height:8px;border-radius:50%;background:#3a4756}
.ins h4 .led.on{background:var(--acc2);box-shadow:0 0 6px var(--acc2)}
.ins label{font-size:.82rem;color:var(--pmuted);display:inline-flex;flex-direction:column;gap:.1rem;margin:0 .5rem .4rem 0}
.ins input,.ins select{background:#0f151c;color:var(--pink);border:1px solid var(--pline);border-radius:5px;padding:.28rem .4rem;font-family:var(--mono);font-size:.88rem;width:7.5em}
.ins select{width:auto;font-family:inherit}
.ins .btn{background:#2c3846;border-color:#41505f;color:var(--pink)}
.ins .btn:hover{border-color:var(--acc2)}
.ins .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.ins .readout{font-family:var(--mono);font-size:.86rem;color:#bfe9e1}
.ins .ctrls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.2rem .3rem}
.ins table{color:var(--pink)}
.scopegrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:.65rem}
.viewer{position:relative;background:#000;border-radius:6px;overflow:hidden;touch-action:none}
.viewer canvas{display:block;width:100%;height:auto;cursor:crosshair}
.viewer .ov{position:absolute;left:.4rem;top:.35rem;font-family:var(--mono);font-size:.78rem;color:#fff;background:rgba(0,0,0,.55);padding:.1rem .4rem;border-radius:4px;pointer-events:none}
.viewer .ov2{left:auto;right:.4rem}
.vbar{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.4rem 0}
.vbar .sep{flex:1}
.seg{display:inline-flex;border:1px solid #41505f;border-radius:6px;overflow:hidden}
.seg button{background:#2c3846;border:0;color:var(--pink);padding:.2rem .55rem;cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--acc);color:#fff}
.tbl{border-collapse:collapse;font-size:.85rem;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--pline);padding:.15rem .35rem;text-align:right;font-family:var(--mono)}
.tbl th{color:var(--pmuted);font-weight:500;font-family:inherit}
.scroll{max-height:190px;overflow:auto;border:1px solid var(--pline);border-radius:5px}
.profwrap canvas{width:100%;height:auto;display:block;background:#0f151c;border-radius:5px;cursor:crosshair}
.status{font-size:.86rem;min-height:1.3em;color:#bfe9e1}
.status.err{color:#ffb4a8}

/* --- dnevnik --- */
.log{width:100%;border-collapse:collapse;font-size:.86rem}
.log th,.log td{border-bottom:1px solid var(--line);padding:.3rem .35rem;text-align:left;vertical-align:top}
.log th{color:var(--muted);font-weight:600;font-size:.8rem}
.log tr.bad td{color:#999;text-decoration:line-through}
.log tr.bad td.keep{text-decoration:none}
.log input[type=text]{width:100%;min-width:8em;border:1px solid var(--line);border-radius:4px;padding:.15rem .3rem}
.logwrap{max-height:340px;overflow:auto}
.mins{list-style:none;padding:0;margin:.3rem 0 .6rem}
.mins li{padding:.12rem 0}
.mins li::before{content:"○ ";color:var(--warn)}
.mins li.ok::before{content:"✓ ";color:var(--ok)}

/* --- grafici --- */
.graph{border:1px solid var(--line);border-radius:var(--r);padding:.7rem;margin:.6rem 0;background:#fff}
.graph .gg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:.7rem}
.graph canvas{width:100%;height:auto;display:block;border:1px solid #e3e8ed;border-radius:5px;background:#fff}
.graph textarea{width:100%;min-height:9em;font-family:var(--mono);font-size:.82rem;border:1px solid var(--line);border-radius:5px;padding:.35rem}
.graph .fl{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;margin:.3rem 0}
.graph .fl input{width:7em;font-family:var(--mono);font-size:.85rem;padding:.2rem .35rem;border:1px solid var(--line);border-radius:4px}
.graph .fl label{font-size:.82rem;color:var(--muted)}

/* --- modal --- */
dialog{border:0;border-radius:12px;padding:0;max-width:min(980px,96vw);width:96vw;max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,20,.55)}
dialog .dh{position:sticky;top:0;background:var(--panel);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;z-index:2}
dialog .db{padding:1rem 1.2rem;overflow:auto;max-height:calc(92vh - 52px)}
dialog .db h3{margin-top:1.1rem;border-bottom:1px solid var(--line);padding-bottom:.2rem}
dialog .btn.x{background:transparent;color:#fff;border-color:#55606c}
.dtab{border-collapse:collapse;font-size:.85rem;margin:.4rem 0}
.dtab th,.dtab td{border:1px solid var(--line);padding:.15rem .45rem;text-align:right;font-family:var(--mono)}
.dtab th{background:#f0f3f6;font-family:inherit}
pre.code{background:#10161d;color:#dfe8ef;padding:.7rem .9rem;border-radius:6px;overflow:auto;font-size:.84rem}

/* --- početni ekran --- */
.login{max-width:640px;margin:7vh auto;padding:0 1rem}
.login .card{padding:1.6rem}
.login input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:1.1rem;margin:.4rem 0 .8rem}
.login .hero{background:var(--panel);color:var(--pink);border-radius:12px;padding:1.3rem 1.5rem;margin-bottom:1rem}
.login .hero h1{color:#fff;font-size:1.5rem}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel);color:#fff;padding:.55rem 1rem;border-radius:8px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:.92rem;max-width:90vw}

@media (max-width:1100px){
  .scopegrid{grid-template-columns:1fr}
  .graph .gg{grid-template-columns:1fr}
}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.parts{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:.3rem;padding:.5rem}
  nav.parts button{min-width:150px;margin:0}
  nav.parts .pd{display:none}
  main{padding:1rem .9rem 4rem}
}
@media print{header.top,nav.parts,.bench{display:none}}

.ins input[type=checkbox]{width:auto}

/* ===== Záró jelentés ===== */
#report{position:fixed;inset:0;z-index:100;background:#e9edf1;overflow:auto;color:var(--ink)}
.repbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.6rem 1rem;background:var(--panel);color:var(--pink)}
.repbar .hint{color:var(--pmuted)}
.reppage{max-width:820px;margin:1rem auto 3rem;background:#fff;border:1px solid var(--line);padding:2rem 2.2rem;line-height:1.5}
.reppage h1{font-size:1.6rem;margin:0 0 .2rem}
.reppage .sub{margin:0 0 1rem;color:var(--muted)}
.reppage h2{font-size:1.2rem;margin:1.6rem 0 .5rem;padding-bottom:.2rem;border-bottom:2px solid var(--acc);break-after:avoid}
.reppage h3{font-size:1.02rem;margin:1rem 0 .3rem;break-after:avoid}
.reppage table{border-collapse:collapse;width:100%;margin:.4rem 0 .8rem;font-size:.9rem}
.reppage th,.reppage td{border:1px solid var(--line);padding:.25rem .5rem;text-align:left;vertical-align:top}
.reppage thead th{background:#eef2f5}
.reppage table.meta th{background:#eef2f5;width:1%;white-space:nowrap}
.reppage .stt{white-space:nowrap}
.reppage .badrow td{color:var(--muted);text-decoration:line-through}
.reppage input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:4px;padding:.2rem .4rem}
.reppage textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:.5rem;resize:vertical}
.reppage .replab{font-weight:600;margin:.8rem 0 .25rem}
.reppage .figs{display:flex;flex-wrap:wrap;gap:.6rem}
.reppage figure{margin:0;flex:1 1 300px;max-width:100%}
.reppage figure img{width:100%;height:auto;border:1px solid var(--line)}
.reppage figcaption{font-size:.82rem;color:var(--muted)}
.reppage.nolog .replog{display:none}
.reppage .goal{color:#2b3745}
.printtxt{display:none}
@media (max-width:640px){.reppage{padding:1rem;margin:0}}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important}
  body.rpt-open #app,body.rpt-open .toast,body.rpt-open #toast{display:none!important}
  #report{position:static;inset:auto;overflow:visible;background:#fff}
  .noprint,.repbar{display:none!important}
  .printtxt{display:block;white-space:pre-wrap}
  td .printtxt,span.printtxt{display:inline}
  .reppage{max-width:none;margin:0;padding:0;border:0}
  .reppage tr,.reppage figure{page-break-inside:avoid}
  .reppage .replog{page-break-before:always}
  .reppage{font-size:10.5pt}
}
.repbar .btn:not(.pri){background:var(--panel2);border-color:var(--pline);color:var(--pink)}
.repbar label{display:flex;align-items:center;gap:.3rem}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Optička pinceta — jezgro simulacije (radi u glavnoj niti, Web Worker-u i Node-u) ===== */
(function (G) {
  'use strict';
  var C = {
    kB: 1.380649e-23, c: 2.99792458e8, n: 1.33, rhoP: 1050, rhoW: 998, g: 9.81,
    W: 2048, H: 1536,          // senzor kamere (px)
    optBias: 20e-9,            // pomeranje tamnog prstena van ivice (difrakcija)
    ringW: 110e-9              // širina tamnog prstena (sigma)
  };

  /* ---------- PRNG ---------- */
  function hashStr(str) {
    var h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return ((h1 ^ h2) >>> 0);
  }
  function RNG(seed) {
    var a = seed >>> 0, spare = null;
    this.u = function () { // mulberry32
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    this.n = function () {
      if (spare !== null) { var s0 = spare; spare = null; return s0; }
      var u, v, s;
      do { u = 2 * this.u() - 1; v = 2 * this.u() - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
      var m = Math.sqrt(-2 * Math.log(s) / s);
      spare = v * m; return u * m;
    };
  }
  function normCode(code) { return String(code || '').trim().toUpperCase(); }

  /* ---------- Svojstva sredine ---------- */
  function etaW(TK) { return 2.414e-5 * Math.pow(10, 247.8 / (TK - 140)); }   // Pa·s
  // Cheng (2008), glicerol–voda; w maseni udeo (0..1), T u °C; rezultat Pa·s
  function etaGly(w, TC) {
    var muW = 1.790 * Math.exp((-1230 - TC) * TC / (36100 + 360 * TC));
    var muG = 12100 * Math.exp((-1233 + TC) * TC / (9900 + 70 * TC));
    var a = 0.705 - 0.0017 * TC, b = (4.9 + 0.036 * TC) * Math.pow(a, 2.5);
    var al = 1 - w + a * b * w * (1 - w) / (a * w + b * (1 - w));
    return Math.pow(muW, al) * Math.pow(muG, 1 - al) * 1e-3;
  }
  function faxen(r, h) {
    if (!isFinite(h)) return 1;
    var q = r / h;
    return 1 - 9 / 16 * q + 1 / 8 * q * q * q - 45 / 256 * Math.pow(q, 4) - 1 / 16 * Math.pow(q, 5);
  }
  function gammaPar(eta, r, h) { return 6 * Math.PI * eta * r / faxen(r, h); }

  /* ---------- Skriveni parametri (redosled izvlačenja se NIKAD ne menja) ---------- */
  function makeParams(code) {
    var nc = normCode(code), rng = new RNG(hashStr('OPT-PINCETA|' + nc));
    var U = function (a, b) { return a + (b - a) * rng.u(); };

    msg.className = 'status'; msg.textContent = 'A hőmérséklet beáll… várj néhány másodpercet a rögzítés előtt.';
  } }, 'Beállítás');

    h('div', { class: 'ctrls' }, h('label', null, 'beállított T (15–40 °C)', inp), btn, h('span', { style: { marginLeft: '.8rem' } }, cur)), msg);
  var iv = setInterval(function () { if (!document.contains(el)) { clearInterval(iv); return; } cur.textContent = 'A minta T-je = ' + fmt(Math.round(sampleTC(3) * 10) / 10, 1) + ' °C'; }, 250);
  return el;
}

/* --- jednostavan crtač za instrumente (tamna pozadina) --- */
function instPlot(cv, series, opt) {
  var dpr = window.devicePixelRatio || 1, Wc = opt.w || 900, Hc = opt.h || 260;
  cv.width = Wc * dpr; cv.height = Hc * dpr;
  var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#0f151c'; c.fillRect(0, 0, Wc, Hc);
  var L = 62, R = 12, T = 10, B = 32, lx = !!opt.logx, ly = !!opt.logy;
  var tx = function (v) { return lx ? Math.log10(v) : v; }, ty = function (v) { return ly ? Math.log10(v) : v; };
  var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  series.forEach(function (s) { for (var i = 0; i < s.x.length; i++) { var a = tx(s.x[i]), b = ty(s.y[i]); if (!isFinite(a) || !isFinite(b)) continue; if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; } });
  if (!isFinite(x0)) return null;
  var py = (y1 - y0) || 1; y0 -= py * 0.05; y1 += py * 0.05;
  var X = function (a) { return L + (a - x0) / (x1 - x0) * (Wc - L - R); }, Y = function (b) { return Hc - B - (b - y0) / (y1 - y0) * (Hc - B - T); };
  c.strokeStyle = '#26323e'; c.fillStyle = '#9fb0c0'; c.font = '11px system-ui';
  function ticks(a, b, log, horiz) {
    var out = [];
    if (log) { for (var e = Math.floor(a); e <= Math.ceil(b); e++) if (e >= a && e <= b) out.push([e, '10^' + e]); }
    else { var nt = niceTicks(a, b, horiz ? 8 : 5); nt.t.forEach(function (v) { out.push([v, tickLabel(v, nt.step)]); }); }
    return out;
  }
  ticks(x0, x1, lx, true).forEach(function (t) { c.beginPath(); c.moveTo(X(t[0]), T); c.lineTo(X(t[0]), Hc - B); c.stroke(); c.textAlign = 'center'; c.fillText(t[1], X(t[0]), Hc - B + 14); });
  ticks(y0, y1, ly, false).forEach(function (t) { c.beginPath(); c.moveTo(L, Y(t[0])); c.lineTo(Wc - R, Y(t[0])); c.stroke(); c.textAlign = 'right'; c.fillText(t[1], L - 5, Y(t[0]) + 4); });
  c.textAlign = 'right'; c.fillText(opt.xlab || '', Wc - R, Hc - 4); c.textAlign = 'left'; c.fillText(opt.ylab || '', L + 4, T + 10);
  series.forEach(function (s) {
    c.strokeStyle = s.col; c.lineWidth = 1.1; c.beginPath(); var first = true;
    for (var i = 0; i < s.x.length; i++) { var a = tx(s.x[i]), b = ty(s.y[i]); if (!isFinite(a) || !isFinite(b)) continue; if (first) { c.moveTo(X(a), Y(b)); first = false; } else c.lineTo(X(a), Y(b)); }
    c.stroke();
  });
  return { inv: function (px) { var a = x0 + (px - L) / (Wc - L - R) * (x1 - x0); return lx ? Math.pow(10, a) : a; }, Wc: Wc };
}

/* ===== Részek tartalma: elmélet, előrejelzések, mérések, kiértékelés, ellenőrzőpontok ===== */
'use strict';

/* ---------- 0. rész ---------- */

  var T = 295.15, eta = K.etaW(T), r = 1e-6, kT = KB_SI * T, g = 6 * Math.PI * eta * r, D = kT / g;
  var V = 4 / 3 * Math.PI * r * r * r, m = K.C.rhoP * V, F = K.C.n * 0.1 / K.C.c, Wp = (K.C.rhoP - K.C.rhoW) * V * K.C.g;

    sx: Math.sqrt(kT / kap) * 1e9, tc: tc * 1e3, fc: 1 / (2 * Math.PI * tc), t1: 1e-12 / (2 * D) };
}

    check: function (v) { return tolCheck(v, p0()[key], 0.02); } };
}
var H0 = ['Ellenőrizd a mértékegységeket: számolás előtt minden legyen SI-ben (μm → m, mW → W, pN·nm → J).', 'Nézd meg az elmélet képletét, és a víz viszkozitását 22 °C-on a Kézikönyv táblázatából.'];

/* ---------- 1. rész: segédfüggvények ---------- */
function snapsOf(part, kind) { return logOk(part).filter(function (e) { return e.kind === kind; }); }
function profCount(part, series) {
  var n = 0;
  snapsOf(part, 'field').forEach(function (e) { if (e.s.series === series) n += (S.profiles[e.id] || []).length; });
  return n;
}
/* ---------- 2. rész: segédfüggvények ---------- */
function elig(series) {
  return logOk(2).filter(function (e) { return e.kind === 'free' && e.s.series === series && e.s.N >= 300 && (e.s.z - P.z0) >= 10e-6; });
}
function Dtrue(e) {
  var TK = P.TroomC + 273.15;
  return KB_SI * TK / K.gammaPar(K.etaW(TK), P.series[e.s.series].rMean, e.s.z - P.z0);
}
function Dbulk(series, TC) { var TK = (TC == null ? P.TroomC : TC) + 273.15; return KB_SI * TK / (6 * Math.PI * K.etaW(TK) * P.series[series].rMean); }
function Dpred(series) { var TK = TroomShown() + 273.15; return KB_SI * TK / (6 * Math.PI * K.etaW(TK) * P.series[series].rNom) * 1e12; }
function checkD(series) {
  return function (v, u, inp, isNb) {
    var E = elig(series);
    if (!E.length) return { skip: true, msg: 'Ebből a sorozatból nincs használható felvétel (≥ 300 képkocka, messze az üvegtől).' };
    var tr = mean(E.map(Dtrue)) * 1e12;
    if (rel(v, tr) > 0.06) return { ok: false, msg: MSG_TOL };
    return Work.run('analyzeD', { recs: E.map(function (e) { return { s: e.s, seed: e.seed }; }) }).then(function (r) {
      var md = mean(r.list.map(function (x) { return x.D; })) * 1e12;
      if (rel(v, md) > 0.03) return { ok: false, msg: 'Az érték nem konzisztens a saját felvételeiddel. Ellenőrizd a kiértékelést: px → µm, drift eltávolítása, 1–10 képkockányi késleltetés, D a meredekségből.' };
      return { ok: true };
    });
  };
}
function nbD(series) { return function (v) { return tolCheck(v, Dbulk(series) * 1e12, 0.06); }; }
function checkR(series) {
  return function (v) {
    var tr = P.series[series].rMean, r = v * 1e-9;
    if (rel(r, tr) <= 0.05) return { ok: true };
    var id = 'c2_D' + 'ABC'[series], Dh = her(id), TK = P.TroomC + 273.15;
    if (S.cps[id] && S.cps[id].passed && isFinite(Dh)) {
      var rD = KB_SI * TK / (6 * Math.PI * K.etaW(TK) * Dh * 1e-12);
      if (rel(r, rD) <= 0.02 && rel(r, tr) <= 0.07) return { ok: true };
    }
    return { ok: false, msg: MSG_TOL };
  };
}
function kBfromHerD() {
  var Ds = [her('c2_DA'), her('c2_DB'), her('c2_DC')];
  if (!Ds.every(isFinite)) return null;
  var TK = P.TroomC + 273.15, eta = K.etaW(TK), x = P.series.map(function (s) { return 1 / s.rNom; }), y = Ds.map(function (d) { return d * 1e-12; });
  var f0 = K.linfit0(x, y), f1 = K.linfit(x, y), k = 6 * Math.PI * eta / TK;
  return [f0.b * k * 1e23, f1.b * k * 1e23];
}

function openReport() {
  closeReport(); saveNow();
  var R = repState(), root = h('div', { id: 'report', role: 'dialog', 'aria-label': 'Záró jelentés' });
  var page = h('div', { class: 'reppage' + (R.log ? '' : ' nolog') });
  var chk = h('input', { type: 'checkbox', checked: R.log, onchange: function (e) { R.log = e.target.checked; save(); page.classList.toggle('nolog', !R.log); } });
  root.appendChild(h('div', { class: 'repbar noprint' }, h('strong', null, 'Záró jelentés'),
    h('label', { class: 'small' }, chk, ' mérési napló melléklet'),
    h('button', { class: 'btn pri sm', onclick: printReport }, 'Nyomtatás / mentés PDF-ként'),
    h('button', { class: 'btn sm', onclick: closeReport }, 'Bezárás'),
    h('span', { class: 'small hint' }, 'A nyomtatási ablakban válaszd a „Mentés PDF-ként” (Save as PDF) célt.')));
  var done = PARTS.filter(function (p, i) { return isDone(i); }).length, tot = 0, ok = 0, att = 0;
  PARTS.forEach(function (p) { (p.cps || []).forEach(function (d) { if (d.type === 'ext') return; tot++; var c = S.cps[d.id]; if (c && c.passed) ok++; if (c) att += c.attempts.length; }); });
  var today = new Date().toLocaleDateString('hu-HU');

  page.appendChild(h('div', { html: '<h1>Optikai csipesz — laboratóriumi jelentés</h1><p class="sub">Virtuális kutatólaboratórium: Brown-mozgás, optikai csapda és a kinezin molekuláris motor</p>' }));
  page.appendChild(h('table', { class: 'meta' }, h('tbody', null,
    h('tr', null, h('th', null, 'Név'), repLine('Név', 'name'), h('th', null, 'Osztály / csoport'), repLine('Osztály / csoport', 'cls')),
    h('tr', null, h('th', null, 'A labor kódja'), h('td', { class: 'mono' }, S.code), h('th', null, 'Dátum'), h('td', null, today)),
    h('tr', null, h('th', null, 'Elvégzett részek'), h('td', null, done + ' / ' + PARTS.length), h('th', null, 'Ellenőrzőpontok'), h('td', null, ok + ' / ' + tot + ' teljesítve, ' + att + ' próbálkozásból')))));

  page.appendChild(h('div', { html: '<h2>Kulcseredmények</h2>' + repKeyResults() }));
  page.appendChild(repField('Összefoglaló (saját szavaiddal, legfeljebb 200 szó)', 'abs', 7, 'A kérdés, a módszerek és a fő eredmények bizonytalansággal.'));
  var body = h('div');
  for (var n = 0; n <= 7; n++) body.innerHTML += repPartSection(n);
  page.appendChild(body);
  page.appendChild(h('div', { html: '<h2>Összehasonlítás a pontos értékkel</h2>' + (repKbCompare() || '<p class="muted">Nincs k<sub>B</sub> érték.</p>') + '<h2>Bizonytalansági költségvetések</h2>' + repBudgets() }));
  page.appendChild(h('h2', null, 'Diszkusszió és következtetés'));
  page.appendChild(repField('Diszkusszió: szisztematikus hibák (fal, elmosódás, lokalizációs zaj, drift, melegedés, szűrő, aliasing), a módszerek összehasonlítása, összevetés az irodalommal', 'disc', 12, ''));
  page.appendChild(repField('Következtetés: megmérhető-e fénnyel egyetlen pikonewtonnyi erő?', 'concl', 6, ''));
  page.appendChild(h('div', { class: 'replog', html: '<h2>Függelék: mérési napló</h2>' + repLogAppendix() }));
  page.appendChild(h('p', { class: 'small muted foot' }, 'Az alkalmazás automatikusan állította össze a ' + today + ' napon. Az „Optikai csipesz” virtuális laboratórium, a kód: ' + S.code + '.'));
  root.appendChild(page);
  document.body.appendChild(root); document.body.classList.add('rpt-open');
  document.addEventListener('keydown', repKey);
  /* a diák grafikonjai képként */
  Array.prototype.forEach.call(page.querySelectorAll('figure[data-gid]'), function (fg) {
    var g = (PARTS[+fg.getAttribute('data-n')].graphs || []).filter(function (x) { return x.id === fg.getAttribute('data-gid'); })[0];
    if (!g) return;
    var el = GraphPanel(g.id, g);
    setTimeout(function () { var cv = el.querySelector('canvas'); if (cv) fg.querySelector('img').src = cv.toDataURL('image/png'); }, 120);
  });
  root.scrollTop = 0;
}
function reportCard() {
  return h('div', { class: 'card' }, h('h3', null, 'Záró jelentés'),
    h('p', { class: 'small muted' }, 'Az alkalmazás összeállítja az eredményeidből, a grafikonjaidból, a mérési naplódból és a költségvetéseidből a jelentés vázát. Az összefoglalót, a diszkussziót és a következtetést a jelentésben magad írod meg. A jelentés kinyomtatható, vagy a böngésző nyomtatási ablakában a „Mentés PDF-ként” célt választva PDF-fájlba menthető.'),
    h('button', { class: 'btn pri', onclick: openReport }, 'Jelentés megnyitása'));
}

</script>
</body>
</html>
