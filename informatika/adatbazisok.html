<title>Adatbázisok – Interaktív tananyag / Baze podataka – Interaktivna nastava</title>
<style>
:root{
  --bg:#f6f8fc; --card:#ffffff; --accent:#2563eb; --accent2:#7c3aed;
  --text:#1e293b; --muted:#64748b; --good:#16a34a; --warn:#d97706;
  --border:#e2e8f0; --soft:#eef4ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;min-height:100vh}
.container{max-width:980px;margin:0 auto;padding:24px 18px 90px}
header{position:relative;text-align:center;padding:70px 20px 50px;
  background:linear-gradient(120deg,#dbeafe 0%,#ede9fe 60%,#fce7f3 100%);
  border-radius:0 0 40px 40px}
header h1{font-size:2.6rem;color:var(--accent);margin-bottom:12px}
header p.sub{color:var(--muted);font-size:1.15rem;max-width:700px;margin:0 auto}
.lang-switch{position:absolute;top:20px;right:20px;display:flex;background:#fff;border:1px solid var(--border);border-radius:30px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.lang-switch button{background:transparent;border:none;color:var(--muted);padding:9px 20px;cursor:pointer;font-weight:600;font-size:.95rem;transition:.2s}
.lang-switch button.active{background:var(--accent);color:#fff}
section{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px 34px;margin:28px 0;box-shadow:0 4px 20px rgba(30,41,59,.06)}
section h2{color:var(--accent);margin-bottom:16px;font-size:1.55rem;border-bottom:3px solid var(--soft);padding-bottom:10px}
section h3{color:var(--accent2);margin:20px 0 10px;font-size:1.15rem}
p{margin-bottom:12px}
ul,ol{margin:0 0 12px 22px}
li{margin-bottom:7px}
b{color:#0f172a}
.example{background:var(--soft);border-left:5px solid var(--good);border-radius:10px;padding:16px 20px;margin:16px 0}
.example .label{color:var(--good);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:1px}
table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.95rem;display:block;overflow-x:auto}
thead th{background:var(--accent);color:#fff;padding:12px 14px;text-align:left;border:1px solid var(--accent);white-space:nowrap}
tbody td{padding:11px 14px;border:1px solid var(--border);vertical-align:top}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:var(--soft)}
code,pre{font-family:'Consolas',monospace;background:#0f172a;color:#7dd3fc;border-radius:8px}
code{padding:2px 8px;font-size:.92em}
pre{padding:16px 20px;overflow-x:auto;margin:14px 0}
pre .kw{color:#c084fc;font-weight:700}pre .st{color:#4ade80}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:16px 0}
.card{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:18px;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(37,99,235,.12);border-color:var(--accent)}
.card h4{color:var(--accent);margin-bottom:6px;font-size:1.05rem}
.card p{font-size:.92rem;color:var(--muted)}
.card p.free{color:var(--good);font-weight:700}
.quiz{background:#f8fafc;border:2px dashed var(--accent2);border-radius:14px;padding:20px;margin:18px 0}
.quiz button{display:block;width:100%;text-align:left;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:8px 0;cursor:pointer;transition:.15s;font-size:.98rem}
.quiz button:hover{border-color:var(--accent);background:var(--soft)}
.quiz button.correct{background:#dcfce7;border-color:var(--good)}
.quiz button.wrong{background:#fee2e2;border-color:#ef4444}
.quiz .feedback{font-weight:600;margin-top:8px;min-height:26px}
footer{text-align:center;color:var(--muted);margin-top:40px;font-size:.9rem}
@media(max-width:640px){header h1{font-size:1.8rem}.lang-switch{position:static;margin-bottom:18px;display:inline-flex}section{padding:22px}}
</style>
</head>

let lang = 'hu';

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k]) el.innerHTML = t[k];
  });
  document.getElementById('btn-hu').classList.toggle('active', lang==='hu');
  document.getElementById('btn-sr').classList.toggle('active', lang==='sr');

  document.getElementById('terms-list').innerHTML = t.terms.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('usage-cards').innerHTML =
    t.usage.map(u=>`<div class="card"><h4>${u[0]}</h4><p>${u[1]}</p></div>`).join('');
  document.getElementById('why-list').innerHTML = t.why.map(w=>`<li>${w}</li>`).join('');

  document.getElementById('types-table').innerHTML = `<table>
    <thead><tr>${t.typesHead.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.types.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  document.getElementById('full-table').innerHTML = `<table>
    <thead><tr>${t.tableHead.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.tableRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  document.getElementById('sql-code1').innerHTML =
`<span class="kw">SELECT</span> nev, atlag
<span class="kw">FROM</span> diakok
<span class="kw">WHERE</span> atlag &gt; 4.0
<span class="kw">ORDER BY</span> atlag <span class="kw">DESC</span>;`;

  document.getElementById('sql-result1').innerHTML = `<table>
    <thead><tr>${t.sqlResult1Head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.sqlResult1.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  document.getElementById('sql-code2').innerHTML =
`<span class="kw">SELECT</span> nev, osztaly
<span class="kw">FROM</span> diakok
<span class="kw">WHERE</span> osztaly = <span class="st">'10.A'</span>;`;

  document.getElementById('sql-result2').innerHTML = `<table>
    <thead><tr>${t.sqlResult2Head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.sqlResult2.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  document.getElementById('tools-cards').innerHTML =
    t.tools.map(x=>`<div class="card"><h4>${x[0]}</h4><p>${x[1]}</p><p class="free">${x[2]}</p></div>`).join('');

  document.getElementById('tools-table').innerHTML = `<table>
    <thead><tr>${t.toolsTableHead.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.toolsTable.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  document.getElementById('quiz-wrap').innerHTML = t.quizzes.map((q,qi)=>`
    <div class="quiz" id="quiz${qi}">
      <p><b>${qi+1}. ${q.q}</b></p>
      ${q.a.map((a,i)=>`<button onclick="answer(${qi},${i},this)">${a}</button>`).join('')}
      <div class="feedback"></div>
    </div>`).join('');
}

function answer(qi, i, btn){
  const q = T[lang].quizzes[qi];
  const wrap = document.getElementById('quiz'+qi);
  const btns = wrap.querySelectorAll('button');
  const fb = wrap.querySelector('.feedback');
  btns.forEach(b=>{b.classList.remove('correct','wrong');});
  if(i === q.correct){
    btn.classList.add('correct');
    fb.style.color = '#16a34a';
    fb.textContent = q.good;
  } else {
    btn.classList.add('wrong');
    fb.style.color = '#ef4444';
    fb.textContent = q.bad;
  }
}

function setLang(l){ lang = l; render(); window.scrollTo({top:0,behavior:'smooth'}); }

render();
