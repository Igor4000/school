<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ellenőrző gyakorlat — Zene adatbázis</title>
<style>
:root{
  --bg:#f5f6fb; --bg-blur:rgba(245,246,251,.86); --card:#ffffff; --card2:#f8f9fd; --ink:#0f172a; --muted:#5b6478; --line:#e3e7f0;
  --accent:#5b5bf0; --accent2:#0ea5c6; --accent-ink:#3a3ad1; --chip:#eceefe; --on-accent:#ffffff;
  --sel-bg:#f0f0ff; --ring:rgba(91,91,240,.35);
  --ok:#15803d; --ok-bg:#e9f8ef; --ok-line:#9fdcb7;
  --warn:#b45309; --warn-bg:#fff4e0; --warn-line:#f1cf91;
  --pink:#c026a3; --pink-bg:#fdf0fb; --pink-line:#efb5e4;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 28px rgba(15,23,42,.07);
  --glow1:rgba(91,91,240,.16); --glow2:rgba(14,165,198,.14);
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
}
[data-theme="dark"]{
  --bg:#0b1020; --bg-blur:rgba(11,16,32,.86); --card:#131a2e; --card2:#10172a; --ink:#e8ecf7; --muted:#97a1ba; --line:#243050;
  --accent:#8b8bff; --accent2:#38c9e6; --accent-ink:#b3b3ff; --chip:#1e2547; --on-accent:#0b1020;
  --sel-bg:#1b2147; --ring:rgba(139,139,255,.4);
  --ok:#5fd68c; --ok-bg:#0f2a1c; --ok-line:#1f6a41;
  --warn:#f5b45a; --warn-bg:#2b2112; --warn-line:#74541f;
  --pink:#f08ae0; --pink-bg:#2a1427; --pink-line:#6b2a62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.35);
  --glow1:rgba(139,139,255,.16); --glow2:rgba(56,201,230,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55; font-size:16px;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(900px 480px at 8% -8%, var(--glow1), transparent 60%),
    radial-gradient(760px 460px at 100% 0%, var(--glow2), transparent 55%);
}
.shell{ max-width:820px; margin:0 auto; padding:18px 16px 72px; }
code{ font-family:var(--mono); font-size:.86em; background:var(--chip); color:var(--accent-ink); padding:.08em .4em; border-radius:6px; }
button,input{ font:inherit; }
:focus-visible{ outline:3px solid var(--ring); outline-offset:2px; }

.min{display:inline-block;margin-left:.35rem;padding:.05rem .5rem;border-radius:999px;background:var(--chip);color:var(--accent-ink);font-size:.76rem;font-weight:700;white-space:nowrap}
.note.plan{margin-top:.7rem}
/* top bar */
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
.brand{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
.brand .logo{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:#fff; font-size:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 18px var(--glow1); }
.brand small{ display:block; font-weight:500; color:var(--muted); font-size:.74rem; letter-spacing:0; }
.controls{ display:flex; gap:8px; align-items:center; }
.seg{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; }
.seg button{ border:0; background:transparent; color:var(--muted); padding:.38rem .8rem; border-radius:9px; font-weight:700; font-size:.82rem; cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
.icon-btn{ width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:16px; }

/* hero */
.hero h1{ font-size:clamp(1.55rem,4.5vw,2.15rem); line-height:1.15; letter-spacing:-.025em; margin:0 0 .45rem; }
.hero h1 span{ background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p{ margin:0 0 1.2rem; color:var(--muted); max-width:62ch; }

/* generic card */
.card{ background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:clamp(16px,3.6vw,26px); margin-bottom:18px; }
.card h2{ margin:0 0 .3rem; font-size:1.12rem; letter-spacing:-.01em; }
.card .sub{ margin:0 0 1rem; color:var(--muted); font-size:.92rem; }

/* name card */
.fields{ display:grid; grid-template-columns:1fr 1fr 130px; gap:10px; margin-bottom:14px; }
.fields label{ display:block; font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:4px; }
.fields input{ width:100%; padding:.65rem .8rem; border-radius:12px; border:1.5px solid var(--line); background:var(--card2); color:var(--ink); }
.fields input:focus{ border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--ring); }
.fname-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--card2); border:1.5px dashed var(--line); border-radius:14px; padding:.7rem .9rem; }
.fname-row .lbl{ font-size:.8rem; font-weight:700; color:var(--muted); }
.fname-row code.fn{ font-size:.95rem; font-weight:700; padding:.2em .55em; word-break:break-all; }
.fname-row.ready{ border-style:solid; border-color:var(--ok-line); background:var(--ok-bg); }
.copy{ margin-left:auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:.35rem .8rem; font-weight:700; font-size:.82rem; cursor:pointer; }
.fn-hint{ font-size:.82rem; color:var(--muted); margin:.5rem 0 0; }

/* note */
.note{ border-left:4px solid var(--accent2); background:var(--card); border-radius:0 14px 14px 0; padding:.85rem 1.1rem; margin:0 0 18px; font-size:.92rem; color:var(--muted); box-shadow:var(--shadow); border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.note b{ color:var(--ink); }

/* schema + data tables */
.schemas{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.schema{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card2); }
.schema-h{ padding:.5rem .9rem; font-family:var(--mono); font-weight:700; font-size:.86rem; background:var(--chip); color:var(--accent-ink); }
.schema-r{ display:grid; grid-template-columns:1fr auto auto; gap:.7rem; align-items:center; padding:.42rem .9rem; border-top:1px solid var(--line); font-family:var(--mono); font-size:.8rem; }
.schema-r .t{ color:var(--muted); }
.flag{ font-size:.66rem; font-weight:800; padding:.1rem .38rem; border-radius:6px; margin-left:3px; background:var(--chip); color:var(--accent-ink); }
.flag.fk{ background:var(--pink-bg); color:var(--pink); border:1px solid var(--pink-line); }
.rels{ display:grid; gap:.4rem; margin-top:.8rem; }
.rel{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; font-family:var(--mono); font-size:.8rem; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:.45rem .8rem; }
.rel .ln{ color:var(--pink); font-weight:800; }
.rel.later{ border-style:dashed; color:var(--muted); }
.rel.later .ln{ color:var(--muted); }
.datas{ display:flex; flex-wrap:wrap; gap:12px; margin:.2rem 0 1rem; }
.mini{ flex:1 1 300px; min-width:0; }
.mini-t{ font-family:var(--mono); font-weight:700; font-size:.82rem; margin-bottom:.35rem; color:var(--accent-ink); }
.mini-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card2); }
.mini table{ border-collapse:collapse; width:100%; font-size:.8rem; font-family:var(--mono); }
.mini th{ text-align:left; padding:.4rem .65rem; color:var(--muted); background:var(--chip); font-weight:700; white-space:nowrap; }
.mini td{ padding:.36rem .65rem; border-top:1px solid var(--line); white-space:nowrap; }
.mini td:first-child{ color:var(--muted); }
.mini .auto-note{ font-size:.75rem; color:var(--muted); margin-top:.3rem; font-family:inherit; }

/* progress (sticky) */
.prog{ position:sticky; top:0; z-index:10; margin:0 -16px 18px; padding:10px 16px; background:var(--bg-blur); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.prog-in{ max-width:820px; margin:0 auto; display:flex; align-items:center; gap:14px; }
.bars{ flex:1; display:grid; grid-template-columns:repeat(10,1fr); gap:5px; }
.bars a{ height:8px; border-radius:99px; background:var(--line); transition:background .25s; display:block; }
.bars a.on{ background:var(--ok); }
.prog-n{ font-weight:800; font-size:.85rem; white-space:nowrap; }
.prog-n b{ color:var(--ok); }

/* task cards */
.task{ background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:clamp(16px,3.6vw,26px); margin-bottom:16px; scroll-margin-top:70px; transition:border-color .2s, background .2s; }
.task.done{ border-color:var(--ok-line); }
.task-h{ display:flex; gap:14px; align-items:flex-start; margin-bottom:.9rem; }
.num{ flex:none; width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:1rem; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.task.done .num{ background:var(--ok); }
.task-t{ flex:1; min-width:0; }
.task-t h2{ margin:0; font-size:1.12rem; line-height:1.3; letter-spacing:-.01em; }
.task-t p{ margin:.2rem 0 0; color:var(--muted); font-size:.92rem; }
.tick{ flex:none; display:flex; align-items:center; gap:.45rem; border:1.5px solid var(--line); border-radius:12px; padding:.4rem .75rem; cursor:pointer; font-weight:700; font-size:.85rem; background:var(--card2); user-select:none; }
.tick input{ position:absolute; opacity:0; pointer-events:none; }
.tick .box{ width:18px; height:18px; border-radius:6px; border:2px solid var(--line); display:grid; place-items:center; background:var(--card); font-size:.7rem; color:#fff; line-height:1; }
.tick:focus-within{ outline:3px solid var(--ring); outline-offset:2px; }
.task.done .tick{ border-color:var(--ok-line); background:var(--ok-bg); color:var(--ok); }
.task.done .tick .box{ background:var(--ok); border-color:var(--ok); }
.task.done .tick .box::after{ content:"✓"; }
ol.how{ list-style:none; counter-reset:s; margin:0 0 1rem; padding:0; display:grid; gap:.55rem; }
ol.how li{ counter-increment:s; display:flex; gap:.75rem; align-items:flex-start; }
ol.how li::before{ content:counter(s); flex:none; width:24px; height:24px; border-radius:50%; background:var(--chip); color:var(--accent-ink); font-weight:800; font-size:.78rem; display:grid; place-items:center; margin-top:1px; }
ol.how li.test::before{ background:var(--warn-bg); color:var(--warn); }
ol.how li.link::before{ background:var(--pink-bg); color:var(--pink); }
.task .schemas{ margin-bottom:.9rem; }
.task .rels{ margin:-.2rem 0 1rem; }
.how li > span, .expect li > span{ flex:1; min-width:0; overflow-wrap:anywhere; }
.questions{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:.8rem 1rem .8rem 2.1rem; margin:0 0 1rem; }
.questions li{ margin:.3rem 0; }
.expect{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:.75rem 1rem; }
.expect b{ font-size:.82rem; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); }
.expect ul{ margin:.4rem 0 0; padding:0; list-style:none; display:grid; gap:.3rem; }
.expect li{ display:flex; gap:.6rem; font-size:.92rem; }
.expect li::before{ content:"☐"; color:var(--accent-ink); font-weight:800; }
.task.done .expect li::before{ content:"☑"; color:var(--ok); }

/* submit + help */
.send ol{ margin:0; padding-left:1.2rem; display:grid; gap:.45rem; }
.send .fn-inline{ font-weight:700; word-break:break-all; }
.tips{ margin:0; padding-left:1.2rem; display:grid; gap:.45rem; color:var(--muted); font-size:.93rem; }
.tips b{ color:var(--ink); }
footer{ text-align:center; color:var(--muted); font-size:.78rem; margin-top:26px; }

@media (max-width:620px){
  .fields{ grid-template-columns:1fr 1fr; }
  .fields div:last-child{ grid-column:1 / -1; }
  .task-h{ flex-wrap:wrap; }
  .task-t{ flex:1 1 calc(100% - 60px); }
  .tick{ margin-left:56px; }
  .brand small{ display:none; }
}
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } .bars a,.task{ transition:none; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="logo">🗄️</div><div><span id="brand-t">DB Browser for SQLite</span><small id="brand-s"></small></div></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="l-hu" aria-pressed="true">HU</button>
        <button type="button" id="l-sr" aria-pressed="false">SR</button>
      </div>
      <button type="button" class="icon-btn" id="theme" aria-label="Téma">🌙</button>
    </div>
  </header>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>

<script>
(function(){
'use strict';

/* ---------- small builders ---------- */
function flagsHtml(f){ return f.map(function(x){ return '<span class="flag'+(x==='FK'?' fk':'')+'">'+x+'</span>'; }).join(''); }
function schema(name, rows){
  return '<div class="schema"><div class="schema-h">📄 '+name+'</div>'+rows.map(function(r){
    return '<div class="schema-r"><span>'+r[0]+'</span><span class="t">'+r[1]+'</span><span>'+flagsHtml(r[2])+'</span></div>';
  }).join('')+'</div>';
}
function tbl(title, heads, rows, note){
  return '<div class="mini"><div class="mini-t">'+title+'</div><div class="mini-wrap"><table><thead><tr>'+
    heads.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+c+'</td>'; }).join('')+'</tr>'; }).join('')+
    '</tbody></table></div>'+(note?'<div class="auto-note">'+note+'</div>':'')+'</div>';
}
function rel(a, b, later){ return '<div class="rel'+(later?' later':'')+'"><code>'+a+'</code><span class="ln">'+(later?'╌ ╌ ╌':'1 ─── N')+'</span><code>'+b+'</code>'+(later?'<span>'+later+'</span>':'')+'</div>'; }
function li(cls, t){ return '<li'+(cls?' class="'+cls+'"':'')+'><span>'+t+'</span></li>'; }

/* ---------- UI strings ---------- */
var UI = {
  hu:{
    brandSub:'ellenőrző gyakorlat', foot:'DB Browser for SQLite · ellenőrző gyakorlat · SQL nélkül', themeLbl:'Téma váltása',
    title:'Ellenőrző gyakorlat: <span>zene adatbázis</span>',
    intro:'Ebben a feladatsorban magad építesz fel egy adatbázist a DB Browserben: táblákat hozol létre, adatokat viszel fel, majd összekapcsolod a táblákat. A végén a kész <code>.db</code> fájlt elküldöd a tanárnak. SQL parancsot nem kell írnod.',
    noteB:'Hol találod a gombokat?',
    note:'A <code>Create Table</code> és a <code>Modify Table</code> gomb a <code>Database Structure</code> fülön van, a táblák listája fölött. Az adatokat a <code>Browse Data</code> fülön viszed fel (<code>New Record</code>, <code>Delete Record</code>). A <code>Write Changes</code> és az <code>Open Database</code> a program tetején, a fő eszköztáron található. Az <code>Execute SQL</code> fület most sem használjuk.',
    nameT:'Kezdés: add meg a neved', nameS:'A beküldött fájl neve ebből készül, hogy a tanár könnyen azonosítson.',
    lLast:'Vezetéknév', lFirst:'Keresztnév', lCls:'Osztály', pLast:'pl. Kovács', pFirst:'pl. Anna', pCls:'pl. 4.A',
    fileLbl:'A fájlod neve:', copy:'Másolás', copied:'Másolva!',
    fnHint:'Töltsd ki mindhárom mezőt, és megjelenik a fájlod pontos neve. Ékezeteket és szóközöket a program magától kicseréli.',
    fnPlaceholder:'Vezeteknev_Keresztnev_Osztaly_zene.db', planT:'Időbeosztás: összesen kb. 40 perc', planS:'Az egyes feladatok mellett látod a javasolt időt. Ha elakadsz, kérj segítséget, és ne töltsd az időt egy lépéssel. A végén hagyj 3–4 percet a mentésre és a beküldésre.', minU:'perc',
    goalT:'A kész adatbázis', goalS:'Ezt építed fel lépésről lépésre. A kapcsolatokat (FK) a 7. és a 8. feladatban állítod be.',
    relLater:'a kapcsolatot később hozod létre',
    done:'Kész', ready:'kész', expect:'Ellenőrizd magad',
    subT:'Beadás', subS:'Ha mind a 10 feladat kész, ezekkel a lépésekkel add be a munkádat.',
    sub:[
      'Kattints a <code>Write Changes</code> gombra, hogy minden módosítás el legyen mentve.',
      'Zárd be az adatbázist (<code>File → Close Database</code>), vagy lépj ki a programból.',
      'Ellenőrizd, hogy a fájl neve pontosan: <span class="fn-inline"><code class="fn-ref"></code></span>',
      'Küldd el a <code>.db</code> fájlt a tanárnak a megbeszélt módon. Csak a <code>.db</code> fájlt küldd, képernyőképet ne.'],
    helpT:'Ha elakadsz',
    help:[
      '<b>Nem látsz hibaüzenetet a 99-es azonosítónál?</b> Nézd meg az <code>Edit Pragmas</code> fülön, hogy a <code>Foreign Keys</code> be van-e jelölve, és hogy a kapcsolatot tényleg beállítottad-e a <code>Modify Table</code> ablakban.',
      '<b>Nem találod a Foreign Keys fület?</b> Régebbi verzióban <code>Constraints</code> a neve: ott az <code>Add constraint</code> listából válaszd a <code>Foreign Key</code> típust.',
      '<b>A program nem engedi a rekord felvételét vagy törlését?</b> Kapcsolat után ez nem hiba: a külső kulcs védi az adatokat.',
      '<b>Elrontottál egy táblát?</b> A <code>Database Structure</code> fülön jobb klikk a táblán, <code>Delete Table</code>, és hozd létre újra.',
      '<b>Nevek:</b> a táblák és mezők neve ékezet és szóköz nélkül, pontosan úgy legyen, ahogy a feladat írja.']
  },
  sr:{
    brandSub:'vežba za proveru', foot:'DB Browser for SQLite · vežba za proveru · bez SQL-a', themeLbl:'Promena teme',
    title:'Vežba za proveru: <span>muzička baza</span>',
    intro:'U ovom zadatku samostalno praviš bazu podataka u programu DB Browser: kreiraš tabele, uneseš podatke i na kraju povežeš tabele. Gotov <code>.db</code> fajl šalješ nastavniku. SQL komande ne treba da pišeš.',
    noteB:'Gde se nalaze dugmad?',
    note:'Dugmad <code>Create Table</code> i <code>Modify Table</code> nalaze se na kartici <code>Database Structure</code>, iznad liste tabela. Podatke unosiš na kartici <code>Browse Data</code> (<code>New Record</code>, <code>Delete Record</code>). <code>Write Changes</code> i <code>Open Database</code> su na glavnoj alatki pri vrhu programa. Karticu <code>Execute SQL</code> ni sada ne koristimo.',
    nameT:'Početak: upiši svoje ime', nameS:'Od ovoga se pravi naziv fajla koji šalješ, da te nastavnik lako prepozna.',
    lLast:'Prezime', lFirst:'Ime', lCls:'Odeljenje', pLast:'npr. Kovač', pFirst:'npr. Ana', pCls:'npr. 4.A',
    fileLbl:'Naziv tvog fajla:', copy:'Kopiraj', copied:'Kopirano!',
    fnHint:'Popuni sva tri polja i pojaviće se tačan naziv fajla. Slova sa kvačicama i razmake program sam zamenjuje.',
    fnPlaceholder:'Prezime_Ime_Odeljenje_muzika.db', planT:'Raspored vremena: ukupno oko 40 minuta', planS:'Pored svakog zadatka vidiš predloženo vreme. Ako zapneš, traži pomoć i ne gubi vreme na jedan korak. Na kraju ostavi 3–4 minuta za čuvanje i slanje.', minU:'min',
    goalT:'Gotova baza', goalS:'Ovo gradiš korak po korak. Veze (FK) podešavaš u 7. i 8. zadatku.',
    relLater:'vezu pravimo kasnije',
    done:'Gotovo', ready:'gotovo', expect:'Proveri sam',
    subT:'Predaja', subS:'Kada je svih 10 zadataka gotovo, rad predaješ ovim koracima.',
    sub:[
      'Klikni na <code>Write Changes</code> da sve izmene budu sačuvane.',
      'Zatvori bazu (<code>File → Close Database</code>) ili izađi iz programa.',
      'Proveri da je naziv fajla tačno: <span class="fn-inline"><code class="fn-ref"></code></span>',
      'Pošalji <code>.db</code> fajl nastavniku na dogovoren način. Šalji samo <code>.db</code> fajl, ne sliku ekrana.'],
    helpT:'Ako zapneš',
    help:[

     vis:'', ex:['Trajanje pesme „Last Train” je 260.','Pesme „Summer End” više nema u tabeli, a „Encore” postoji i pripada albumu Quiet Dawn.','U tabeli '+N.S+' ukupno ima 4 reda.','Sačuvao si izmenu.']}
    ];
  }
  return T;
}

/* ---------- state ---------- */
var lang = 'hu', theme = null, done = [], who = {l:'', f:'', c:''};
try{ var sl = localStorage.getItem('dbp2_lang'); if(sl==='hu'||sl==='sr') lang = sl; }catch(e){}
try{ theme = localStorage.getItem('dbp2_theme'); }catch(e){}
if(theme!=='dark' && theme!=='light'){ theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
try{ var sd = JSON.parse(localStorage.getItem('dbp2_done')||'[]'); if(Array.isArray(sd)) done = sd; }catch(e){}
try{ var sw = JSON.parse(localStorage.getItem('dbp2_who')||'null'); if(sw && typeof sw==='object') who = {l:sw.l||'', f:sw.f||'', c:sw.c||''}; }catch(e){}
for(var i=0;i<10;i++){ done[i] = !!done[i]; }
function save(k,v){ try{ localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); }catch(e){} }

/* ---------- file name ---------- */
var CYR = {'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s'};
function slug(s){
  var out = '';
  s = (s||'').trim();
  for(var i=0;i<s.length;i++){
    var ch = s.charAt(i), lo = ch.toLowerCase();
    if(CYR[lo]!==undefined){ var m = CYR[lo]; out += (ch!==lo) ? m.charAt(0).toUpperCase()+m.slice(1) : m; }
    else out += ch;
  }
  out = out.replace(/đ/g,'dj').replace(/Đ/g,'Dj').normalize('NFD').replace(/[̀-ͯ]/g,'');
  return out.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function fileName(){
  var l = slug(who.l), f = slug(who.f), c = slug(who.c);
  if(!l || !f || !c) return null;
  return l+'_'+f+'_'+c+'_'+(lang==='hu'?'zene':'muzika')+'.db';
}
function updateFn(){
  var fn = fileName(), U = UI[lang];
  var txt = fn || U.fnPlaceholder;
  document.querySelectorAll('.fn-ref, .fn').forEach(function(n){ n.textContent = txt; });
  var row = document.getElementById('fnrow'); if(row) row.classList.toggle('ready', !!fn);
}

/* ---------- render ---------- */
function applyChrome(){
  var U = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-theme', theme);
  document.title = lang==='hu' ? 'Ellenőrző gyakorlat — Zene adatbázis' : 'Vežba za proveru — Muzička baza';
  document.getElementById('brand-s').textContent = U.brandSub;
  document.getElementById('foot').textContent = U.foot;
  document.getElementById('l-hu').setAttribute('aria-pressed', lang==='hu');
  document.getElementById('l-sr').setAttribute('aria-pressed', lang==='sr');
  var tb = document.getElementById('theme'); tb.textContent = theme==='dark' ? '☀️' : '🌙'; tb.title = U.themeLbl; tb.setAttribute('aria-label', U.themeLbl);
}
function countDone(){ return done.filter(Boolean).length; }
function updateProgress(){
  var n = countDone(), U = UI[lang];
  document.querySelectorAll('.bars a').forEach(function(a,i){ a.classList.toggle('on', !!done[i]); });
  var p = document.getElementById('prog-n'); if(p) p.innerHTML = '<b>'+n+'</b> / 10 '+U.ready;
}
function render(){
  var U = UI[lang], T = buildTasks(lang), N0 = lang==='hu';
  var Ns = N0 ? ['Eloadok','Albumok','Szamok'] : ['Izvodjaci','Albumi','Pesme'];
    var h = '';
  h += '<section class="hero"><h1>'+U.title+'</h1><p>'+U.intro+'</p></section>';
  h += '<div class="note"><b>'+U.noteB+'</b> '+U.note+'</div>';
  h += '<div class="note plan"><b>⏱ '+U.planT+'</b> '+U.planS+'</div>';
  /* target overview */
  var sE = schema(Ns[0],[['id','INTEGER',['PK','AI']],[N0?'nev':'ime','TEXT',['NN']],[N0?'orszag':'drzava','TEXT',[]]]);
  var sA = schema(Ns[1],[['id','INTEGER',['PK','AI']],[N0?'cim':'naslov','TEXT',['NN']],[N0?'kiadas_eve':'godina_izdanja','INTEGER',[]],[N0?'eloado_id':'izvodjac_id','INTEGER',['FK']]]);
  var sS = schema(Ns[2],[['id','INTEGER',['PK','AI']],[N0?'cim':'naslov','TEXT',['NN']],[N0?'hossz_mp':'trajanje_s','INTEGER',[]],['album_id','INTEGER',['FK']]]);
  h += '<section class="card"><h2>'+U.goalT+'</h2><p class="sub">'+U.goalS+'</p><div class="schemas">'+sE+sA+sS+'</div>'+
       '<div class="rels">'+rel(Ns[0]+'.id',Ns[1]+'.'+(N0?'eloado_id':'izvodjac_id'))+rel(Ns[1]+'.id',Ns[2]+'.album_id')+'</div></section>';
  /* sticky progress */
  var bars = ''; for(var i=0;i<10;i++){ bars += '<a href="#t'+(i+1)+'" aria-label="'+(i+1)+'"></a>'; }
  h += '<div class="prog"><div class="prog-in"><div class="bars">'+bars+'</div><div class="prog-n" id="prog-n"></div></div></div>';
  /* tasks */
  T.forEach(function(t,i){
    h += '<article class="task'+(done[i]?' done':'')+'" id="t'+(i+1)+'" data-i="'+i+'">'+
      '<header class="task-h"><div class="num">'+(i<9?'0':'')+(i+1)+'</div><div class="task-t"><h2>'+t.t+'</h2><p>'+t.g+' <span class="min">⏱ ~'+MIN[i]+' '+U.minU+'</span></p></div>'+
      '<label class="tick"><input type="checkbox" data-i="'+i+'"'+(done[i]?' checked':'')+'><span class="box"></span><span>'+U.done+'</span></label></header>'+
      '<ol class="how">'+t.how.join('')+'</ol>'+(t.vis||'')+
      '<div class="expect"><b>'+U.expect+'</b><ul>'+t.ex.map(function(x){ return '<li><span>'+x+'</span></li>'; }).join('')+'</ul></div></article>';
  });
  /* submit + help */
  h += '<section class="card send"><h2>'+U.subT+'</h2><p class="sub">'+U.subS+'</p><ol>'+U.sub.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ol></section>';
  h += '<section class="card"><h2>'+U.helpT+'</h2><ul class="tips">'+U.help.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul></section>';
  document.getElementById('app').innerHTML = h;
  updateFn(); updateProgress();
  bind();
}
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function bind(){
  document.querySelectorAll('.tick input').forEach(function(cb){
    cb.addEventListener('change', function(){
      var i = +cb.getAttribute('data-i'); done[i] = cb.checked; save('dbp2_done', done);
      var card = document.getElementById('t'+(i+1)); if(card) card.classList.toggle('done', cb.checked);
      updateProgress();
    });
  });
}

document.getElementById('l-hu').addEventListener('click', function(){ lang='hu'; save('dbp2_lang','hu'); applyChrome(); render(); });
document.getElementById('l-sr').addEventListener('click', function(){ lang='sr'; save('dbp2_lang','sr'); applyChrome(); render(); });
document.getElementById('theme').addEventListener('click', function(){ theme = theme==='dark'?'light':'dark'; save('dbp2_theme', theme); applyChrome(); });

applyChrome(); render();
})();
</script>
