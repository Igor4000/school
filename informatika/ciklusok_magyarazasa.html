<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>For és While ciklusok magyarázata · Középiskolásoknak</title>
  <!-- Betűtípus a könnyed, barátságos olvasáshoz -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Source+Code+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #f7f3e8 0%, #f0ebe0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      max-width: 950px;
      width: 100%;
      background: rgba(255, 251, 245, 0.9);
      backdrop-filter: blur(16px);
      background: #fffef7;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.08), 0 10px 20px rgba(0, 0, 0, 0.05);
      border-radius: 2.5rem;
      padding: 2rem 2.2rem 2.5rem;
      border: 1px solid rgba(180, 150, 110, 0.2);
      transition: all 0.2s ease;
    }

    h1 {
      font-weight: 600;
      font-size: 2.1rem;
      letter-spacing: -0.5px;
      color: #4a3724;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
      border-bottom: 2px dashed #d9c6a5;
      padding-bottom: 0.8rem;
    }
    h1 span {
      background: #e6d7bd;
      font-size: 1.6rem;
      padding: 0.2rem 0.8rem;
      border-radius: 3rem;
    }

    .tab-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 2px solid #cfbc93;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
      padding: 0.7rem 2rem;
      border-radius: 3rem;
      color: #5e4a32;
      cursor: pointer;
      background: #fef9ed;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .tab-btn i {
      font-style: normal;
      font-size: 1.3rem;
    }
    .tab-btn:hover {
      background: #f7edd9;
      border-color: #b2966a;
    }
    .tab-btn.active {
      background: #b3925c;
      border-color: #7a623f;
      color: white;
      box-shadow: 0 10px 15px -8px rgba(120, 90, 40, 0.4);
    }

    .content-panel {
      background: #fefcf5;
      border-radius: 1.8rem;
      padding: 1.8rem 2rem;
      box-shadow: inset 0 1px 8px rgba(0,0,0,0.02);
      border: 1px solid #eadbbc;
      transition: opacity 0.15s ease;
    }

    .explanation h2 {
      font-weight: 600;
      font-size: 1.8rem;
      color: #3d2e1c;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .definition {
      background: #f7f0e0;
      padding: 1rem 1.5rem;
      border-radius: 1.5rem;
      margin: 1.2rem 0 1.8rem;
      font-weight: 500;
      color: #3f311f;
      border-left: 6px solid #b3925c;
    }

    /* ----- KIEMELT ALAP FELÉPÍTÉS DOBOZ ----- */
    .syntax-highlight {
      background: linear-gradient(135deg, #2d2a24 0%, #3a342b 100%);
      color: #fae3bc;
      font-family: 'Source Code Pro', 'Courier New', monospace;
      padding: 2rem 1.8rem;
      border-radius: 2rem;
      margin: 1.8rem 0;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2), 0 0 0 4px #d9c6a5;
      border: 2px solid #b3925c;
      position: relative;
      word-break: break-word;
      line-height: 1.5;
    }

    .syntax-highlight .keyword-syn {
      color: #e3b37c;
      font-weight: 700;
    }
    .syntax-highlight .var-syn {
      color: #f7d9aa;
      background: rgba(255,255,240,0.08);
      padding: 0.1rem 0.3rem;
      border-radius: 0.4rem;
    }
    .syntax-highlight .in-syn {
      color: #c9b58a;
      font-weight: 600;
    }
    .syntax-highlight .func-syn {
      color: #e6c384;
    }
    .syntax-highlight .colon-syn {
      color: #f0dbb0;
      font-size: 2.5rem;
      margin-left: 2px;
    }

    .syntax-label {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: #b3925c;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.3rem 1.8rem;
      border-radius: 3rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .code-block {
      background: #2d2a24;
      color: #fae3bc;
      font-family: 'Source Code Pro', 'Courier New', monospace;
      padding: 1.2rem 1.5rem;
      border-radius: 1.2rem;
      margin: 1.3rem 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .code-block span.comment {
      color: #a9b894;
    }
    .code-block span.keyword {
      color: #e3b37c;
      font-weight: 500;
    }
    .code-block span.func {
      color: #d4b77b;
    }

    ul, ol {
      margin: 1rem 0 1rem 1.5rem;
      line-height: 1.7;
      color: #3e3a31;
    }

    li {
      margin-bottom: 0.5rem;
    }

    .highlight-box {
      background: #fff3df;
      padding: 0.9rem 1.3rem;
      border-radius: 1rem;
      margin: 1.4rem 0;
      font-weight: 500;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      border: 1px solid #e7cf9e;
    }

    .badge {
      background: #b3925c;
      color: white;
      border-radius: 2rem;
      padding: 0.15rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      margin-right: 0.4rem;
    }

    hr {
      border: none;
      border-top: 1px solid #e2d0b0;
      margin: 1.8rem 0 1rem;
    }

    @media (max-width: 650px) {
      .syntax-highlight {
        font-size: 1.4rem;
        padding: 1.5rem 1rem;
      }
      .syntax-highlight .colon-syn {
        font-size: 1.8rem;
      }
      .syntax-label {
        font-size: 0.8rem;
        padding: 0.2rem 1.2rem;
        top: -15px;
      }
    }

    @media (max-width: 550px) {
      .card {
        padding: 1.5rem;
      }
      .tab-btn {
        padding: 0.6rem 1.4rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React és ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone a JSX feldolgozáshoz -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    // ----- Komponens: For ciklus magyarázata -----
    const ForExplanation = () => {
      return (
        <div className="explanation">
          <h2>🔁 For ciklus</h2>
          <div className="definition">
            A <strong>for ciklus</strong> arra való, hogy egy utasítást <strong>többször egymás után</strong> végrehajtsunk. 
            Pythonban a <code>for</code> kulcsszóval kezdjük, és általában egy <code>range()</code> függvény segít meghatározni, hányszor fusson.
          </div>

          {/* KIEMELT ALAP FELÉPÍTÉS – FOR */}
          <div className="syntax-highlight">
            <span className="syntax-label">✨ ALAP FELÉPÍTÉS ✨</span>
            <span className="keyword-syn">for</span>{' '}
            <span className="var-syn">ciklusváltozó</span>{' '}
            <span className="in-syn">in</span>{' '}
            <span className="func-syn">range</span>(kezdő, vég, lépés)<span className="colon-syn">:</span>
          </div>

          <h3 style={{marginTop:'1.5rem', color:'#5e4a32'}}>🧱 A for ciklus elemei (részletesen):</h3>
          <ul>
            <li><span className="badge">for</span> – kulcsszó, ezzel kezdődik a ciklus.</li>
            <li><span className="badge">ciklusváltozó</span> – pl. <code>i</code>, ez veszi fel sorban az értékeket.</li>
            <li><span className="badge">in</span> – kulcsszó, azt jelenti, „benne van valamiben”.</li>
            <li><span className="badge">range()</span> – meghatározza a sorozatot (számok listáját).</li>
            <li><span className="badge">kettőspont :</span> – a sor végén, utána következik a behúzott blokk.</li>
          </ul>

          <h3 style={{color:'#5e4a32'}}>📋 range() lehetőségei (példák):</h3>
          <div className="code-block">
            <span className="comment"># 1. range(5) → 0,1,2,3,4 (5 szám, 0-tól indul)</span>{'\n'}
            <span className="keyword">for</span> i <span className="keyword">in</span> <span className="func">range</span>(5):{'\n'}
            {'    '}print(i){'\n\n'}
            <span className="comment"># 2. range(2, 6) → 2,3,4,5 (kezdő:2, vég:6-1)</span>{'\n'}
            <span className="keyword">for</span> i <span className="keyword">in</span> <span className="func">range</span>(2, 6):{'\n'}
            {'    '}print(i){'\n\n'}
            <span className="comment"># 3. range(1, 10, 2) → 1,3,5,7,9 (lépésköz 2)</span>{'\n'}
            <span className="keyword">for</span> i <span className="keyword">in</span> <span className="func">range</span>(1, 10, 2):{'\n'}
            {'    '}print(i){'\n\n'}
            <span className="comment"># 4. range(10, 0, -1) → 10,9,8,...,1 (visszafelé)</span>{'\n'}
            <span className="keyword">for</span> i <span className="keyword">in</span> <span className="func">range</span>(10, 0, -1):{'\n'}
            {'    '}print(i)
          </div>

          <h3 style={{color:'#5e4a32', marginTop:'1.2rem'}}>🧪 Hogyan működik lépésről lépésre?</h3>
          <ol>
            <li>A program eléri a <code>for</code> sort.</li>
            <li>Létrehozza a ciklusváltozót (pl. <code>i</code>).</li>
            <li>A <code>range()</code> első elemét beleteszi a változóba.</li>
            <li>Végrehajtja a behúzott utasításokat.</li>
            <li>Visszaugrik a <code>for</code> sorhoz, jön a következő elem.</li>
            <li>Ha nincs több elem, a ciklus befejeződik.</li>
          </ol>

          <div className="highlight-box">
            📌 <strong>Fontos:</strong> A ciklusmag mindig azonos behúzással (általában 4 szóköz) kezdődik. 
            Pythonban ez kötelező!
          </div>
        </div>
      );
    };

    // ----- Komponens: While ciklus magyarázata -----
    const WhileExplanation = () => {
      return (
        <div className="explanation">
          <h2>🔄 While ciklus</h2>
          <div className="definition">
            A <strong>while ciklus</strong> addig ismétli az utasításokat, <strong>amíg egy feltétel igaz</strong>. 
            Előre nem mindig tudjuk, hányszor fut le – a feltételtől függ.
          </div>

          {/* KIEMELT ALAP FELÉPÍTÉS – WHILE */}
          <div className="syntax-highlight">
            <span className="syntax-label">✨ ALAP FELÉPÍTÉS ✨</span>
            <span className="keyword-syn">while</span>{' '}
            <span className="var-syn">feltétel</span><span className="colon-syn">:</span>
          </div>

          <h3 style={{marginTop:'1.5rem', color:'#5e4a32'}}>🧱 A while ciklus részei (részletesen):</h3>
          <ul>
            <li><span className="badge">while</span> – kulcsszó, ez indítja a ciklust.</li>
            <li><span className="badge">feltétel</span> – logikai kifejezés (igaz/hamis), pl. <code>x &lt; 10</code>.</li>
            <li><span className="badge">kettőspont :</span> – a sor végén.</li>
            <li><span className="badge">ciklusmag</span> – behúzott utasítások.</li>
            <li><span className="badge">léptetés / változtatás</span> – általában a cikluson belül módosítjuk a feltételben szereplő változót.</li>
          </ul>

          <div className="highlight-box">
            ⚠️ <strong>Vigyázz!</strong> Ha a feltétel soha nem lesz hamis, a ciklus örökké fut (végtelen ciklus).
          </div>

          <h3 style={{color:'#5e4a32'}}>✏️ Egyszerű példa:</h3>
          <div className="code-block">
            <span className="comment"># Számláló 1-től 5-ig</span>{'\n'}
            szam = 1{'\n'}
            <span className="keyword">while</span> szam &lt;= 5:{'\n'}
            {'    '}print(szam){'\n'}
            {'    '}szam = szam + 1   <span className="comment"># növeljük, hogy egyszer vége legyen</span>
          </div>

          <h3 style={{color:'#5e4a32', marginTop:'1.2rem'}}>🔍 Működés lépései:</h3>
          <ol>
            <li>Ellenőrzi a feltételt (pl. <code>szam &lt;= 5</code>).</li>
            <li>Ha <strong>igaz</strong>, végrehajtja a ciklusmagot.</li>
            <li>Utána újra ellenőrzi a feltételt.</li>
            <li>Ha <strong>hamis</strong>, kilép a ciklusból, és folytatja a program.</li>
          </ol>

          <div className="highlight-box" style={{background:'#f9efe2'}}>
            🧠 <strong>Mikor használjuk?</strong> Amikor nem tudjuk pontosan, hány ismétlés kell. 
            Például: „kérj be jelszót, amíg helyeset nem ír”.
          </div>

          <h3 style={{color:'#5e4a32'}}>🔄 További while változatok:</h3>
          <ul>
            <li><strong>while True:</strong> – végtelen ciklus, amit <code>break</code>-kel állítunk meg.</li>
            <li><strong>while változó:</strong> – pl. <code>while jatek_aktiv:</code> (logikai változó).</li>
            <li><strong>while ... else:</strong> – a ciklus utáni <code>else</code> ág akkor fut, ha a feltétel hamissá vált (nem break miatt lépett ki).</li>
          </ul>

          <div className="code-block">
            <span className="comment"># while ciklus else ággal</span>{'\n'}
            proba = 0{'\n'}
            <span className="keyword">while</span> proba &lt; 3:{'\n'}
            {'    '}print("Próbálkozás:", proba+1){'\n'}
            {'    '}proba += 1{'\n'}
            <span className="keyword">else</span>:{'\n'}
            {'    '}print("A ciklus szabályosan ért véget.")
          </div>
        </div>
      );
    };

    // ----- Fő App komponens -----
    const App = () => {
      const [activeTab, setActiveTab] = useState('for'); // 'for' vagy 'while'

      return (
        <div className="card">
          <h1>
            <span>🐍</span> Python ciklusok közérthetően
          </h1>
          
          <div className="tab-container">
            <button 
              className={`tab-btn ${activeTab === 'for' ? 'active' : ''}`}
              onClick={() => setActiveTab('for')}
            >
              <i>🔁</i> For ciklus
            </button>
            <button 
              className={`tab-btn ${activeTab === 'while' ? 'active' : ''}`}
              onClick={() => setActiveTab('while')}
            >
              <i>🔄</i> While ciklus
            </button>
          </div>

          <div className="content-panel">
            {activeTab === 'for' ? <ForExplanation /> : <WhileExplanation />}
          </div>

          <hr />
        </div>
      );
    };

    // Renderelés a root div-be
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
