<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Browser for SQLite – Lépésről lépésre / Korak po korak</title>
<style>
:root{
  --bg:#fdfbf7; --card:#ffffff; --ink:#26221c; --muted:#7a7264;
  --teal:#0d9488; --teal-soft:#ccfbf1; --coral:#f97066; --coral-soft:#ffe4e0;
  --amber:#d97706; --amber-soft:#fef3c7; --border:#ece5d8; --code:#1c1917;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
.container{max-width:1000px;margin:0 auto;padding:24px 18px 100px}
header{position:relative;text-align:center;padding:80px 20px 60px;
  background:linear-gradient(135deg,#ccfbf1 0%,#fef3c7 55%,#ffe4e0 100%);
  border-radius:0 0 48px 48px;overflow:hidden}
header::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 15% 20%,rgba(13,148,136,.18),transparent 40%),
             radial-gradient(circle at 85% 80%,rgba(249,112,102,.18),transparent 40%)}
header>*{position:relative;z-index:1}
header h1{font-size:2.6rem;color:var(--teal);margin-bottom:12px}
header p.sub{color:#57534e;font-size:1.12rem;max-width:720px;margin:0 auto}
.nav-pills{display:inline-flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.nav-pills a{background:rgba(255,255,255,.75);border:1px solid var(--border);color:var(--ink);
  padding:8px 18px;border-radius:30px;text-decoration:none;font-weight:600;font-size:.9rem;transition:.2s}
.nav-pills a:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.lang-switch{position:absolute;top:20px;right:20px;z-index:2;display:flex;background:#fff;
  border:1px solid var(--border);border-radius:30px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.lang-switch button{background:transparent;border:none;color:var(--muted);padding:9px 20px;cursor:pointer;font-weight:600;font-size:.95rem;transition:.2s}
.lang-switch button.active{background:var(--teal);color:#fff}
section{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 36px;
  margin:30px 0;box-shadow:0 6px 24px rgba(38,34,28,.06)}
section h2{color:var(--teal);font-size:1.6rem;margin-bottom:16px;padding-bottom:10px;border-bottom:3px solid var(--teal-soft)}
section h3{color:var(--coral);margin:22px 0 10px;font-size:1.15rem}
p{margin-bottom:12px}
ul,ol{margin:0 0 12px 22px}
li{margin-bottom:7px}
b{color:#1c1917}
kbd{background:var(--code);color:#fef3c7;padding:2px 10px;border-radius:6px;font-family:Consolas,monospace;font-size:.88em}
code,pre{font-family:Consolas,monospace;background:var(--code);color:#99f6e4;border-radius:8px}
code{padding:2px 8px;font-size:.92em}
pre{padding:16px 20px;overflow-x:auto;margin:14px 0}
pre .kw{color:#fdba74;font-weight:700}pre .st{color:#a7f3d0}pre .cm{color:#a8a29e;font-style:italic}
table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.95rem;display:block;overflow-x:auto}
thead th{background:var(--teal);color:#fff;padding:12px 14px;text-align:left;white-space:nowrap}
tbody td{padding:11px 14px;border:1px solid var(--border);vertical-align:top}
tbody tr:nth-child(even){background:#fafaf7}
.tip{background:var(--amber-soft);border-left:5px solid var(--amber);border-radius:10px;padding:16px 20px;margin:16px 0}
.tip .label{color:var(--amber);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:1px}
.note{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:10px;padding:16px 20px;margin:16px 0}
.note .label{color:var(--teal);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:1px}
.steps{counter-reset:st;margin:18px 0}
.step{display:flex;gap:16px;margin-bottom:18px;background:#fafaf7;border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.step::before{counter-increment:st;content:counter(st);flex-shrink:0;width:38px;height:38px;border-radius:50%;
  background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.step b{color:var(--teal)}
/* interaktív képernyő-utánzat */
.mock{background:#fafaf7;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:18px 0}
.mock-bar{background:var(--code);color:#e7e5e4;padding:8px 14px;font-size:.85rem;display:flex;gap:8px;align-items:center}
.mock-bar span.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.mock-tabs{display:flex;gap:4px;background:#f5f5f4;padding:8px 10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.mock-tabs button{border:1px solid var(--border);border-bottom:none;background:#fff;padding:8px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;color:var(--muted);font-size:.9rem}
.mock-tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.mock-body{padding:18px;min-height:120px}
/* SQL játszótér */
.play{background:var(--code);border-radius:16px;padding:18px;margin:18px 0;color:#e7e5e4}
.play textarea{width:100%;background:#292524;color:#99f6e4;border:1px solid #44403c;border-radius:10px;
  padding:12px 14px;font-family:Consolas,monospace;font-size:.95rem;min-height:70px;resize:vertical}
.play .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.play button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
.play button.sec{background:#44403c}
.play .out{background:#fff;color:var(--ink);border-radius:10px;margin-top:12px;padding:14px;overflow-x:auto}
.play .out table{margin:0;display:table}
.play .err{color:var(--coral);font-weight:700}
.quiz{background:#fafaf7;border:2px dashed var(--coral);border-radius:14px;padding:20px;margin:18px 0}
.quiz button{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;margin:8px 0;cursor:pointer;transition:.15s;font-size:.98rem}
.quiz button:hover{border-color:var(--teal);background:var(--teal-soft)}
.quiz button.correct{background:#d1fae5;border-color:#059669}
.quiz button.wrong{background:var(--coral-soft);border-color:var(--coral)}
.quiz .feedback{font-weight:600;margin-top:8px;min-height:26px}
.checklist label{display:flex;gap:10px;align-items:flex-start;background:#fafaf7;border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:.2s}
.checklist input{margin-top:5px;accent-color:var(--teal);transform:scale(1.2)}
.checklist label.done{background:var(--teal-soft);border-color:var(--teal);text-decoration:line-through;color:var(--muted)}
footer{text-align:center;color:var(--muted);margin-top:44px;font-size:.9rem}
footer a{color:var(--teal)}
@media(max-width:640px){header h1{font-size:1.8rem}.lang-switch{position:static;margin-bottom:18px;display:inline-flex}section{padding:22px}}
</style>
</head>

<footer><span data-i18n="footer"></span> · <a href="index.html" data-i18n="backlink"></a></footer>

let lang = 'hu';
let activeTab = 0;

// ---- mini SQL motor a játszótérhez ----
const DATA = [
  {azonosito:1, nev:"Kovács Anna", osztaly:"10.A", atlag:4.6},
  {azonosito:2, nev:"Nagy Péter", osztaly:"10.A", atlag:4.2},
  {azonosito:3, nev:"Szabó Réka", osztaly:"11.B", atlag:3.8},
  {azonosito:4, nev:"Tóth Gábor", osztaly:"10.A", atlag:3.4},
  {azonosito:5, nev:"Kiss Luca", osztaly:"11.B", atlag:4.9},
  {azonosito:6, nev:"Fekete Bence", osztaly:"11.B", atlag:2.7}
];

function runSQL(){
  const t = T[lang];
  const sql = document.getElementById('sql-input').value.trim();
  const out = document.getElementById('sql-out');
  try{
    let m = sql.match(/^select\s+(.+?)\s+from\s+diakok\s*(?:where\s+(.+?))?\s*(?:order\s+by\s+(\w+)(?:\s+(asc|desc))?)?\s*;?$/i);
    if(!m) throw 0;
    let cols = m[1].trim();
    let rows = DATA.slice();
    if(m[2]){
      let w = m[2].trim();
      let wm = w.match(/^(\w+)\s*(=|>=|<=|>|<)\s*('([^']*)'|([\d.]+))$/);
      if(!wm) throw 0;
      let col = wm[1].toLowerCase(), op = wm[2], raw = wm[4] !== undefined ? wm[4] : parseFloat(wm[5]);
      rows = rows.filter(r=>{
        let v = r[col];
        if(v === undefined) throw 0;
        let a = (typeof v === 'number') ? v : String(v);
        let b = (typeof v === 'number') ? raw : String(raw);
        switch(op){
          case '=': return a == b;
          case '>': return a > b;
          case '<': return a < b;
          case '>=': return a >= b;
          case '<=': return a <= b;
        }
      });
    }
    let keys;
    if(cols === '*') keys = ['azonosito','nev','osztaly','atlag'];
    else {
      keys = cols.split(',').map(s=>s.trim().toLowerCase());
      if(keys.some(k=>!(k in DATA[0]))) throw 0;
    }
    if(m[3]){
      let oc = m[3].toLowerCase(), dir = (m[4]||'asc').toLowerCase();
      if(!(oc in DATA[0])) throw 0;
      rows.sort((a,b)=> a[oc] > b[oc] ? 1 : a[oc] < b[oc] ? -1 : 0);
      if(dir === 'desc') rows.reverse();
    }
    if(!rows.length){ out.innerHTML = `<span class="err">${t.empty}</span>`; return; }
    out.innerHTML = `<table><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${r[k]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }catch(e){
    out.innerHTML = `<span class="err">⚠ ${t.err}</span>`;
  }
}

function preset(i){
  document.getElementById('sql-input').value = T[lang].presetsSQL[i];
  runSQL();
}

function showTab(i){
  activeTab = i;
  const t = T[lang];
  document.querySelectorAll('#mock-tabs button').forEach((b,j)=>b.classList.toggle('active', j===i));
  document.getElementById('mock-body').innerHTML = t.d3tabs[i][1];
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k] !== undefined) el.innerHTML = t[k];
  });
  document.getElementById('btn-hu').classList.toggle('active', lang==='hu');
  document.getElementById('btn-sr').classList.toggle('active', lang==='sr');

  document.getElementById('nav').innerHTML = t.nav.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join('');
  document.getElementById('d1list').innerHTML = t.d1list.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('d2steps').innerHTML = t.d2steps.map(x=>`<div class="step"><div>${x}</div></div>`).join('');
  document.getElementById('d4steps').innerHTML = t.d4steps.map(x=>`<div class="step"><div>${x}</div></div>`).join('');
  document.getElementById('d5steps').innerHTML = t.d5steps.map(x=>`<div class="step"><div>${x}</div></div>`).join('');
  document.getElementById('d4sql').innerHTML = t.d4sql;

  document.getElementById('mock-tabs').innerHTML =
    t.d3tabs.map((tb,i)=>`<button class="${i===activeTab?'active':''}" onclick="showTab(${i})">${tb[0]}</button>`).join('');
  document.getElementById('mock-body').innerHTML = t.d3tabs[activeTab][1];

  document.getElementById('d6table').innerHTML = `<table>
    <thead><tr>${t.d6tableHead.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.d6table.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  document.getElementById('run-btn').textContent = t.run;
  [0,1,2].forEach(i=>document.getElementById('pr'+i).textContent = t.presets[i]);

  document.getElementById('tasks').innerHTML = t.d7tasks.map((x,i)=>
    `<label><input type="checkbox" onchange="this.parentElement.classList.toggle('done',this.checked)"><span>${x}</span></label>`).join('');

  document.getElementById('quiz-wrap').innerHTML = t.quizzes.map((q,qi)=>`
    <div class="quiz" id="quiz${qi}">
      <p><b>${qi+1}. ${q.q}</b></p>
      ${q.a.map((a,i)=>`<button onclick="answer(${qi},${i},this)">${a}</button>`).join('')}
      <div class="feedback"></div>
    </div>`).join('');

  runSQL();
}

function answer(qi, i, btn){
  const q = T[lang].quizzes[qi];
  const wrap = document.getElementById('quiz'+qi);
  wrap.querySelectorAll('button').forEach(b=>b.classList.remove('correct','wrong'));
  const fb = wrap.querySelector('.feedback');
  if(i === q.correct){
    btn.classList.add('correct');
    fb.style.color = '#059669';
    fb.textContent = q.good;
  } else {
    btn.classList.add('wrong');
    fb.style.color = '#f97066';
    fb.textContent = q.bad;
  }
}

function setLang(l){ lang = l; render(); }

render();
