<!--
================================================================================
PLAN TRI ČASA — Vežba: Ravnomerno ubrzano kretanje kolica niz strmu ravan
(Galilejev ogled). Samostalan rad, 3 × 45 min, učenik sam meri ručnom
štopericom (brzina simulacije ×1 / ×2).
================================================================================

A. ANALIZA (skripta „Kinematika, Deo I", pogl. 7)
- Zakon: s = v0 · t + (1 : 2) · a · t², kolica kreću iz mirovanja (v0 = 0),
  pa je s = (1 : 2) · a · t².
- Meri se: vreme t od puštanja do udara u graničnik (ručna štoperica, 0,01 s).
- Nezavisna promenljiva: put s do graničnika (bira učenik).
- Traži se: ubrzanje a. Linearizacija: grafik s–t² je prava, nagib = a : 2,
  dakle a = 2 · nagib.
- Svaki put se meri 3 puta → t_sr; nesigurnost Δt_sr ≈ 0,2 s : √n,
  Δ(t²) = 2 · t · Δt. Δa iz graničnih pravih: Δa = k_max − k_min.

PROCENA TRAJANJA (realan tempo, ×1)
- Priprema: ≈ 10 min (uvod, podaci o učeniku, izbor ugla α).
- Merenje: 6–8 puteva × 3 puštanja = 18–24 očitavanja. Jedno očitavanje:
  odbrojavanje 1,5 s + kretanje 1–3 s + ≈ 0,7–1 min za vraćanje kolica,
  štopericu i upis → ≈ 18–24 min (uz pomeranje graničnika).
- Obrada I: kolone t_sr i t_sr² ≈ 2 min po redu (12–16 min), dva grafika ≈ 5 min,
  nagib iz dve tačke ≈ 8 min.
- Obrada II: a = 2 · nagib ≈ 5 min, nesigurnost Δa ≈ 10 min, rezultat ≈ 5 min.
- Zaključak: ≈ 15–20 min.

Čas | Pogledi              | Koraci                                              | Procena     | Čeklista
----+----------------------+-----------------------------------------------------+-------------+--------------------------------------------
 1  | Priprema, Merenje    | podaci, ugao α; 6–8 puteva × 3 merenja               | ≈ 30–35 min | ime; ≥ 6 puteva po 3 merenja; raspon ≥ 1 m
 2  | Obrada I             | t_sr, t_sr²; grafici s–t i s–t²; tačke A, B; nagib   | ≈ 30–35 min | tabela tačna; grafici; A i B; nagib
 3  | Obrada II, Zaključak | a = 2 · nagib; Δa; a ± Δa; zaključak                | ≈ 40 min    | a; Δa; rezultat; zaključak

Raspored je zadao nastavnik (1. merenje, 2. t_sr, t_sr², grafici i nagib,
3. a, Δa i zaključak). Rezerva od ≈ 10 min na časovima 1 i 2 služi za
ponavljanje promašenih merenja — nove aktivnosti nisu dodavane.

PODACI IZ SVESKE (rad na više uređaja / izgubljeni podaci)
- Učenik svako merenje odmah prepisuje u svesku. Prozor „Kraj časa" posle
  1. i 2. časa pokazuje šta mora da ima zapisano (ugao, tabelu merenja,
  a posle 2. časa i tačke A, B i nagib).
- Na Obradi I, Obradi II i Zaključku kartica „Podaci iz sveske" služi za
  ponovni unos ugla i merenja; tabela, grafici i granične prave crtaju se
  iz unetih podataka. Na Obradi II nagib iz sveske se unosi i proverava
  (dozvoljeno odstupanje 8 % od najbolje prave).

RAČUNANJE (sve računa učenik digitronom; program samo crta i proverava)
- Program crta grafike, najbolju pravu i granične prave i proverava upisano.
- Učenik računa: kolone tabele, nagib iz tačaka A i B, a iz nagiba,
  Δ(t²) za prvu i poslednju tačku, k_max i k_min, Δa, zaokruživanje rezultata i odstupanje u %.
- Automatsko popunjavanje tabele i linearna regresija vidljivi su samo uz
  „Pomoć (za nastavnika)" (O modelu).
- Na 3. času se uz merenja iz sveske unose i izračunate kolone tabele
  i nagib — ništa se ne računa ponovo.

PRETPOSTAVKE (skripta je teorijska i nema protokol vežbe)
- Staza 2,00 m; startna linija 10 cm od gornjeg kraja; graničnik 0,20–1,80 m
  u koracima od 5 cm.
- Ugao α: 2°–8°, podrazumevano 3° (vremena ≈ 1–3 s).
- Referentna vrednost: a = g · sin α, g = 9,81 m/s² iz skripte; sam izraz sa
  sin α je iz dinamike, pa je naveden kao pretpostavka. Model dodaje
  kotrljajuće trenje μ = 0,0015, inerciju točkova (faktor 1 : 1,02) i mali
  otpor vazduha, pa je očekivana vrednost ≈ 5 % manja od g · sin α.
- Δt jednog ručnog merenja ≈ 0,2 s; za srednju vrednost n merenja 0,2 s : √n.
- Uslov pokrivenosti: bar 6 puteva sa po 3 merenja, raspon bar 1,00 m.
================================================================================
-->

<script>
(function(){
'use strict';

/* =========================================================
   1. POMOĆNE FUNKCIJE
   ========================================================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const FR=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const G=9.81;
function fmt(x,dec){
  if(x==null||!isFinite(x)) return '—';
  let s=Number(x).toFixed(dec);
  if(/^-0(\.0*)?$/.test(s)) s=s.slice(1);
  return s.replace('.',',').replace('-','−');
}
function fmtSig(x,sig){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  const d=sig-1-Math.floor(Math.log10(Math.abs(x)));
  return fmt(x,Math.max(0,Math.min(8,d)));
}
function num(v){
  if(v==null) return NaN;
  const s=String(v).trim().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(',','.');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
function near(a,ex,abs,rel){return isFinite(a)&&isFinite(ex)&&Math.abs(a-ex)<=abs+Math.abs(ex)*rel;}
function nearAny(a,list,abs,rel){return (list||[]).some(e=>near(a,e,abs,rel));}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function fmtTime(t){
  const cs=Math.max(0,Math.floor(t*100+1e-6));
  const m=Math.floor(cs/6000),r=cs-m*6000,s=Math.floor(r/100),c=r%100;
  return m+':'+String(s).padStart(2,'0')+','+String(c).padStart(2,'0');
}
function decimalsOf(str){const s=String(str).trim().replace(',','.');const i=s.indexOf('.');return i<0?0:s.length-i-1;}
function sigDigits(str){let s=String(str).trim().replace(',','.').replace(/^[-+−]/,'').replace('.','');s=s.replace(/^0+/,'');return s.length;}
function disp(s){return String(s).replace('.',',').replace('-','−');}
function linfit(pts){
  const n=pts.length; if(n<2) return null;
  let sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(p=>{sx+=p.x;sy+=p.y;sxx+=p.x*p.x;sxy+=p.x*p.y;});
  const D=n*sxx-sx*sx; if(Math.abs(D)<1e-14) return null;
  const k=(n*sxy-sx*sy)/D,b=(sy-k*sx)/n,ym=sy/n;
  let ssr=0,sst=0;
  pts.forEach(p=>{const e=p.y-(k*p.x+b);ssr+=e*e;sst+=(p.y-ym)*(p.y-ym);});
  return {k,n:b,r2:sst>0?1-ssr/sst:1};
}
/* granične prave: kroz krajeve „brkova" prve i poslednje tačke (po x) */
function bounds(pts){
  if(pts.length<2) return null;
  const s=pts.slice().sort((a,b)=>a.x-b.x),p1=s[0],p2=s[s.length-1],dy=p2.y-p1.y;
  const d1=p1.dx||0,d2=p2.dx||0;
  const xa=p1.x+d1,xb=p2.x-d2,xc=p1.x-d1,xd=p2.x+d2;
  if(xb-xa<=1e-9||xd-xc<=1e-9||!(dy>0)) return null;
  const kmax=dy/(xb-xa),kmin=dy/(xd-xc);
  return {kmax,nmax:p1.y-kmax*xa,kmin,nmin:p1.y-kmin*xc};
}

/*EX-BEGIN*/
/* =========================================================
   2. VEŽBA: Ravnomerno ubrzano kretanje kolica niz strmu ravan
   ========================================================= */
const EX=(function(){
  const PX0=40,PXL=560,PY0=250,TR=2.0;      // staza 2,00 m = 560 px; obrtna tačka je desni kraj (600,250)
  const PXR=PX0+PXL,PPM=PXL/TR;             // piksela po metru
  const U0=0.10,CART=0.14,WR=0.02;          // startna linija od levog kraja, dužina kolica, poluprečnik točka (m)
  const MU=0.0015,KAP=0.02,CD=0.004;        // kotrljanje, inercija točkova, otpor vazduha (1/m)
  const JIT=0.004,DT_H=0.2;                 // razlika između puštanja; nesigurnost jednog ručnog merenja
  const rad=a=>a*Math.PI/180;
  const aMod=ang=>G*(Math.sin(rad(ang))-MU*Math.cos(rad(ang)))/(1+KAP);
  const acc=(v,a)=>a-CD*v*Math.abs(v);
  function rk(x,v,a,h){
    const k1v=acc(v,a),k2v=acc(v+h*k1v/2,a),k3v=acc(v+h*k2v/2,a),k4v=acc(v+h*k3v,a);
    const x1=x+h*(v+2*(v+h*k1v/2)+2*(v+h*k2v/2)+(v+h*k3v))/6;
    return [x1,v+h*(k1v+2*k2v+2*k3v+k4v)/6];
  }
  const px=u=>PX0+u*PPM;
  const sim={phase:'ready',cnt:0,x:0,v:0,tt:0,a:0,sRun:null,flash:0};
  let last=null,actx=null; const el={};

  function back(){sim.phase='ready';sim.cnt=0;sim.x=0;sim.v=0;sim.tt=0;sim.sRun=null;sim.flash=0;}
  function go(){
    if(sim.phase!=='ready') return;
    sim.phase='count';sim.cnt=0;sim.sRun=S.sPos;sim.x=0;sim.v=0;sim.tt=0;
    sim.a=aMod(S.p.ang)*(1+JIT*randn());
    last={s:S.sPos,tTrue:null,done:false,used:false};
    try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC) actx=new AC();}if(actx&&actx.state==='suspended') actx.resume();}catch(e){}
  }
  function click(){
    try{if(!actx) return;const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
      o.type='square';o.frequency.value=1300;g.gain.setValueAtTime(0.10,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.07);}catch(e){}
  }
  function advance(dt){
    if(sim.flash>0) sim.flash=Math.max(0,sim.flash-dt);
    if(!(dt>0)) return;
    if(sim.phase==='count'){
      sim.cnt+=dt;
      if(sim.cnt<1.5) return;
      dt=sim.cnt-1.5;sim.phase='run';sim.tt=0;sim.x=0;sim.v=0;
      if(!(dt>0)) return;
    }
    if(sim.phase!=='run') return;
    const n=Math.max(1,Math.ceil(dt/0.002)),h=dt/n;
    for(let i=0;i<n;i++){
      const x0=sim.x,r=rk(sim.x,sim.v,sim.a,h),x1=r[0];
      if(!isFinite(x1)){back();return;}
      if(x1>=sim.sRun){
        const th=sim.tt+h*(sim.sRun-x0)/(x1-x0);
        sim.tt=th;sim.x=sim.sRun;sim.v=0;sim.phase='hit';sim.flash=0.6;
        if(last){last.tTrue=th;last.done=true;}
        click();break;
      }
      sim.x=x1;sim.v=r[1];sim.tt+=h;
      if(sim.tt>60){back();return;}
    }
  }
  function sceneSVG(){
    let tk='';
    for(let i=0;i<=38;i++){
      const x=px(U0+i*0.05).toFixed(1),big=i%4===0,mid=i%2===0;
      tk+=`<line x1="${x}" y1="${PY0-12}" x2="${x}" y2="${PY0-12+(big?10:mid?6:3)}" stroke="#eef3f8" stroke-width="${big?1.4:.8}"/>`;
      if(big) tk+=`<text x="${x}" y="${PY0+13}" text-anchor="middle" font-size="11" fill="#cfd8e6">${fmt(i*0.05,i?1:0)}</text>`;
    }
    const c0=px(U0);
    return `<svg viewBox="0 0 640 300" role="img" aria-label="Kolica na nagnutoj stazi sa skalom u metrima, graničnikom na izabranom putu s i podmetačem koji određuje ugao">
<line x1="0" y1="${PY0+1}" x2="640" y2="${PY0+1}" stroke="#3b475b" stroke-width="2"/>
<line x1="${PXR-150}" y1="${PY0}" x2="${PXR}" y2="${PY0}" stroke="#5d6b80" stroke-dasharray="4 4"/>
<path id="arc" d="" fill="none" stroke="#8f9db2" stroke-width="1.3"/>
<rect id="sup" x="0" y="0" width="34" height="0" fill="#8d7b60" rx="2"/>
<g id="trackG">
  <rect x="${PX0}" y="${PY0-12}" width="${PXL}" height="12" rx="2" fill="#6f7d92"/>
  <rect x="${PX0}" y="${PY0-12}" width="${PXL}" height="2.5" fill="#b9c4d4"/>
  ${tk}
  <text x="${PXR-14}" y="${PY0+13}" font-size="11" fill="#9fb0c6">m</text>
  <line x1="${c0}" y1="${PY0-30}" x2="${c0}" y2="${PY0-12}" stroke="#eef3f8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="${c0}" y="${PY0-34}" text-anchor="middle" font-size="10" fill="#cfd8e6">start</text>
  <g id="stopG"><rect id="stopR" x="${c0}" y="${PY0-44}" width="10" height="32" rx="2" style="fill:var(--acc)"/><text id="klik" x="${c0+5}" y="${PY0-50}" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd27a" opacity="0">klik!</text></g>
  <rect id="hold" x="${(c0-CART*PPM-14).toFixed(1)}" y="${PY0-40}" width="10" height="28" rx="3" fill="#c9b18e"/>
  <g id="cart">
    <rect x="${(c0-CART*PPM).toFixed(1)}" y="${PY0-38}" width="${(CART*PPM).toFixed(1)}" height="16" rx="4" fill="#e9c46a" stroke="#fff3cf" stroke-width="1"/>
    <rect x="${(c0-CART*PPM+6).toFixed(1)}" y="${PY0-44}" width="14" height="7" rx="2" fill="#d1a94c"/>
    <g id="w1"><circle cx="${(c0-8).toFixed(1)}" cy="${PY0-18}" r="6" fill="#2b3442" stroke="#cfd8e6"/><line x1="${(c0-14).toFixed(1)}" y1="${PY0-18}" x2="${(c0-2).toFixed(1)}" y2="${PY0-18}" stroke="#cfd8e6"/></g>
    <g id="w2"><circle cx="${(c0-CART*PPM+8).toFixed(1)}" cy="${PY0-18}" r="6" fill="#2b3442" stroke="#cfd8e6"/><line x1="${(c0-CART*PPM+2).toFixed(1)}" y1="${PY0-18}" x2="${(c0-CART*PPM+14).toFixed(1)}" y2="${PY0-18}" stroke="#cfd8e6"/></g>
  </g>
</g>
<text id="cdn" x="320" y="95" text-anchor="middle" font-size="54" font-weight="800" fill="#ffd27a"></text>
<text id="angLbl" x="${PXR-200}" y="${PY0+40}" font-size="13" fill="#e7ecf3"></text>
</svg>`;
  }
  function mount(root){
    ['trackG','cart','w1','w2','stopG','stopR','klik','hold','sup','arc','cdn','angLbl'].forEach(id=>el[id]=root.querySelector('#'+id));
    render();
  }
  function render(){
    if(!el.trackG) return;
    const ang=S.p.ang,r=rad(ang),c0=px(U0);
    el.trackG.setAttribute('transform',`rotate(${ang} ${PXR} ${PY0})`);
    el.cart.setAttribute('transform',`translate(${(sim.x*PPM).toFixed(2)} 0)`);
    const deg=(sim.x/WR*180/Math.PI)%360;
    el.w1.setAttribute('transform',`rotate(${deg.toFixed(1)} ${(c0-8).toFixed(1)} ${PY0-18})`);
    el.w2.setAttribute('transform',`rotate(${deg.toFixed(1)} ${(c0-CART*PPM+8).toFixed(1)} ${PY0-18})`);
    const sr=sim.sRun!=null?sim.sRun:S.sPos;
    el.stopG.setAttribute('transform',`translate(${(sr*PPM).toFixed(2)} 0)`);
    el.stopR.style.fill=sim.flash>0?'#ffd27a':'var(--acc)';
    el.klik.setAttribute('opacity',sim.flash>0?'1':'0');
    el.hold.setAttribute('opacity',(sim.phase==='ready'||sim.phase==='count')?'1':'0');
    const lx=PXR-PXL*Math.cos(r),ly=PY0-PXL*Math.sin(r);
    el.sup.setAttribute('x',(lx-2).toFixed(1));el.sup.setAttribute('y',ly.toFixed(1));el.sup.setAttribute('height',Math.max(0,PY0+1-ly).toFixed(1));
    el.arc.setAttribute('d',`M${PXR-130} ${PY0} A130 130 0 0 1 ${(PXR-130*Math.cos(r)).toFixed(1)} ${(PY0-130*Math.sin(r)).toFixed(1)}`);
    let cd='';
    if(sim.phase==='count') cd=String(3-Math.min(2,Math.floor(sim.cnt/0.5)));
    else if(sim.phase==='run'&&sim.tt<0.45) cd='KRENI!';
    el.cdn.textContent=cd;
    el.angLbl.textContent=`α = ${fmt(ang,1)}°   (h = ${fmt(TR*Math.sin(r)*100,1)} cm)`;
  }
  function groups(){const g={};S.records.forEach(r=>{const k=(+r.s).toFixed(2);g[k]=(g[k]||0)+1;});return g;}
  function countAt(s){return groups()[(+s).toFixed(2)]||0;}
  function full(){const g=groups();return Object.keys(g).filter(k=>g[k]>=3).map(Number).sort((a,b)=>a-b);}
  function distinct(){return Object.keys(groups()).map(Number).sort((a,b)=>a-b);}
  function status(sw){
    const p=sim.phase,s=fmt(sim.sRun!=null?sim.sRun:S.sPos,2),n=countAt(S.sPos);
    const ct=` <span class="small">Za s = ${fmt(S.sPos,2)} m imaš ${n} od 3 merenja.</span>`;
    if(p==='ready') return {ph:'Spremno',next:`<b>Sledeće:</b> postavi graničnik na put s (sada ${s} m), poništi štopericu i pritisni „Pusti kolica“. Kolica kreću na „KRENI!“.`+ct};
    if(p==='count') return {ph:'Odbrojavanje…',next:'<b>Spremi prst:</b> pokreni štopericu tačno na „KRENI!“.'};
    if(p==='run') return {ph:'Kolica se kreću',next:sw.on?'<b>Zaustavi štopericu</b> kad kolica udare u graničnik.':'Kolica su krenula, a štoperica ne radi! Pokreni je odmah — ili pritisni „Vrati kolica“ i ponovi.'};
    if(last&&last.used) return {ph:'Zabeleženo',next:'Merenje je zabeleženo. Pritisni „Vrati kolica“ za sledeće.'+ct};
    return {ph:'Udar u graničnik',next:sw.on?'<b>Zaustavi štopericu!</b>':'<b>Sledeće:</b> upiši vreme sa štoperice i pritisni „Zabeleži“.'+ct};
  }
  function helpHTML(){
    const a=sim.a||aMod(S.p.ang);
    return `Pomoć (za nastavnika): ubrzanje u ovom puštanju ${fmt(a,4)} m/s² · tačno vreme do graničnika: ${last&&last.tTrue!=null?fmt(last.tTrue,2)+' s':'—'}`;
  }
  function rows(){
    const g={};
    S.records.slice().sort((a,b)=>a.id-b.id).forEach(r=>{const k=(+r.s).toFixed(2);(g[k]=g[k]||{s:+k,ts:[]}).ts.push(r.t);});
    const rs=Object.keys(g).map(k=>g[k]).sort((a,b)=>a.s-b.s).map(o=>{
      const ts=o.ts.filter(t=>t>0),tm=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:NaN;
      return {key:'s'+o.s.toFixed(2),s:o.s,ts:o.ts,n:ts.length,tm,ex:!(tm>0)};
    });
    const as=rs.filter(r=>!r.ex).map(r=>2*r.s/(r.tm*r.tm)).sort((a,b)=>a-b);
    if(as.length>=3){
      const med=as[Math.floor(as.length/2)];
      rs.forEach(r=>{if(!r.ex&&Math.abs(2*r.s/(r.tm*r.tm)/med-1)>0.3) r.ex=true;});
    }
    return rs;
  }
  function tFor(s,a){
    let x=0,v=0,t=0,g=0;const h=0.001;
    while(g<200000){const r=rk(x,v,a,h);if(r[0]>=s) return t+h*(s-x)/(r[0]-x);x=r[0];v=r[1];t+=h;g++;}
    return NaN;
  }
  function expected(){
    const ang=S.p.ang,a=aMod(ang);
    let ss=distinct();if(ss.length<2) ss=[0.3,0.6,0.9,1.2,1.5,1.8];
    const p=ss.map(s=>{const t=tFor(s,a);return {x:t*t,y:s};}).filter(q=>isFinite(q.x));
    const f=linfit(p);
    return {val:f?2*f.k:a,label:`Očekivano ubrzanje za α = ${fmt(ang,1)}° (model sa trenjem)`,
      extra:[{label:'Idealno, bez trenja: a = g · sin α',val:fmtSig(G*Math.sin(rad(ang)),3)+' m/s²'}]};
  }
  const dtM=n=>DT_H/Math.sqrt(Math.max(1,n));
  return {
    slug:'kolica-strma',rep:3,dxAsk:true,
    dxHTML:`<p class="small">Za prvu i poslednju tačku izračunaj nesigurnost kvadrata vremena: Δ(t<sup>2</sup>) = 2 · t<sub>sr</sub> · Δt<sub>sr</sub>, gde je Δt<sub>sr</sub> = ${FR('0,2 s','√n')} nesigurnost srednjeg vremena (n je broj merenja; za 3 merenja Δt<sub>sr</sub> ≈ 0,12 s).</p>`,
    dxTip:'Δ(t²) = 2 · t<sub>sr</sub> · Δt<sub>sr</sub>, a za 3 merenja Δt<sub>sr</sub> ≈ 0,12 s.',accent:'#b4472f',accentSoft:'#f6e1da',
    title:'Ravnomerno ubrzano kretanje kolica niz strmu ravan',short:'Kolica niz strmu ravan',grade:'I razred srednje škole',

/* =========================================================
   3. STANJE I ČUVANJE (samo na ovom uređaju)
   ========================================================= */
const KEY=EX.slug+'-lab-v1';
const LESSONS=EX.LESSONS;
const VIEW_ORDER=['priprema','merenje','obrada1','obrada2','zakljucak'];
const VIEW_LABEL={priprema:'Priprema',merenje:'Merenje',obrada1:'Obrada I',obrada2:'Obrada II',zakljucak:'Zaključak'};
function lessonOf(v){const L=LESSONS.find(l=>l.views.indexOf(v)>=0);return L?L.n:1;}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function DEFPROC(){return {cells:{},A:{x:'',y:''},B:{x:'',y:''},abSel:'A',k:'',kOk:false,c:'',cOk:false,d:'',dOk:false,rv:'',rd:'',rOk:false,usedAuto:false,seen:false,dx1:'',dx2:'',dxOk:false,kmx:'',kmn:'',bOk:false,dev:'',devOk:false};}
function DEF(){
  const p={};EX.params.forEach(q=>p[q.key]=q.def);
  return {v:1,student:{name:'',group:'',date:today()},p,sPos:EX.sPos.def,speed:1,records:[],nextId:1,proc:DEFPROC(),concl:'',view:'priprema',done:{1:false,2:false,3:false},help:false,src:''};
}
function sanitize(o){
  const d=DEF();
  if(!o||typeof o!=='object') return d;
  const str=(v,m)=>typeof v==='string'?v.slice(0,m||400):'';
  if(o.student){d.student.name=str(o.student.name,80);d.student.group=str(o.student.group,40);
    if(/^\d{4}-\d{2}-\d{2}$/.test(o.student.date||'')) d.student.date=o.student.date;}
  EX.params.forEach(q=>{const v=Number(o.p&&o.p[q.key]);if(isFinite(v)) d.p[q.key]=clamp(v,q.min,q.max);});
  const sp=Number(o.sPos);if(isFinite(sp)) d.sPos=clamp(sp,EX.sPos.min,EX.sPos.max);
  d.speed=o.speed===2?2:1;
  if(Array.isArray(o.records)) d.records=o.records.filter(r=>r&&Number.isInteger(r.id)&&isFinite(r.s)&&isFinite(r.t)&&r.t>0).slice(0,400).map(r=>({id:r.id,s:+r.s,t:+r.t}));
  d.nextId=Math.max(1,Number.isInteger(o.nextId)?o.nextId:1,...d.records.map(r=>r.id+1));
  if(o.proc&&typeof o.proc==='object'){
    const P=o.proc,q=d.proc;
    if(P.cells&&typeof P.cells==='object') Object.keys(P.cells).forEach(k=>{const row=P.cells[k];if(row&&typeof row==='object'){q.cells[k]={};Object.keys(row).forEach(c=>{if(typeof row[c]==='string') q.cells[k][c]=row[c].slice(0,24);});}});
    ['A','B'].forEach(n=>{if(P[n]&&typeof P[n]==='object') q[n]={x:str(P[n].x,24),y:str(P[n].y,24)};});
    q.abSel=P.abSel==='B'?'B':'A';
    ['k','c','d','rv','rd','dx1','dx2','kmx','kmn','dev'].forEach(k=>q[k]=str(P[k],24));
    ['kOk','cOk','dOk','rOk','usedAuto','seen','dxOk','bOk','devOk'].forEach(k=>q[k]=!!P[k]);
  }
  d.concl=str(o.concl,5000);
  d.view=VIEW_ORDER.indexOf(o.view)>=0?o.view:'priprema';
  if(o.done) [1,2,3].forEach(n=>d.done[n]=!!o.done[n]);
  d.help=!!o.help;d.src=o.src==='papir'?'papir':'';
  return d;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw) return sanitize(JSON.parse(raw));}catch(e){}return DEF();}
let S=load();
let saveT=null;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,300);}
function saveNow(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* izvedene provere */
function cellOk(r,c,val){const v=num(val);if(!isFinite(v)) return null;return nearAny(v,c.exact(r,S.proc.cells[r.key]||{}),c.tol[0],c.tol[1]);}
function tableStats(){
  let total=0,ok=0;
  EX.rows().filter(r=>!r.ex).forEach(r=>EX.cols.forEach(c=>{if(!c.input) return;total++;if(cellOk(r,c,(S.proc.cells[r.key]||{})[c.key])===true) ok++;}));
  return {total,ok};
}
function tableAllOk(){const t=tableStats();return t.total>0&&t.ok===t.total;}
function abPt(n){const p=S.proc[n],x=num(p.x),y=num(p.y);return isFinite(x)&&isFinite(y)?{x,y}:null;}
function abSet(){return !!(abPt('A')&&abPt('B'));}
function conclOk(){const t=S.concl.trim();return t.length>=80&&t.split(/[.!?]+/).filter(s=>s.trim().length>3).length>=3;}
function hasData(){return S.records.length>0||S.student.name.trim().length>0;}
function procData(){
  const p=EX.pts().filter(q=>isFinite(q.x)&&isFinite(q.y)),use=p.filter(q=>!q.ex);
  return {p,use,fit:use.length>=2?linfit(use):null,bnd:use.length>=2?bounds(use):null};
}
function kStudent(P){const k=num(S.proc.k);return S.proc.kOk&&isFinite(k)?k:(P.fit?P.fit.k:NaN);}

/* =========================================================
   3a. PODACI IZ SVESKE (ponovni unos na 2. i 3. času)
   ========================================================= */
const REP=EX.rep||1;
const ICOLS=EX.cols.filter(c=>c.input);
function groupRecords(){
  const recs=S.records.slice().sort((a,b)=>a.s-b.s||a.id-b.id);
  if(REP===1) return recs.map(r=>({s:r.s,ts:[r.t],id:r.id}));
  const g={},out=[];
  recs.forEach(r=>{const k=(+r.s).toFixed(2);if(!g[k]){g[k]={s:+k,ts:[]};out.push(g[k]);}g[k].ts.push(r.t);});
  return out;
}
function rowOf(g,rs){rs=rs||EX.rows();return REP===1?rs.find(x=>x.id===g.id):rs.find(x=>Math.abs(x.s-g.s)<1e-9);}
function cellsOf(g,rs){const r=rowOf(g,rs);return r?(S.proc.cells[r.key]||{}):{};}
function tCols(gr){return Math.max(REP,...gr.map(g=>g.ts.length));}
function tHead(TC){return TC===1?'<th>t (s)</th>':Array.from({length:TC},(_,i)=>`<th>t<sub>${i+1}</sub> (s)</th>`).join('');}
function copyHTML(n){
  const gr=groupRecords(),TC=tCols(gr),L=EX.lin,rs=EX.rows();
  const par=EX.params.map(q=>`${q.label}: <b>${fmt(S.p[q.key],q.dec)}${q.unit}</b>`).join(' · ');
  const ic=n>=2?ICOLS:[];
  const body=gr.map((g,i)=>{const cv=cellsOf(g,rs);return `<tr><td>${i+1}</td><td>${fmt(g.s,2)}</td>${Array.from({length:TC},(_,j)=>`<td>${g.ts[j]!=null?fmt(g.ts[j],2):''}</td>`).join('')}${ic.map(c=>`<td>${cv[c.key]?esc(disp(cv[c.key])):'—'}</td>`).join('')}</tr>`;}).join('');
  let h=`<p class="small">${par}</p>`+(gr.length?`<div class="tbl-wrap"><table class="tbl ctbl"><thead><tr><th>Rb.</th><th>s (m)</th>${tHead(TC)}${ic.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`:'<p class="small muted">Još nema merenja.</p>');
  if(n>=2){
    const A=abPt('A'),B=abPt('B'),k=num(S.proc.k);
    const pt=p=>`(${fmt(p.x,L.xDec)} ${L.xUnit}; ${fmt(p.y,L.yDec)} ${L.yUnit})`;
    h+=`<ul class="kv">${A?`<li><span>Tačka A na pravoj</span><b>${pt(A)}</b></li>`:''}${B?`<li><span>Tačka B na pravoj</span><b>${pt(B)}</b></li>`:''}
<li><span>Nagib prave</span><b>${S.proc.kOk&&isFinite(k)?esc(disp(S.proc.k))+' '+L.kUnit:'nije proveren'}</b></li></ul>`;
  }
  return h;
}
function pdRow(i,r,TC){
  let h=`<tr><td>${i+1}</td><td><input class="pin" data-k="s" inputmode="decimal" autocomplete="off" aria-label="s u metrima, red ${i+1}" value="${esc(r.s)}"></td>`;
  for(let j=0;j<TC;j++) h+=`<td><input class="pin" data-k="t" inputmode="decimal" autocomplete="off" aria-label="${TC===1?'t':'t'+(j+1)} u sekundama, red ${i+1}" value="${esc(r.ts[j]||'')}"></td>`;
  ICOLS.forEach(c=>{h+=`<td class="pc"><input class="pin" data-k="c" data-c="${c.key}" inputmode="decimal" autocomplete="off" aria-label="${c.aria} (izračunato), red ${i+1}" value="${esc((r.cv&&r.cv[c.key])||'')}"></td>`;});
  return h+`<td><button class="btn ghost sq" type="button" data-pdrm aria-label="Ukloni red ${i+1}">✕</button></td></tr>`;
}
function pdHTML(open,intro){

<p class="small muted">Ako si merio na drugom uređaju ili su podaci nestali, prepiši ih ovde iz sveske i pritisni „Učitaj podatke“.${REP>1?' U jedan red upiši sva merenja za isti put s.':''} <b>Plave kolone</b> su vrednosti koje si izračunao digitronom na prethodnom času — upiši ih ako ih već imaš (na 2. času ostaju prazne).</p>
<div class="form3">${EX.params.map(q=>`<label class="fld"><span>${q.label} (${fmt(q.min,q.dec)}–${fmt(q.max,q.dec)}${q.unit})</span><span class="inunit"><input id="pd-${q.key}" inputmode="decimal" autocomplete="off" value="${fmt(S.p[q.key],q.dec)}"><em>${q.unit.trim()}</em></span></label>`).join('')}</div>

<div class="msg" id="pdMsg" role="status"></div></details>`;

function pdAdd(){

function pdRm(btn){

function pdLoad(){
  const m=$('#pdMsg'),p={};
  for(const q of EX.params){
    const v=num($('#pd-'+q.key).value);
    if(!isFinite(v)||v<q.min-1e-9||v>q.max+1e-9){msg(m,'bad',`${q.label} mora biti između ${fmt(q.min,q.dec)} i ${fmt(q.max,q.dec)}${q.unit}.`);return;}
    p[q.key]=+clamp(Math.round(v/q.step)*q.step,q.min,q.max).toFixed(6);
  }
  const recs=[],prs=[];let bad='';
  $$('#pdBody tr').forEach((tr,i)=>{
    if(bad) return;
    const sv=$('[data-k="s"]',tr).value.trim(),tv=$$('[data-k="t"]',tr).map(x=>x.value.trim());
    const cv={};$$('[data-k="c"]',tr).forEach(x=>{const v=x.value.trim();if(v) cv[x.dataset.c]=v;});
    if(!sv&&tv.every(x=>!x)&&!Object.keys(cv).length) return;
    const s=num(sv);
    if(!isFinite(s)){bad=`Red ${i+1}: upiši put s u metrima.`;return;}
    if(s<EX.sPos.min-1e-9||s>EX.sPos.max+1e-9){bad=`Red ${i+1}: s mora biti između ${fmt(EX.sPos.min,2)} i ${fmt(EX.sPos.max,2)} m.`;return;}
    const ts=tv.filter(x=>x).map(num);
    if(!ts.length){bad=`Red ${i+1}: upiši izmereno vreme t.`;return;}
    if(ts.some(t=>!isFinite(t)||t<=0||t>600)){bad=`Red ${i+1}: vreme mora biti pozitivan broj u sekundama.`;return;}
    for(const c of ICOLS){if(cv[c.key]&&!isFinite(num(cv[c.key]))){bad=`Red ${i+1}: izračunata vrednost (${c.aria}) nije broj.`;return;}cv[c.key]&&(cv[c.key]=cv[c.key].slice(0,24));}
    ts.forEach(t=>recs.push({s:+s.toFixed(2),t:+t.toFixed(3)}));
    prs.push({s:+s.toFixed(2),t0:+ts[0].toFixed(3),cv});
  });
  if(bad){msg(m,'bad',bad);return;}
  if(new Set(recs.map(r=>r.s)).size<2){msg(m,'bad','Upiši merenja za bar 2 različita puta s (za obradu treba bar 6).');return;}
  const sig=(rs,pp)=>JSON.stringify([EX.params.map(q=>+(+pp[q.key]).toFixed(6)),rs.map(r=>(+r.s).toFixed(2)+'|'+(+r.t).toFixed(2)).sort()]);
  const same=sig(S.records,S.p)===sig(recs,p);
  if(!same){
    if(S.records.length&&!confirm(`Zameniti postojećih ${S.records.length} merenja podacima iz sveske? Nagib i rezultat ćeš morati ponovo da proveriš.`)) return;
    S.p=p;S.records=recs.map((r,i)=>({id:S.nextId+i,s:r.s,t:r.t}));S.nextId+=recs.length;S.src='papir';
    EX.sim.back();EX.sim.resetLast();dataChanged();
    const keys=new Set(EX.rows().map(r=>r.key));
    Object.keys(S.proc.cells).forEach(k=>{if(!keys.has(k)) delete S.proc.cells[k];});
  }
  /* izračunate vrednosti iz sveske → tabela Obrade I */
  const rs=EX.rows(),used=new Set();let nc=0;
  prs.forEach(pr=>{
    if(!Object.keys(pr.cv).length) return;
    let r=null;
    if(REP===1){const rec=S.records.find(x=>!used.has(x.id)&&Math.abs(x.s-pr.s)<1e-9&&Math.abs(x.t-pr.t0)<0.0005);if(rec){used.add(rec.id);r=rs.find(x=>x.id===rec.id);}}
    else r=rs.find(x=>Math.abs(x.s-pr.s)<1e-9);
    if(!r) return;
    const cells=S.proc.cells[r.key]=S.proc.cells[r.key]||{};
    Object.keys(pr.cv).forEach(k=>{if(cells[k]!==pr.cv[k]){cells[k]=pr.cv[k];nc++;}});
  });
  if(same&&!nc){msg(m,'ok','✓ Ovi podaci su već učitani.');return;}
  saveNow();go(S.view,{noFocus:true});
  toast(same?'Izračunate vrednosti iz sveske su upisane u tabelu.':`Učitano iz sveske: ${recs.length} merenja.`+(nc?' Izračunate vrednosti su upisane u tabelu.':' Tabela i grafici su spremni.'),'ok',4500);
}
function kPaper(){
  const P=procData(),m=$('#kPaperMsg'),inp=$('#kPaper');if(!P.fit||!inp) return;
  const k=num(inp.value);
  if(!isFinite(k)||k<=0){msg(m,'bad','Upiši nagib kao pozitivan broj.');return;}
  if(near(k,P.fit.k,0,0.08)){
    S.proc.k=inp.value.trim().slice(0,24);S.proc.kOk=true;saveNow();buildObrada2();renderGoals();
    toast('Nagib iz sveske je prihvaćen.','ok');
  }else msg(m,'bad','✗ Ovaj nagib se ne slaže sa pravom kroz tvoje podatke. Proveri da li si tačno prepisao nagib i merenja — ili ga ponovo odredi na Obradi I.');
}

/* =========================================================
   5. GRAFICI (canvas, bez biblioteka)
   ========================================================= */
function setupCanvas(cv){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||320,h=cv.clientHeight||260;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return {c,w,h};
}
function niceStep(span,n){const raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;}
function ticksArr(a,b,n){const st=niceStep(b-a,n),out=[],i0=Math.ceil(a/st-1e-9),i1=Math.floor(b/st+1e-9);for(let i=i0;i<=i1;i++) out.push(i*st);return {ticks:out,step:st};}
function tickDec(st){return Math.max(0,Math.ceil(-Math.log10(st)-1e-9));}
function plot(cv,cfg){
  if(!cv||!cv.isConnected||!cv.clientWidth) return;
  const {c,w,h}=setupCanvas(cv);
  const cs=getComputedStyle(document.documentElement);
  const col=k=>!k?'#555':(k.indexOf('--')===0?(cs.getPropertyValue(k).trim()||'#555'):k);
  const font=(cs.getPropertyValue('--font')||'sans-serif').trim();
  const pL=58,pR=14,pT=12,pB=46;
  const pts=(cfg.pts||[]).filter(p=>isFinite(p.x)&&isFinite(p.y));
  const marks=(cfg.marks||[]).filter(m=>m&&isFinite(m.x)&&isFinite(m.y));
  let x0=cfg.xMin!=null?cfg.xMin:0,y0=cfg.yMin!=null?cfg.yMin:0,x1=cfg.xMax,y1=cfg.yMax;
  if(x1==null){x1=x0;pts.forEach(p=>x1=Math.max(x1,p.x+(p.dx||0)));marks.forEach(m=>x1=Math.max(x1,m.x));x1=x0+(x1-x0)*1.06;}
  if(!(x1>x0)) x1=x0+1;
  if(y1==null){y1=y0;pts.forEach(p=>y1=Math.max(y1,p.y));marks.forEach(m=>y1=Math.max(y1,m.y));if(cfg.hline) y1=Math.max(y1,cfg.hline.y);y1=y0+(y1-y0)*1.1;}
  if(!(y1>y0)) y1=y0+1;
  const nx=w<440?4:6;
  let TX=ticksArr(x0,x1,nx);x1=Math.ceil(x1/TX.step-1e-9)*TX.step;TX=ticksArr(x0,x1,nx);
  let TY=ticksArr(y0,y1,5);y1=Math.ceil(y1/TY.step-1e-9)*TY.step;TY=ticksArr(y0,y1,5);
  const W=w-pL-pR,H=h-pT-pB;
  const X=v=>pL+(v-x0)/(x1-x0)*W,Y=v=>pT+H-(v-y0)/(y1-y0)*H;
  cv._tf={x0,x1,y0,y1,pL,pR,pT,pB,w,h};
  c.clearRect(0,0,w,h);c.fillStyle=col('--surface');c.fillRect(0,0,w,h);
  c.font='12px '+font;c.textBaseline='middle';c.lineWidth=1;
  const dxd=tickDec(TX.step),dyd=tickDec(TY.step);
  TX.ticks.forEach(t=>{const x=Math.round(X(t))+.5;c.strokeStyle=col('--line');c.beginPath();c.moveTo(x,pT);c.lineTo(x,pT+H);c.stroke();c.fillStyle=col('--muted');c.textAlign='center';c.fillText(fmt(t,dxd),x,pT+H+14);});
  TY.ticks.forEach(t=>{const y=Math.round(Y(t))+.5;c.strokeStyle=col('--line');c.beginPath();c.moveTo(pL,y);c.lineTo(pL+W,y);c.stroke();c.fillStyle=col('--muted');c.textAlign='right';c.fillText(fmt(t,dyd),pL-6,y);});
  c.strokeStyle=col('--ink');c.lineWidth=1.4;c.beginPath();c.moveTo(pL,pT);c.lineTo(pL,pT+H);c.lineTo(pL+W,pT+H);c.stroke();
  c.fillStyle=col('--ink');c.font='600 12.5px '+font;c.textAlign='center';c.fillText(cfg.xLabel||'',pL+W/2,h-12);
  c.save();c.translate(14,pT+H/2);c.rotate(-Math.PI/2);c.fillText(cfg.yLabel||'',0,0);c.restore();
  c.save();c.beginPath();c.rect(pL,pT,W,H);c.clip();
  (cfg.lines||[]).forEach(L=>{if(!L||!isFinite(L.k)||!isFinite(L.n)) return;c.strokeStyle=col(L.color);c.lineWidth=L.w||1.6;c.setLineDash(L.dash||[]);c.beginPath();c.moveTo(X(x0),Y(L.k*x0+L.n));c.lineTo(X(x1),Y(L.k*x1+L.n));c.stroke();});
  c.setLineDash([]);
  if(cfg.curve&&cfg.curve.f){const C=cfg.curve;c.strokeStyle=col(C.color);c.lineWidth=1.8;c.setLineDash(C.dash||[]);c.beginPath();for(let i=0;i<=160;i++){const xv=x0+(x1-x0)*i/160,yv=C.f(xv);if(!isFinite(yv)) continue;if(i===0) c.moveTo(X(xv),Y(yv));else c.lineTo(X(xv),Y(yv));}c.stroke();c.setLineDash([]);}
  if(cfg.hline&&isFinite(cfg.hline.y)){const L=cfg.hline;c.strokeStyle=col(L.color);c.lineWidth=1.8;c.setLineDash(L.dash||[]);c.beginPath();c.moveTo(pL,Y(L.y));c.lineTo(pL+W,Y(L.y));c.stroke();c.setLineDash([]);}
  pts.forEach(p=>{
    const x=X(p.x),y=Y(p.y),cc=p.ex?col('--bad'):col('--blue');
    c.strokeStyle=cc;c.lineWidth=1.3;
    if(p.dx){c.beginPath();c.moveTo(X(p.x-p.dx),y);c.lineTo(X(p.x+p.dx),y);c.moveTo(X(p.x-p.dx),y-4);c.lineTo(X(p.x-p.dx),y+4);c.moveTo(X(p.x+p.dx),y-4);c.lineTo(X(p.x+p.dx),y+4);c.stroke();}
    c.beginPath();c.arc(x,y,4.6,0,Math.PI*2);
    if(p.ex){c.fillStyle=col('--surface');c.fill();c.lineWidth=2;c.stroke();}else{c.fillStyle=cc;c.fill();}
  });
  marks.forEach(m=>{const x=X(m.x),y=Y(m.y);c.fillStyle=m.t==='A'?col('--acc'):col('--ink');c.beginPath();c.moveTo(x,y-7);c.lineTo(x+7,y);c.lineTo(x,y+7);c.lineTo(x-7,y);c.closePath();c.fill();c.font='800 13px '+font;c.textAlign='left';c.fillText(m.t,x+9,y-10);});
  c.restore();
  const leg=[];
  if(pts.some(p=>!p.ex)) leg.push({t:'pt',c:col('--blue'),l:'izmerene tačke'});
  if(pts.some(p=>p.ex)) leg.push({t:'px',c:col('--bad'),l:'isključene tačke'});
  (cfg.lines||[]).forEach(L=>{if(L&&L.label) leg.push({t:'ln',c:col(L.color),d:L.dash,l:L.label});});
  if(cfg.curve&&cfg.curve.label) leg.push({t:'ln',c:col(cfg.curve.color),d:cfg.curve.dash,l:cfg.curve.label});
  if(cfg.hline&&cfg.hline.label) leg.push({t:'ln',c:col(cfg.hline.color),d:cfg.hline.dash,l:cfg.hline.label});
  if(leg.length){
    c.font='11.5px '+font;
    const lw=Math.max(...leg.map(e=>c.measureText(e.l).width))+42,lh=17,bx=pL+8,by=pT+6;
    c.fillStyle='rgba(255,252,246,.92)';c.strokeStyle=col('--line');c.lineWidth=1;c.beginPath();c.rect(bx,by,lw,leg.length*lh+8);c.fill();c.stroke();
    leg.forEach((e,i)=>{const yy=by+12+i*lh;
      if(e.t==='ln'){c.strokeStyle=e.c;c.lineWidth=2;c.setLineDash(e.d||[]);c.beginPath();c.moveTo(bx+6,yy);c.lineTo(bx+30,yy);c.stroke();c.setLineDash([]);}
      else{c.beginPath();c.arc(bx+18,yy,4,0,Math.PI*2);if(e.t==='px'){c.strokeStyle=e.c;c.lineWidth=2;c.stroke();}else{c.fillStyle=e.c;c.fill();}}
      c.fillStyle=col('--ink');c.textAlign='left';c.fillText(e.l,bx+36,yy);});
  }
}
function linCfg(P,mode){
  const L=EX.lin,lines=[],em=mode==='bnd';
  if(P.fit) lines.push({k:P.fit.k,n:P.fit.n,color:'--blue',w:2.2,label:'najbolja prava'});
  if(P.bnd){
    lines.push({k:P.bnd.kmax,n:P.bnd.nmax,color:em?'--acc':'--muted',dash:[7,5],w:em?2:1.3,label:'granične prave'});
    lines.push({k:P.bnd.kmin,n:P.bnd.nmin,color:em?'--acc':'--muted',dash:[7,5],w:em?2:1.3});
  }
  const A=abPt('A'),B=abPt('B'),marks=[];
  if(A) marks.push({x:A.x,y:A.y,t:'A'});if(B) marks.push({x:B.x,y:B.y,t:'B'});
  return {xLabel:L.xLabel,yLabel:L.yLabel,xMin:0,yMin:0,pts:P.p,lines,marks:em?[]:marks};
}

function goalHTML(L){

<label class="tgl"><input type="checkbox" id="helpTgl" ${S.help?'checked':''}><span><b>Pomoć (za nastavnika)</b> — prikaži tačne vrednosti na pozornici, dugme za automatsko popunjavanje tabele i linearnu regresiju. Učenik sve računa sam digitronom; program samo crta grafike i proverava.</span></label>
<p class="small muted">Svi podaci (merenja, obrada, zaključak) čuvaju se samo na ovom uređaju, u pregledaču. Ništa se ne šalje na internet; radi i bez mreže. Ako se podaci izgube ili učenik radi na drugom uređaju, merenja i nagib se ponovo unose iz sveske (kartica „Podaci iz sveske“ na Obradi I i II).</p>

function dataChanged(){
  const P=S.proc;
  if(P.kOk||P.cOk||P.dOk||P.rOk||P.bOk||P.dxOk||P.devOk){P.kOk=P.cOk=P.dOk=P.rOk=P.bOk=P.dxOk=P.devOk=false;return true;}

function record(){
  const inp=$('#tIn'),t=num(inp.value);
  if(SW.on){toast('Prvo zaustavi štopericu.','warn');return;}
  if(!isFinite(t)||t<=0){toast('Upiši vreme sa štoperice u sekundama, npr. 12,34.','bad');inp.focus();return;}
  const lr=EX.sim.lastRun();
  if(!lr||!lr.done||Math.abs(lr.s-S.sPos)>1e-9){toast(EX.noRunMsg,'warn',4200);return;}
  if(lr.used){toast(`Ovo merenje je već zabeleženo. Pritisni „${EX.backLabel}“ i izvedi novo.`,'warn',4200);return;}
  const rec={id:S.nextId++,s:S.sPos,t:t};
  S.records.push(rec);lr.used=true;inp.value='';
  const ch=dataChanged();
  const w=EX.plaus(rec,lr);
  if(w) toast(w,'warn',6500);
  else toast(`Zabeleženo: s = ${fmt(rec.s,2)} m, t = ${fmt(rec.t,2)} s`+(ch?' · nagib i rezultat treba ponovo proveriti':''),'ok');

function frame(ts){
  if(lastTs==null) lastTs=ts;
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(!(dt>0)) dt=0;if(dt>0.1) dt=0.1;
  const ds=dt*S.speed;

  if(S.view==='merenje') live();

  const cv=e.target.closest('#cv-lin');if(!cv||!cv._tf) return;
  const P=procData();if(!P.fit) return;
  const r=cv.getBoundingClientRect(),tf=cv._tf;
  let x=tf.x0+(e.clientX-r.left-tf.pL)/(tf.w-tf.pL-tf.pR)*(tf.x1-tf.x0);
  x=clamp(x,tf.x0,tf.x1);
  const y=P.fit.k*x+P.fit.n,n=S.proc.abSel;

  syncAB();drawO1();scheduleSave();goalsSoon();

function checkK(){
  const A=abPt('A'),B=abPt('B'),m=$('#kMsg'),k=num(S.proc.k),L=EX.lin;
  if(!A||!B){msg(m,'bad','Prvo postavi obe tačke A i B (dodirom na grafik ili upisom).');return;}
  if(Math.abs(B.x-A.x)<1e-12){msg(m,'bad',`Tačke A i B ne smeju imati isto ${L.xSym}.`);return;}
  if(!isFinite(k)){msg(m,'bad','Upiši nagib kao broj.');return;}
  const kAB=(B.y-A.y)/(B.x-A.x),P=procData();let warn='';
  const xs=P.use.map(p=>p.x),xr=xs.length?Math.max(...xs)-Math.min(...xs):0;
  if(Math.abs(B.x-A.x)<0.4*xr) warn+='<br>⚠ Tačke su blizu jedna drugoj — za tačniji nagib uzmi ih što dalje (bliže krajevima prave).';
  if(P.fit&&!near(kAB,P.fit.k,0,0.05)) warn+='<br>⚠ Tačke ne leže baš na najboljoj pravoj. Postavi ih dodirom na punu plavu liniju.';
  if(near(k,kAB,1e-12,0.02)){S.proc.kOk=true;msg(m,'ok',`✓ Tačno: nagib = ${fmtSig(kAB,3)} ${L.kUnit}. ${EX.kOkText} ✎ Zapiši tačke A i B i nagib u svesku — trebaće ti na 3. času.${warn}`);}
  else{
    S.proc.kOk=false;
    let tip=`Proveri računanje: razliku ${L.ySym} podeli razlikom ${L.xSym} (B minus A).`;
    if(near(k,1/kAB,0,0.02)) tip=`Izgleda da si podelio obrnuto — u brojiocu je ${L.ySym}, a u imeniocu ${L.xSym}.`;
    msg(m,'bad','✗ '+tip+warn);
  }
  scheduleSave();renderGoals();
}

function checkC(){
  const P=procData(),m=$('#cMsg'),v=num(S.proc.c);
  if(!isFinite(v)){msg(m,'bad','Upiši broj.');return;}
  const exs=[EX.constFromK(kStudent(P))];if(P.fit) exs.push(EX.constFromK(P.fit.k));
  if(nearAny(v,exs,1e-12,0.01)){S.proc.cOk=true;msg(m,'ok','✓ Tačno. '+EX.cOkText);}
  else{S.proc.cOk=false;msg(m,'bad','✗ '+EX.cTip);}
  scheduleSave();renderGoals();
}
function bEnds(P){const s=P.use.slice().sort((a,b)=>a.x-b.x);return s.length>=2?{p1:s[0],p2:s[s.length-1]}:null;}
function checkDx(){
  const P=procData(),m=$('#dxMsg'),E=bEnds(P);if(!E) return;
  const d1=num(S.proc.dx1),d2=num(S.proc.dx2);
  if(!isFinite(d1)||!isFinite(d2)||d1<=0||d2<=0){msg(m,'bad','Upiši obe nesigurnosti kao pozitivne brojeve.');return;}
  const o1=near(d1,E.p1.dx,0.006,0.06),o2=near(d2,E.p2.dx,0.006,0.06);
  if(o1&&o2){S.proc.dxOk=true;msg(m,'ok','✓ Tačno. Sada izračunaj nagibe graničnih pravih.');}
  else{S.proc.dxOk=false;msg(m,'bad','✗ Proveri '+(!o1&&!o2?'obe vrednosti':!o1?'prvu tačku':'poslednju tačku')+'. '+EX.dxTip);}
  scheduleSave();renderGoals();
}
function checkB(){
  const P=procData(),m=$('#bMsg'),E=bEnds(P),B=P.bnd;if(!E||!B) return;
  if(EX.dxAsk&&!S.proc.dxOk){msg(m,'bad','Prvo izračunaj i proveri nesigurnosti prve i poslednje tačke.');return;}
  const a=num(S.proc.kmx),b=num(S.proc.kmn);
  if(!isFinite(a)||!isFinite(b)){msg(m,'bad','Upiši oba nagiba kao brojeve.');return;}
  const d1=EX.dxAsk?num(S.proc.dx1):E.p1.dx,d2=EX.dxAsk?num(S.proc.dx2):E.p2.dx,dy=E.p2.y-E.p1.y;
  const kx=dy/((E.p2.x-d2)-(E.p1.x+d1)),kn=dy/((E.p2.x+d2)-(E.p1.x-d1));
  const oa=nearAny(a,[B.kmax,kx],0,0.03),ob=nearAny(b,[B.kmin,kn],0,0.03);
  if(oa&&ob){S.proc.bOk=true;msg(m,'ok','✓ Tačno. k<sub>max</sub> je nagib strmije, a k<sub>min</sub> blaže granične prave.');}
  else{
    S.proc.bOk=false;
    if(nearAny(a,[B.kmin,kn],0,0.03)&&nearAny(b,[B.kmax,kx],0,0.03)) msg(m,'bad','✗ Zamenio si ih: k<sub>max</sub> je veći nagib (manji imenilac).');
    else msg(m,'bad','✗ Proveri '+(!oa&&!ob?'oba nagiba':!oa?'k<sub>max</sub>':'k<sub>min</sub>')+'. Kod k<sub>max</sub> imenilac je razlika „unutrašnjih“ krajeva brkova (manja), a kod k<sub>min</sub> „spoljašnjih“ (veća).');
  }
  scheduleSave();renderGoals();
}
function checkD(){
  const P=procData(),m=$('#dMsg'),d=num(S.proc.d),B=P.bnd;if(!B) return;
  if(!S.proc.bOk){msg(m,'bad','Prvo izračunaj i proveri k<sub>max</sub> i k<sub>min</sub>.');return;}
  if(!isFinite(d)||d<=0){msg(m,'bad','Upiši pozitivan broj.');return;}
  const ex=EX.deltaFrom(B.kmax,B.kmin),exS=EX.deltaFrom(num(S.proc.kmx),num(S.proc.kmn));
  const rnd=[ex,exS].flatMap(x=>[num(fmtSig(x,1)),num(fmtSig(x,2))]);
  if(nearAny(d,[ex,exS],1e-12,0.03)||nearAny(d,rnd,1e-12,1e-6)){S.proc.dOk=true;msg(m,'ok','✓ Tačno. Ovo je nesigurnost tvog rezultata.');}
  else{S.proc.dOk=false;msg(m,'bad','✗ '+EX.dTip(d,B));}
  scheduleSave();renderGoals();
}
function checkR(){
  const P=procData(),m=$('#rMsg'),B=P.bnd;
  const cRef=S.proc.cOk?num(S.proc.c):EX.constFromK(kStudent(P));
  const dRef=S.proc.dOk?num(S.proc.d):(B?EX.deltaFrom(B.kmax,B.kmin):NaN);
  const rv=num(S.proc.rv),rd=num(S.proc.rd);
  if(!isFinite(rv)||!isFinite(rd)||rd<=0){msg(m,'bad','Upiši vrednost i nesigurnost (pozitivan broj).');return;}
  let okV,okD;
  if(isFinite(dRef)){okV=Math.abs(rv-cRef)<=0.6*dRef+0.002*Math.abs(cRef);okD=rd>=0.5*dRef&&rd<=2*dRef;}
  else{okV=near(rv,cRef,0,0.02);okD=true;}
  const hints=[];
  if(sigDigits(S.proc.rd)>2) hints.push('nesigurnost ima previše cifara — zaokruži je na 1 (ili 2) značajne cifre');
  if(decimalsOf(S.proc.rv)!==decimalsOf(S.proc.rd)) hints.push('vrednost zaokruži na isto decimalno mesto kao nesigurnost');
  if(okV&&okD){S.proc.rOk=true;msg(m,hints.length?'warn':'ok',`✓ Rezultat: <b>${EX.constSym} = ${esc(disp(S.proc.rv))} ± ${esc(disp(S.proc.rd))} ${EX.constUnit}</b>`+(hints.length?'<br>Savet: '+hints.join('; ')+'.':''));}
  else{
    S.proc.rOk=false;const e=[];
    if(!okV) e.push(`vrednost ne odgovara onoj koju si dobio iz nagiba (korak 1)`);
    if(!okD) e.push(`nesigurnost ne odgovara onoj iz graničnih pravih (korak 2)`);
    msg(m,'bad','✗ Proveri: '+e.join('; ')+'.');
  }
  scheduleSave();renderGoals();
}

   11. POGLED: ZAKLJUČAK
   ========================================================= */
function buildZakljucak(){
  const el=$('#v-zakljucak'),P=procData(),sym=EX.constSym;
  let h=`<h2 class="vh" tabindex="-1">Zaključak</h2><div class="goalSlot"></div>`;
  if(!P.fit){el.innerHTML=h+pdHTML(true,'Na ovom uređaju nema podataka. Prepiši merenja iz sveske, pa na Obradi II unesi nagib.')+'<div class="row"><button class="btn ghost" type="button" data-go="obrada2">← Na Obradu II</button></div>';return;}
  if(S.proc.rOk){
    const E=EX.expected(),c=num(S.proc.rv),d=num(S.proc.rd);
    const inside=Math.abs(c-E.val)<=d,within2=Math.abs(c-E.val)<=2*d;
    h+=`<div class="card"><h3>Tvoj rezultat</h3>
<div class="big-res">${sym} = ${esc(disp(S.proc.rv))} ± ${esc(disp(S.proc.rd))} ${EX.constUnit}</div>
<ul class="kv"><li><span>${E.label}</span><b>${fmtSig(E.val,3)} ${EX.constUnit}</b></li>${(E.extra||[]).map(x=>`<li><span>${x.label}</span><b>${x.val}</b></li>`).join('')}</ul>
<p>Izračunaj relativno odstupanje svog rezultata od očekivane vrednosti:</p>
<div class="formula">δ = ${FR('|'+sym+' − '+sym+'<sub>oč</sub>|',sym+'<sub>oč</sub>')} · 100 % = <span class="inunit"><input id="devIn" inputmode="decimal" autocomplete="off" aria-label="relativno odstupanje u procentima" value="${esc(S.proc.dev)}"><em>%</em></span><button class="btn primary" type="button" id="devChk">Proveri</button></div>
<div class="msg${S.proc.devOk?' ok':''}" id="devMsg" role="status">${S.proc.devOk?'✓ Provereno.':''}</div>
${S.proc.devOk?`<p class="banner ${inside?'ok':within2?'':'warn'}">${inside?'Očekivana vrednost je unutar tvoje nesigurnosti — rezultat se dobro slaže.':within2?'Očekivana vrednost je malo izvan tvoje nesigurnosti (unutar dvostruke). Razmisli koji izvor greške je to izazvao.':'Rezultat se primetno razlikuje od očekivanog. Razmisli o mogućem izvoru greške.'}</p>`:''}
${S.proc.usedAuto?'<p class="small muted">Tabela je popunjena uz automatsku pomoć.</p>':''}</div>`;
  }else{
    h+=`<div class="card"><h3>Tvoj rezultat</h3><div class="banner warn">Konačan rezultat ${sym} ± Δ${sym} još nije proveren na Obradi II. Završi ga, pa se vrati ovde.<br><button class="btn sm ghost" type="button" data-go="obrada2">← Na Obradu II</button></div></div>`;
  }
  h+=`<div class="card"><h3>Zaključak</h3><p>Napiši 3–5 rečenica. Pomeni:</p><ul class="tips">${EX.conclTips.map(t=>`<li>${t}</li>`).join('')}</ul>
<label class="sr" for="concl">Tvoj zaključak</label><textarea id="concl" rows="7" placeholder="Moj zaključak…">${esc(S.concl)}</textarea>
<div class="row between"><span class="small muted" id="conclCnt"></span><button class="btn primary" type="button" id="conclSave">Sačuvaj zaključak</button></div></div>
<div class="row"><button class="btn primary xl" type="button" id="end3">Završi 3. čas</button><button class="btn danger" type="button" data-wipe>Obriši sve podatke</button></div>`;
  el.innerHTML=h;updConclCnt();
}
function checkDev(){
  const m=$('#devMsg'),v=num(S.proc.dev);
  if(!isFinite(v)){msg(m,'bad','Upiši broj (u procentima).');return;}
  const E=EX.expected(),c=num(S.proc.rv),Er=num(fmtSig(E.val,3));
  const ex=[Math.abs(c-E.val)/E.val*100,Math.abs(c-Er)/Er*100];
  if(nearAny(Math.abs(v),ex,0.15,0.05)){S.proc.devOk=true;saveNow();buildZakljucak();renderGoals();toast('Odstupanje je tačno izračunato.','ok');}
  else{S.proc.devOk=false;msg(m,'bad','✗ Razliku tvog rezultata i očekivane vrednosti (bez znaka) podeli očekivanom vrednošću i pomnoži sa 100.');scheduleSave();}
}
function updConclCnt(){const e=$('#conclCnt');if(!e) return;const n=S.concl.trim().split(/[.!?]+/).filter(s=>s.trim().length>3).length;e.textContent=`Rečenica: ${n}`+(conclOk()?' ✓':' (treba 3–5)');}

  const z=$('#v-zakljucak');
  z.addEventListener('input',e=>{if(e.target.id==='devIn'){S.proc.dev=e.target.value.slice(0,24);S.proc.devOk=false;scheduleSave();goalsSoon();return;}if(e.target.id==='concl'){S.concl=e.target.value.slice(0,5000);updConclCnt();scheduleSave();goalsSoon();}});
  z.addEventListener('click',e=>{
    if(e.target.closest('#devChk')){checkDev();return;}
    if(e.target.closest('#conclSave')){saveNow();renderGoals();toast(conclOk()?'Zaključak je sačuvan na ovom uređaju.':'Sačuvano. Zaključak treba da ima 3–5 rečenica.',conclOk()?'ok':'warn');}
    else if(e.target.closest('#end3')){saveNow();endLesson(3);}
  });
}
function bindGlobal(){
  document.addEventListener('click',e=>{
    const nb=e.target.closest('[data-nav]');if(nb){go(nb.dataset.nav);return;}
    const g=e.target.closest('[data-go]');if(g){closeModal();go(g.dataset.go);return;}
    if(e.target.closest('[data-close]')){closeModal();return;}
    if(e.target.closest('[data-wipe]')){wipeAll();return;}
    if(e.target.closest('[data-about]')){about();return;}
    if(e.target.closest('#pdAdd')){pdAdd();return;}
    if(e.target.closest('#pdLoad')){pdLoad();return;}
    const rm=e.target.closest('[data-pdrm]');if(rm){pdRm(rm);return;}
    if(e.target.id==='modal') closeModal();
  });
  document.addEventListener('change',e=>{if(e.target.id==='helpTgl'){S.help=e.target.checked;liveCache={};scheduleSave();if(S.view==='obrada1'||S.view==='obrada2') go(S.view,{noFocus:true});}});
  const isField=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();return;}
    if((e.code==='Space'||e.key===' ')&&S.view==='merenje'&&!$('#modal').classList.contains('open')&&!isField(e.target)){
      if(e.target&&e.target.id==='swBtn') return;
      e.preventDefault();if(!e.repeat) swToggle();
    }
  });
  document.addEventListener('keyup',e=>{
    if((e.code==='Space'||e.key===' ')&&S.view==='merenje'&&!isField(e.target)&&e.target&&e.target.tagName==='BUTTON'&&e.target.id!=='swBtn') e.preventDefault();
  });
  let rt=null;
  window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
    if(S.view==='obrada1') drawO1();
    else if(S.view==='obrada2') plot($('#cv-bnd'),linCfg(procData(),'bnd'));
  },150);});
  window.addEventListener('beforeunload',saveNow);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') saveNow();});
}
function init(){
  const R=document.documentElement.style;R.setProperty('--acc',EX.accent);R.setProperty('--acc-soft',EX.accentSoft);
  document.title=EX.title+' — virtuelna laboratorija';
  $('#brand').innerHTML=`${EX.short}<small>Virtuelna laboratorija · ${EX.grade}</small>`;
  buildNav();buildMerenje();bindViews();bindGlobal();
  go(S.view,{noFocus:true});
  if(hasData()) resumeModal();
  requestAnimationFrame(frame);
}
init();
})();
</script>
</body>
</html>
