<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termodinamika — interaktivna animacija</title>
<style>
/* ===== Osnovni izgled (minimalistički, za projekciju u učionici) ===== */
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --ivica:#334155;
  --tekst:#e2e8f0; --tekst-prig:#94a3b8; --akcenat:#38bdf8;
  /* Boje fizičkih veličina — svaka zadržava svoju boju kroz celu animaciju */
  --boja-U:#f59e0b; --boja-Q:#ef4444; --boja-A:#3b82f6;
  --boja-T:#a855f7; --boja-p:#22c55e; --boja-V:#06b6d4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--tekst);
  font-family:"Segoe UI",system-ui,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;
}

/* Zaglavlje */
header{padding:14px 22px 10px;border-bottom:1px solid var(--ivica);position:relative;}
header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px;padding-right:120px;}
header p{margin:3px 0 0;font-size:13px;color:var(--tekst-prig);padding-right:120px;}

/* Prekidač jezika (gore desno) */
#jezik{position:absolute;top:14px;right:22px;display:flex;gap:4px;
  background:var(--panel);border:1px solid var(--ivica);border-radius:999px;padding:3px;}
.jez{background:transparent;border:none;color:var(--tekst-prig);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650;cursor:pointer;
  transition:all .15s ease;}
.jez:hover{color:var(--tekst);}
.jez.aktivan{background:var(--akcenat);color:#06283d;}

/* Izbornik scena */
#izbornik{display:flex;flex-wrap:wrap;gap:6px;padding:10px 22px;
  border-bottom:1px solid var(--ivica);align-items:center;}
#brojac{font-size:12px;color:var(--tekst-prig);margin-right:8px;white-space:nowrap;min-width:160px;}
.tab{background:var(--panel);border:1px solid var(--ivica);color:var(--tekst-prig);
  border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;
  transition:all .18s ease;white-space:nowrap;}
.tab:hover{color:var(--tekst);border-color:#475569;}
.tab.aktivna{background:var(--akcenat);border-color:var(--akcenat);color:#06283d;font-weight:650;}

/* Glavni raspored: platno + panel */
main{flex:1;display:flex;gap:16px;padding:16px 22px;min-height:0;}
#platno-okvir{flex:1 1 auto;min-width:0;position:relative;background:var(--panel);
  border:1px solid var(--ivica);border-radius:14px;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}

/* Bočni panel */
#panel{flex:0 0 310px;max-width:38%;display:flex;flex-direction:column;gap:14px;min-height:0;}
#info{background:var(--panel);border:1px solid var(--ivica);border-radius:14px;
  padding:16px 18px;transition:opacity .35s ease;}
#info h2{margin:0 0 8px;font-size:17px;color:var(--akcenat);}
#info .opis{font-size:14px;line-height:1.5;color:var(--tekst);}
#formula{margin-top:14px;padding:13px 14px;background:var(--panel2);
  border:1px solid var(--ivica);border-radius:10px;font-size:19px;text-align:center;
  line-height:1.6;min-height:30px;}

/* Legenda boja */
#legenda{background:var(--panel);border:1px solid var(--ivica);border-radius:14px;padding:13px 16px;}
#legenda h3{margin:0 0 9px;font-size:12px;color:var(--tekst-prig);
  text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
#legenda-lista{display:flex;flex-wrap:wrap;gap:10px 16px;}
.leg-stavka{display:flex;align-items:center;gap:7px;font-size:13px;}
.leg-boja{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}

/* Traka kontrola */
#kontrole{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:12px 22px;border-top:1px solid var(--ivica);}
button.kontrola{background:var(--panel);border:1px solid var(--ivica);color:var(--tekst);
  border-radius:9px;padding:8px 14px;font-size:13.5px;cursor:pointer;transition:all .15s ease;}
button.kontrola:hover{background:var(--panel2);border-color:#475569;}
button.kontrola:active{transform:translateY(1px);}
#rezim{min-width:150px;font-weight:600;}
#rezim.auto{background:var(--boja-p);border-color:var(--boja-p);color:#052e16;}
#rezim.rucni{background:var(--boja-A);border-color:var(--boja-A);color:#0b1b3a;}
.razmak{flex:1;}
.nagovestaj{font-size:12px;color:var(--tekst-prig);}

/* Podnožje */
footer{padding:10px 22px 16px;font-size:12px;color:var(--tekst-prig);
  border-top:1px solid var(--ivica);line-height:1.5;}

/* ===== Formule (čist HTML/CSS, bez biblioteka) ===== */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 4px;line-height:1.25;}
.frac .den{padding:1px 4px;line-height:1.25;}
/* Jednačine su jednobojne (bez boje veličina) — boje ostaju samo na platnu i u legendi */
.cU,.cQ,.cA,.cT,.cp,.cV{color:var(--tekst);}
sub,sup{font-size:.68em;}

@media (max-width:860px){
  main{flex-direction:column;}
  #panel{flex:0 0 auto;max-width:none;flex-direction:row;flex-wrap:wrap;}
  #info{flex:1 1 240px;} #legenda{flex:1 1 200px;}
  #platno-okvir{min-height:300px;}
  header h1,header p{padding-right:96px;}
}
</style>
</head>
<body>
<header>
  <h1 id="hdr-naslov"></h1>
  <p id="hdr-podnaslov"></p>
  <div id="jezik">
    <button class="jez" data-l="sr">SR</button>
    <button class="jez" data-l="hu">HU</button>
  </div>
</header>

<!-- Izbornik scena + indikator napretka (gradi se automatski iz niza scena) -->
<nav id="izbornik"><span id="brojac"></span></nav>

<main>
  <div id="platno-okvir"><canvas id="platno"></canvas></div>
  <aside id="panel">
    <div id="info">
      <h2 id="naslov-scene"></h2>
      <div class="opis" id="opis-scene"></div>
      <div id="formula"></div>
    </div>
    <div id="legenda">
      <h3 id="leg-naslov"></h3>
      <div id="legenda-lista"></div>
    </div>
  </aside>
</main>

<div id="kontrole">
  <button class="kontrola" id="dugme-prethodna"></button>
  <button class="kontrola" id="dugme-sledeca"></button>
  <button class="kontrola" id="dugme-pauza"></button>
  <button class="kontrola" id="dugme-ponovi"></button>
  <button class="kontrola" id="rezim"></button>
  <span class="razmak"></span>
  <span class="nagovestaj" id="nagovestaj"></span>
</div>

<footer id="podnozje"></footer>

<script>
"use strict";
/* ============================================================
   CONFIG — sve podesive vrednosti na jednom mestu
   ============================================================ */
const CONFIG = {

  ciljFPS: 60,               // ciljni broj slika u sekundi (koristi se delta-vreme)
  boje: {
    U:"#f59e0b", Q:"#ef4444", A:"#3b82f6", T:"#a855f7", p:"#22c55e", V:"#06b6d4",
    osa:"#64748b", mreza:"#1f2b3e", tekst:"#e2e8f0", prig:"#94a3b8", okvir:"#334155", vatra:"#fb923c"
  },
  font: "600 15px 'Segoe UI',system-ui,sans-serif",
  fontVeliki: "700 20px 'Segoe UI',system-ui,sans-serif"

/* ============================================================
   I18N — svi tekstovi na dva jezika (sr/hu)
   Formule su zajedničke (simboli), opisi i oznake prevedeni.
   ============================================================ */
// Zajedničke formule (HTML) — iste za oba jezika
const F = {

  s3:'Q = m·c·ΔT &nbsp;&nbsp; C = <span class="frac"><span class="num">Q</span><span class="den">ΔT</span></span>',
  s4:'Q = ΔU + A',
  s5:'A = p·ΔV',
  s7:'C<sub>p</sub> − C<sub>V</sub> = R &nbsp;&nbsp; γ = <span class="frac"><span class="num">C<sub>p</sub></span><span class="den">C<sub>V</sub></span></span>',
  s8:'η = <span class="frac"><span class="num">A</span><span class="den">Q<sub>1</sub></span></span> = <span class="frac"><span class="num">Q<sub>1</sub>−Q<sub>2</sub></span><span class="den">Q<sub>1</sub></span></span>',
  s9:'η<sub>max</sub> = 1 − <span class="frac"><span class="num">T<sub>2</sub></span><span class="den">T<sub>1</sub></span></span>'

const I18N = {
  sr:{
    naslov:"Termodinamika — unutrašnja energija, toplota i rad",
    podnaslov:"Od unutrašnje energije do Karnoovog ciklusa. Gledaj automatski ili izaberi bilo koju scenu ručno.",
    brojac:(i,n,naz)=>"Scena "+i+"/"+n+" — "+naz,

    leg:["U — unutrašnja energija","Q — količina toplote","A — rad",
         "T — temperatura","p — pritisak","V — zapremina"],
    kontrole:{prethodna:"◀ Prethodna", sledeca:"Sledeća ▶",
      pauza:"⏸ Pauza", nastavi:"▶ Nastavi", ponovi:"↺ Ponovi od početka",
      auto:"● Automatski", rucni:"○ Ručni",
      hint:"Tasteri: ◀ ▶ za kretanje, 1–9 za skok na scenu"},
    podnozje:"Materijal se može gledati automatski (scene se smenjuju i ciklus se beskonačno ponavlja) ili se bilo koja scena može izabrati ručno — klikom na izbornik, dugmadima, strelicama ili brojevima. Ručni izbor pauzira automatsku smenu; dugme „Auto“ je ponovo uključuje.",
    scenes:[
      {naziv:"Unutrašnja energija",
       opis:"Unutrašnja energija U je zbir kinetičke i potencijalne energije svih čestica tela. Kod idealnog gasa zavisi samo od temperature. Grej gas — čestice ubrzaju, U raste.",
       formula:F.s1, lab:{gaz:"gas", uRaste:"U raste", uOpada:"U opada"}},

       opis:"Q i A nisu „oblici energije“ koji se čuvaju u telu. To su dve mere energije koja prelazi granicu sistema: Q prenosom toplote, A vršenjem rada. U telu postoji samo U.",

            granica:"Energija prelazi granicu — ne „ulazi kao Q“ i ne „ostaje kao A“."}},
      {naziv:"Količina toplote i kalorimetrija",

       opis:"Zakon održanja energije za toplotne procese. Dovedena toplota deli se na porast unutrašnje energije i na rad koji gas izvrši: Q = ΔU + A.",

       opis:"Svaki izoproces drugačije raspodeljuje energiju. Izohorski: sva toplota ide u ΔU (A=0). Izobarski: deo u ΔU, deo u rad. Izotermski: ΔU=0, sva toplota u rad. Adijabatski: Q=0, rad na račun ΔU.",

       formula:F.s7, lab:{vConst:"V = const", pConst:"p = const",
            cv:"Cᵥ : sva Q → ΔU", cp:"Cₚ : Q → ΔU + A",

       formula:F.s8, lab:{topli:"Topli rezervoar  T₁", hladni:"Hladni rezervoar  T₂",
            motor:"MOTOR", korisan:"A (koristan rad)"}},

       opis:"Idealni kružni proces: dve izoterme i dve adijabate. Ima najveći mogući stepen korisnosti između dve temperature — zavisi samo od T₁ i T₂, ne od radne materije.",
       formula:F.s9, lab:{seg:["1→2: izotermsko širenje (T₁)","2→3: adijabatsko širenje",
            "3→4: izotermska kompresija (T₂)","4→1: adijabatska kompresija"],
            povrsina:"površina = koristan rad A"}}
    ]
  },
  hu:{
    naslov:"Termodinamika — belső energia, hő és munka",
    podnaslov:"A belső energiától a Carnot-körfolyamatig. Nézd automatikusan, vagy válassz bármelyik jelenetet kézzel.",
    brojac:(i,n,naz)=>"Jelenet "+i+"/"+n+" — "+naz,
    legNaslov:"Színmagyarázat",
    leg:["U — belső energia","Q — hőmennyiség","A — munka",
         "T — hőmérséklet","p — nyomás","V — térfogat"],
    kontrole:{prethodna:"◀ Előző", sledeca:"Következő ▶",
      pauza:"⏸ Szünet", nastavi:"▶ Folytatás", ponovi:"↺ Újra az elejéről",
      auto:"● Automatikus", rucni:"○ Kézi",
      hint:"Billentyűk: ◀ ▶ léptetés, 1–9 ugrás jelenetre"},
    podnozje:"Az anyag nézhető automatikusan (a jelenetek váltakoznak, a ciklus végtelenül ismétlődik), vagy bármelyik jelenet kézzel kiválasztható — a menüre kattintva, gombokkal, nyilakkal vagy számokkal. A kézi választás szünetelteti az automatikus váltást; az „Auto“ gomb újra bekapcsolja.",
    scenes:[
      {naziv:"Belső energia",
       opis:"A belső energia U a test összes részecskéjének kinetikus és potenciális energiája. Ideális gáznál csak a hőmérséklettől függ. Melegítsd a gázt — a részecskék gyorsulnak, U nő.",
       formula:F.s1, lab:{gaz:"gáz", uRaste:"U nő", uOpada:"U csökken"}},
      {naziv:"Hő és munka — két mérték",
       opis:"Q és A nem „energiafajták“, amelyek a testben tárolódnak. Ez két mértéke a rendszer határán átlépő energiának: Q hőátadással, A munkavégzéssel. A testben csak U van.",
       formula:'Q &nbsp;és&nbsp; A &rarr; megváltoztatják &nbsp;U',
       lab:{sistem:"RENDSZER", unutr:"belső energia", toplota:"hő", rad:"munka",
            granica:"Az energia átlépi a határt — nem „Q-ként lép be“, és nem „A-ként marad“."}},
      {naziv:"Hőmennyiség és kalorimetria",
       opis:"A bevitt hő növeli a test hőmérsékletét. Mennyivel — az a tömegtől és a c fajhőtől függ. A C = m·c kapacitás megmutatja, mennyi Q kell 1 K emelkedéshez.",
       formula:F.s3, lab:{telo:"test (m, c)"}},
      {naziv:"A termodinamika első főtétele",

      {naziv:"A gázok hőkapacitása",

      {naziv:"Hőerőgépek",
       opis:"A gép Q₁ hőt vesz fel a melegebb tartályból, egy részét A munkává alakítja, a maradék Q₂-t a hidegebbnek adja. Egyetlen gép sem alakítja át az összes hőt munkává.",
       formula:F.s8, lab:{topli:"Meleg tartály  T₁", hladni:"Hideg tartály  T₂",
            motor:"HŐERŐGÉP", korisan:"A (hasznos munka)"}},
      {naziv:"Carnot-körfolyamat",

       formula:F.s9, lab:{seg:["1→2: izoterm tágulás (T₁)","2→3: adiabatikus tágulás",
            "3→4: izoterm összenyomás (T₂)","4→1: adiabatikus összenyomás"],

const BROJ_SCENA = I18N.sr.scenes.length;

/* ============================================================
   Pomoćne funkcije za crtanje (zajedničke za sve scene)
   ============================================================ */
let ctx, W, H;
const B = CONFIG.boje;
let aktLab = {};   // oznake tekuće scene na tekućem jeziku (postavlja se pred crtanje)

function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function easeOut(t){ return 1-Math.pow(1-t,3); }
function lerp(a,b,t){ return a+(b-a)*t; }
function trougao(t){ t=t%1; return t<0.5 ? t*2 : 2-t*2; }

function tekst(s,x,y,boja,font,poravnanje){
  ctx.fillStyle=boja||B.tekst; ctx.font=font||CONFIG.font;
  ctx.textAlign=poravnanje||"center"; ctx.textBaseline="middle"; ctx.fillText(s,x,y);
}
function strelica(x1,y1,x2,y2,boja,debljina){
  const dx=x2-x1, dy=y2-y1, duz=Math.hypot(dx,dy); if(duz<0.5) return;
  const ux=dx/duz, uy=dy/duz, g=Math.min(13, duz*0.4);
  ctx.strokeStyle=boja; ctx.fillStyle=boja; ctx.lineWidth=debljina||3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-ux*g*0.6,y2-uy*g*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-ux*g-uy*g*0.5, y2-uy*g+ux*g*0.5);
  ctx.lineTo(x2-ux*g+uy*g*0.5, y2-uy*g-ux*g*0.5);
  ctx.closePath(); ctx.fill();
}
function talasStrelica(x1,y1,x2,y2,boja,faza){
  const dx=x2-x1, dy=y2-y1, duz=Math.hypot(dx,dy);
  const ux=dx/duz, uy=dy/duz, nx=-uy, ny=ux;
  ctx.strokeStyle=boja; ctx.lineWidth=3; ctx.lineCap="round"; ctx.beginPath();
  const kor=22;
  for(let s=0;s<=duz-14;s+=2){
    const amp=5*Math.sin(s/kor*Math.PI*2 - faza*4);
    const px=x1+ux*s+nx*amp, py=y1+uy*s+ny*amp;
    if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.fillStyle=boja; const g=12;
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-ux*g-nx*g*0.5, y2-uy*g-ny*g*0.5);
  ctx.lineTo(x2-ux*g+nx*g*0.5, y2-uy*g+ny*g*0.5);
  ctx.closePath(); ctx.fill();
}
function osePV(x0,y0,sir,vis){
  ctx.strokeStyle=B.osa; ctx.lineWidth=2;
  strelica(x0,y0, x0,y0-vis, B.osa,2);
  strelica(x0,y0, x0+sir,y0, B.osa,2);
  tekst("p",x0-16,y0-vis+4,B.p,CONFIG.font);
  tekst("V",x0+sir, y0+18,B.V,CONFIG.font);
  ctx.strokeStyle=B.mreza; ctx.lineWidth=1;
  for(let i=1;i<=4;i++){
    const yy=y0-vis*i/5; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0+sir,yy); ctx.stroke();
    const xx=x0+sir*i/5; ctx.beginPath(); ctx.moveTo(xx,y0); ctx.lineTo(xx,y0-vis); ctx.stroke();
  }
}
function plamen(cx,cy,sk,faza){
  const n=5;
  for(let i=0;i<n;i++){
    const o=(i-(n-1)/2)*7*sk; const h=(22+8*Math.sin(faza*6+i))*sk;
    ctx.fillStyle = i%2 ? B.vatra : B.Q; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.moveTo(cx+o-5*sk, cy);
    ctx.quadraticCurveTo(cx+o, cy-h, cx+o+5*sk, cy); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function nacrtajGas(x,y,w,h,brzina,gust,faza,cestice){
  ctx.strokeStyle=B.okvir; ctx.lineWidth=2.5; ctx.fillStyle="rgba(56,189,248,0.05)";
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke();
  for(let i=0;i<gust;i++){
    const s1=Math.sin(i*12.9898)*43758.5453; const r1=s1-Math.floor(s1);
    const s2=Math.sin(i*78.233)*43758.5453;  const r2=s2-Math.floor(s2);
    const s3=Math.sin(i*39.421)*43758.5453;  const r3=s3-Math.floor(s3);
    const vx=(r1-0.5)*brzina, vy=(r2-0.5)*brzina;
    let px=((r3*w + faza*vx*60)%(w-16)+ (w-16))%(w-16);
    let py=((r1*h + faza*vy*60)%(h-16)+ (h-16))%(h-16);
    ctx.fillStyle=cestice||B.T;
    ctx.beginPath(); ctx.arc(x+8+px, y+8+py, 3.4, 0, Math.PI*2); ctx.fill();
  }
}
function termometar(x,y,vis,punj,labela){
  const sir=14; ctx.strokeStyle=B.okvir; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x-sir/2,y-vis,sir,vis,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y+6,13,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=B.T; ctx.beginPath(); ctx.arc(x,y+6,10,0,Math.PI*2); ctx.fill();
  const hh=(vis-6)*Math.max(0,Math.min(1,punj));
  ctx.fillStyle=B.T; ctx.beginPath(); ctx.roundRect(x-4,y-hh,8,hh+10,4); ctx.fill();
  if(labela) tekst(labela, x, y-vis-14, B.T, CONFIG.font);
}
function stub(x,y,w,h,boja,labela){
  ctx.fillStyle=boja; ctx.beginPath(); ctx.roundRect(x,y,w,h,4); ctx.fill();
  if(labela){ ctx.fillStyle="#06283d"; tekst(labela, x+w/2, y+h/2, "#06283d", CONFIG.fontVeliki); }
}

let autoTajmer = 0;
let alfa = 1;
let prelaz = null;

function uskladiVelicinu(){
  const okvir=document.getElementById("platno-okvir"); const r=okvir.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1; W=r.width; H=r.height;
  platno.width=Math.round(W*dpr); platno.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", uskladiVelicinu);

/* --- Izbornik scena (tekst se gradi iz I18N, zato se obnavlja pri promeni jezika) --- */
const izbornik=document.getElementById("izbornik");
let tabovi=[];
function izgradiTabove(){
  tabovi.forEach(t=>t.remove());
  tabovi=[];
  I18N[LANG].scenes.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="tab"; b.textContent=(i+1)+". "+s.naziv;
    b.addEventListener("click",()=>idiNa(i,true));
    izbornik.appendChild(b); tabovi.push(b);
  });
}

/* --- Legenda (gradi se iz I18N) --- */
const LEG_BOJE=["var(--boja-U)","var(--boja-Q)","var(--boja-A)","var(--boja-T)","var(--boja-p)","var(--boja-V)"];
function izgradiLegendu(){
  const lista=document.getElementById("legenda-lista"); lista.innerHTML="";
  I18N[LANG].leg.forEach((txt,i)=>{
    const d=document.createElement("span"); d.className="leg-stavka";
    d.innerHTML='<span class="leg-boja" style="background:'+LEG_BOJE[i]+'"></span>'+txt;
    lista.appendChild(d);
  });
}

/* --- Ažuriranje panela (naslov, opis, formula) i izbornika --- */
function osveziPanel(){
  const s=I18N[LANG].scenes[trenutna];
  document.getElementById("naslov-scene").textContent=s.naziv;
  document.getElementById("opis-scene").textContent=s.opis;
  document.getElementById("formula").innerHTML=s.formula;
  document.getElementById("brojac").textContent=I18N[LANG].brojac(trenutna+1, BROJ_SCENA, s.naziv);
  tabovi.forEach((t,i)=>t.classList.toggle("aktivna", i===trenutna));
  document.getElementById("info").style.opacity=alfa;
}

/* --- Primeni ceo jezik na statične delove UI --- */
function primeniJezik(){
  const L=I18N[LANG];
  document.documentElement.lang = (LANG==="hu"?"hu":"sr-Latn");
  document.getElementById("hdr-naslov").textContent=L.naslov;
  document.getElementById("hdr-podnaslov").textContent=L.podnaslov;
  document.getElementById("leg-naslov").textContent=L.legNaslov;
  document.getElementById("dugme-prethodna").textContent=L.kontrole.prethodna;
  document.getElementById("dugme-sledeca").textContent=L.kontrole.sledeca;
  document.getElementById("dugme-ponovi").textContent=L.kontrole.ponovi;
  document.getElementById("nagovestaj").textContent=L.kontrole.hint;
  document.getElementById("podnozje").textContent=L.podnozje;
  document.querySelectorAll(".jez").forEach(b=>b.classList.toggle("aktivan", b.dataset.l===LANG));
  izgradiTabove(); izgradiLegendu(); osveziRezim(); osveziPauzu(); osveziPanel();
}

/* --- Prelazak na scenu uz glatki fade --- */
function idiNa(i, rucno){
  i=((i%BROJ_SCENA)+BROJ_SCENA)%BROJ_SCENA;
  if(rucno){ auto=false; osveziRezim(); }
  if(i===trenutna && !prelaz){ return; }
  prelaz={ka:i, faza:"izlaz"}; autoTajmer=0;
}
function sledeca(rucno){ idiNa(trenutna+1, rucno); }
function prethodna(rucno){ idiNa(trenutna-1, rucno); }

function osveziRezim(){
  const d=document.getElementById("rezim"); const k=I18N[LANG].kontrole;
  d.textContent = auto ? k.auto : k.rucni;
  d.className = "kontrola "+(auto?"auto":"rucni");
}
function osveziPauzu(){
  const k=I18N[LANG].kontrole;
  document.getElementById("dugme-pauza").textContent = pauza ? k.nastavi : k.pauza;
}

/* --- Promena jezika --- */
function postaviJezik(j){
  if(j!==LANG){ LANG=j; try{ localStorage.setItem("termo-jezik", j); }catch(e){} primeniJezik(); }
}

/* ============================================================
   Glavna petlja — requestAnimationFrame sa delta-vremenom
   ============================================================ */
let prosli=performance.now();
function petlja(sada){
  let dt=(sada-prosli)/1000; prosli=sada; if(dt>0.1) dt=0.1;
  if(!pauza){
    sceneVreme += dt;
    if(auto && !prelaz){ autoTajmer += dt; if(autoTajmer>=CONFIG.trajanjeScene){ sledeca(false); } }
    if(prelaz){
      const korak=dt/CONFIG.trajanjePrelaza;
      if(prelaz.faza==="izlaz"){
        alfa-=korak;
        if(alfa<=0){ alfa=0; trenutna=prelaz.ka; sceneVreme=0; autoTajmer=0;
          prelaz.faza="ulaz"; osveziPanel(); azurirajHash(); }
      } else { alfa+=korak; if(alfa>=1){ alfa=1; prelaz=null; } }
      document.getElementById("info").style.opacity=alfa;
    }
  }
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=alfa;
  aktLab = I18N[LANG].scenes[trenutna].lab;    // oznake tekuće scene na tekućem jeziku
  try{ CRTAJ[trenutna](sceneVreme); }catch(e){}
  ctx.restore();
  requestAnimationFrame(petlja);
}

/* --- URL hash (npr. fajl#scena-3) — radi lokalno, bez servera --- */
function azurirajHash(){ history.replaceState(null,"","#scena-"+(trenutna+1)); }
function citajHash(){
  const m=/scena-(\d+)/.exec(location.hash||"");
  if(m){ const n=parseInt(m[1],10)-1; if(n>=0 && n<BROJ_SCENA){ trenutna=n; } }
}

/* ============================================================
   Kontrole i tasteri
   ============================================================ */
document.getElementById("dugme-prethodna").addEventListener("click",()=>prethodna(true));
document.getElementById("dugme-sledeca").addEventListener("click",()=>sledeca(true));
document.getElementById("dugme-pauza").addEventListener("click",()=>{ pauza=!pauza; prosli=performance.now(); osveziPauzu(); });
document.getElementById("dugme-ponovi").addEventListener("click",()=>{ sceneVreme=0; autoTajmer=0; });
document.getElementById("rezim").addEventListener("click",()=>{ auto=!auto; autoTajmer=0; osveziRezim(); });
document.querySelectorAll(".jez").forEach(b=>b.addEventListener("click",()=>postaviJezik(b.dataset.l)));
window.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") sledeca(true);
  else if(e.key==="ArrowLeft") prethodna(true);
  else if(e.key>="1" && e.key<="9"){ const n=parseInt(e.key,10)-1; if(n<BROJ_SCENA) idiNa(n,true); }
  else if(e.key===" "){ e.preventDefault(); document.getElementById("dugme-pauza").click(); }
});
window.addEventListener("hashchange",()=>{ citajHash(); idiNa(trenutna,true); });

/* ============================================================
   Pokretanje
   ============================================================ */
citajHash();
uskladiVelicinu();
primeniJezik();
azurirajHash();
requestAnimationFrame(petlja);
</script>
</body>
</html>
