<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hősugárzás és a kvantumfizika születése</title>
<style>
:root{--bg:#0b1017;--karta:#121a26;--lin:#ffffff17;--txt:#e9eef7;--prig:#93a3b6;--akc:#ffb454}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{text-align:center;padding:18px 12px 8px}
h1{font-size:clamp(20px,3vw,29px)}
.pod{color:var(--prig);margin-top:5px;font-size:clamp(13px,1.4vw,16px)}
main{width:min(1240px,96vw);display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.pozornica{position:relative;width:100%;height:min(56vh,540px);background:#0d1420;border:1px solid var(--lin);border-radius:14px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.dugmad{position:absolute;top:10px;right:12px;display:flex;gap:8px}
.dugmad button{background:#0d1420cc;border:1px solid var(--lin);color:var(--txt);padding:7px 14px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.dugmad button:hover{border-color:var(--akc);color:var(--akc)}
.panel{background:var(--karta);border:1px solid var(--lin);border-radius:14px;padding:15px 20px;display:grid;grid-template-columns:1.2fr .9fr;gap:6px 24px;min-height:130px}
#naslov{color:var(--akc);font-size:19px;margin-bottom:6px}
#opis{color:#c7d1dd;font-size:15px;line-height:1.55}
.formula{align-self:center;justify-self:end;text-align:center;background:#ffffff0a;border:1px solid var(--lin);border-radius:12px;padding:13px 20px;font-size:19px;line-height:1.9}
.odv{display:block;margin-top:6px;font-size:.68em;color:var(--prig);line-height:1.7}
.c1{color:#ff4d6d}.c2{color:#f472b6}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em}
.frac .g{border-bottom:1px solid currentColor;padding:0 .3em .06em}
.frac .d{padding:.06em .3em 0}
.formula sup .frac{font-size:.72em;margin:0}
.anim{animation:prik .5s ease both}
@keyframes prik{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.napredak{display:flex;align-items:center;gap:14px}
#ntekst{font-size:13.5px;color:var(--prig);white-space:nowrap}
.tacke{display:flex;gap:7px}
.tacka{width:9px;height:9px;border-radius:50%;background:#ffffff2e;transition:.3s}
.tacka.on{background:var(--akc);transform:scale(1.4)}
.traka{flex:1;height:4px;background:#ffffff14;border-radius:2px;overflow:hidden}
#ispuna{height:100%;width:0;background:var(--akc)}
.legenda{display:flex;flex-wrap:wrap;gap:7px 18px;justify-content:center;background:var(--karta);border:1px solid var(--lin);border-radius:12px;padding:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--prig)}
.polje{width:13px;height:13px;border-radius:4px}
footer{text-align:center;color:var(--prig);font-size:13px;padding:4px 14px 20px}
#greska{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#a02020;color:#fff;padding:10px 16px;font:14px monospace;white-space:pre-wrap}
@media(max-width:860px){.panel{grid-template-columns:1fr}.formula{justify-self:center}}
</style>
</head>
<body>
<div id="greska"></div>
<header>
<h1>Hősugárzás és a kvantumfizika születése</h1>
<p class="pod">Sugárzási törvények &middot; fotoeffektus &middot; Compton-effektus</p>
</header>
<main>
<div class="pozornica">
<canvas id="platno"></canvas>
<div class="dugmad">
<button id="bPauza">Szünet</button>
<button id="bReset">Kezdés az elejéről</button>
</div>
</div>
<section class="panel">
<div id="wrap"><h2 id="naslov"></h2><p id="opis"></p></div>
<div class="formula" id="formula"></div>
</section>
<section class="napredak">
<span id="ntekst"></span>
<div class="tacke" id="tacke"></div>
<div class="traka"><div id="ispuna"></div></div>
</section>
<section class="legenda" id="legenda"></section>
</main>
<footer>Az anyag automatikusan lejátszik — a jelenetek váltakoznak, és a teljes ciklus végtelenül ismétlődik.</footer>

<script>
'use strict';
// --- látható hibajelzés (ha valami elszáll, piros sáv jelenik meg) ---
window.onerror=function(m,s,l,c){
  var g=document.getElementById('greska');
  g.style.display='block';
  g.textContent='HIBA: '+m+' (sor '+l+')';
};

/* ===================== KONFIG ===================== */
const CONFIG={
  vremeScene:10,        // egy jelenet időtartama (s)
  prelaz:0.9,           // átmenet (fade) időtartama (s)
  bojaPoz:'#0d1420',    // vászon háttérszíne
  bojaTxt:'#e9eef7',    // fő szövegszín
  bojaPrig:'#8fa0b5',   // halvány szöveg / beosztás-címkék
  bojaMreze:'rgba(255,255,255,0.06)', // rács
  bojaOsa:'#7e8b9c',    // tengelyek
  font:15,              // alap betűméret a vásznon (px)
  bojaT:'#ff8a5c',      // hőmérséklet T
  bojaR:'#ffb454',      // sugárzás R
  bojaL:'#4fc3f7',      // hullámhossz λ
  bojaF:'#ffe95c',      // foton hν
  bojaE:'#4dd0e1',      // elektron e⁻
  bojaI:'#63e6be',      // áram I
  bojaU:'#b18cff',      // UV-tartomány
  bojaKl:'#ff4d6d',     // klasszikus fizika
  bojaKv:'#f472b6',     // kvantumfizika
  sigma:5.67e-8,        // Stefan–Boltzmann-állandó (W/(m²·K⁴))
  b:2.898e-3,           // Wien-állandó (m·K)
  c2:1.4388e-2,         // hc/k a Planck-formulában (m·K)
  lam:2.0,              // beeső foton hullámhossza a Compton-jelenetben (pm)
  lamC:2.426,           // Compton-hullámhossz (pm)
  Tmin:600,Tmax:3000,   // T-tartomány az 1. jelenetben (K)
  T1:4000,T2:6000,      // T-tartomány a 2–4. jelenetben (K)
  brzF:520,brzE:380,    // foton/elektron sebessége (px/s)
  periodSudara:2.5      // ütközés periódusa a 7. jelenetben (s) — 10 osztója legyen
};
const C=CONFIG;

/* ===================== VÁSZON ===================== */
const cv=document.getElementById('platno'), ctx=cv.getContext('2d');
let W=0,H=0;
function podesi(){
  const d=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',podesi);

/* ===================== SEGÉDFÜGGVÉNYEK ===================== */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sm=(a,b,t)=>clamp((t-a)/(b-a),0,1);
const fmt=(x,n)=>x.toFixed(n).replace('.',',');

let aS=1; // a jelenet globál átlátszósága (fade átmenet)
function al(a){ctx.globalAlpha=clamp(a,0,1)*aS;}
function txt(s,x,y,col,size,align,bold,a){
  al(a===undefined?1:a);
  ctx.fillStyle=col||C.bojaTxt;
  ctx.font=(bold?'700 ':'')+(size||C.font)+'px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
}
function strelica(x1,y1,x2,y2,col,w,h){
  w=w||2;h=h||9; al(1);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const u=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(u-0.45),y2-h*Math.sin(u-0.45));
  ctx.lineTo(x2-h*Math.cos(u+0.45),y2-h*Math.sin(u+0.45));
  ctx.closePath(); ctx.fill();
}
function talas(x,y,d,amp,n,col,faza,w,ugao){
  if(d<3)return; al(1);
  ctx.save(); ctx.translate(x,y); ctx.rotate(ugao||0);
  ctx.strokeStyle=col; ctx.lineWidth=w||1.6;
  ctx.beginPath();
  const k=Math.max(2.5,d/50);
  for(let s=0;s<=d;s+=k){
    const yy=amp*Math.sin(s/d*n*2*Math.PI+(faza||0));
    if(s===0)ctx.moveTo(0,yy);else ctx.lineTo(s,yy);
  }
  ctx.stroke(); ctx.restore();
}
function graf(x0,y0,w,h,x1,x2,y1,y2){
  return {x0:x0,y0:y0,w:w,h:h,
    px:function(v){return x0+(v-x1)/(x2-x1)*w;},
    py:function(v){return y0+h-(v-y1)/(y2-y1)*h;}};
}
function ose(g,xo,yo,xt,yt){
  al(1);
  ctx.strokeStyle=C.bojaMreze; ctx.lineWidth=1;
  ctx.beginPath(); let i;
  for(i=0;i<xt.length;i++){const x=g.px(xt[i]);ctx.moveTo(x,g.y0);ctx.lineTo(x,g.y0+g.h);}
  for(i=0;i<yt.length;i++){const y=g.py(yt[i]);ctx.moveTo(g.x0,y);ctx.lineTo(g.x0+g.w,y);}
  ctx.stroke();
  strelica(g.x0,g.y0+g.h,g.x0+g.w+12,g.y0+g.h,C.bojaOsa,1.5,7);
  strelica(g.x0,g.y0+g.h,g.x0,g.y0-12,C.bojaOsa,1.5,7);
  for(i=0;i<xt.length;i++)txt(String(xt[i]),g.px(xt[i]),g.y0+g.h+12,C.bojaPrig,12);
  for(i=0;i<yt.length;i++)if(yt[i]!==0)txt(String(yt[i]),g.x0-7,g.py(yt[i]),C.bojaPrig,12,'right');
  txt(xo,g.x0+g.w+4,g.y0+g.h+24,C.bojaTxt,14,'right',true);
  txt(yo,g.x0,g.y0-20,C.bojaTxt,14,'left',true);
}

/* ===================== FIZIKA ===================== */
function plank(lm,T){ // lm METRBEN
  const x=C.c2/(lm*T);
  return x>650?0:1/(Math.pow(lm,5)*(Math.exp(x)-1));
}
function sk(T){return Math.pow(T/C.T2,3);} // intenzitás növekedése T-vel
function plankRel(nm,T){ // nm-ben, a maximumra normálva
  const p=plank(nm*1e-9,T);
  if(p<=0)return 0;
  return p/plank(C.b/T,T); // λmax = b/T METRBEN
}
function rjRel(nm,T){ // Rayleigh–Jeans (rövid λ felé divergál)
  const x=C.c2/(nm*1e-9*T);
  return plankRel(nm,T)*(Math.exp(x)-1)/x;
}
function crtaPlank(g,T,col,a,w){
  al(a); ctx.strokeStyle=col; ctx.lineWidth=w||2;
  ctx.beginPath(); let ok=false;
  for(let l=10;l<=2000;l+=6){
    const y=Math.min(plankRel(l,T)*sk(T),1.08);
    if(!isFinite(y))continue;
    if(!ok){ctx.moveTo(g.px(l),g.py(y));ok=true;}else ctx.lineTo(g.px(l),g.py(y));
  }
  ctx.stroke();
  const lm=C.b/T*1e9; // nm
  return {x:g.px(lm), y:g.py(Math.min(sk(T),1.08)), lm:lm};
}
function crtaRJ(g,T,doL,col,a,w){
  al(a); ctx.strokeStyle=col; ctx.lineWidth=w||2.4;
  ctx.beginPath(); let ok=false,kx=null,ky=null;
  for(let l=2000;l>=doL;l-=8){
    const y=rjRel(l,T)*sk(T);
    if(y>60)break;
    if(!ok){ctx.moveTo(g.px(l),g.py(y));ok=true;}else ctx.lineTo(g.px(l),g.py(y));
    if(y<=1.12){kx=g.px(l);ky=g.py(y);}
  }
  ctx.stroke();
  return {x:kx,y:ky};
}
function tela(T){ // izzó test színe megjelenítéshez
  const t=clamp((T-C.Tmin)/(C.Tmax-C.Tmin),0,1);
  const st=[[0,64,18,12],[0.35,150,32,8],[0.65,255,110,20],[0.87,255,196,120],[1,255,246,228]];
  for(let i=0;i<st.length-1;i++){
    if(t<=st[i+1][0]){
      const u=(t-st[i][0])/(st[i+1][0]-st[i][0]);
      return 'rgb('+Math.round(lerp(st[i][1],st[i+1][1],u))+','+Math.round(lerp(st[i][2],st[i+1][2],u))+','+Math.round(lerp(st[i][3],st[i+1][3],u))+')';
    }
  }
  return 'rgb(255,246,228)';
}

/* ===================== JELENETEK ===================== */

// 1) Hősugárzás + Stefan–Boltzmann
function scena1(t){
  const T=C.Tmin+(C.Tmax-C.Tmin)*(0.5-0.5*Math.cos(2*Math.PI*t/C.vremeScene));
  const n=(T-C.Tmin)/(C.Tmax-C.Tmin), n4=n*n*n*n;
  const cx=W*0.28, cy=H*0.5, r=Math.min(W,H)*0.1;
  for(let i=0;i<3;i++){
    const f=(t*0.4+i/3)%1;
    al((1-f)*0.45*n+0.05);
    ctx.strokeStyle=C.bojaR; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(cx,cy,r+f*Math.min(W,H)*0.34,0,6.2832); ctx.stroke();
  }
  const boja=tela(T);
  al(1); ctx.save();
  ctx.shadowColor=boja; ctx.shadowBlur=20+70*n4;
  ctx.fillStyle=boja; ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.fill();
  ctx.restore();
  txt('T',cx,cy,C.bojaTxt,26,'center',true);
  for(let i=0;i<8;i++){
    const u=i*Math.PI/4+Math.PI/8, d=r+14+Math.min(W,H)*0.28*n4;
    strelica(cx+Math.cos(u)*(r+6),cy+Math.sin(u)*(r+6),cx+Math.cos(u)*d,cy+Math.sin(u)*d,C.bojaR,2,8);
  }
  txt('T = '+Math.round(T)+' K',cx,cy-r-26,C.bojaT,20,'center',true);
  const R=C.sigma*T*T*T*T;
  const rs=R>=1e6?fmt(R/1e6,2)+' MW/m²':(R>=1e3?fmt(R/1e3,1)+' kW/m²':fmt(R,0)+' W/m²');
  txt('R = '+rs,cx,cy+r+34,C.bojaR,17,'center',true);
  const g=graf(W*0.56,H*0.18,W*0.38,H*0.54,C.Tmin,C.Tmax,0,1);
  ose(g,'T (K)','R',[C.Tmin,1800,C.Tmax],[0,0.5,1]);
  al(1); ctx.strokeStyle=C.bojaR; ctx.lineWidth=2.6;
  ctx.beginPath();
  for(let TT=C.Tmin;TT<=T;TT+=20){
    const nn=(TT-C.Tmin)/(C.Tmax-C.Tmin);
    if(TT===C.Tmin)ctx.moveTo(g.px(TT),g.py(nn*nn*nn*nn));
    else ctx.lineTo(g.px(TT),g.py(nn*nn*nn*nn));
  }
  ctx.stroke();
  ctx.fillStyle=C.bojaR;
  ctx.beginPath(); ctx.arc(g.px(T),g.py(n4),5,0,6.2832); ctx.fill();
  txt('R(T) ∝ T⁴',g.x0+g.w/2,g.y0-30,C.bojaR,16,'center',true);
}

// 2) Planck-színkép
function scena2(t){
  const g=graf(W*0.08,H*0.18,W*0.84,H*0.56,0,2000,0,1.08);
  ose(g,'λ (nm)','R (rel.)',[0,500,1000,1500,2000],[0,0.5,1]);
  const d1=crtaPlank(g,C.T1,C.bojaT,0.3,1.6);
  const d2=crtaPlank(g,C.T2,C.bojaT,0.3,1.6);
  txt(C.T1+' K',d1.x+38,d1.y-8,C.bojaT,13,'center',false,0.7);
  txt(C.T2+' K',d2.x+38,d2.y-8,C.bojaT,13,'center',false,0.7);
  const T=C.T1+(C.T2-C.T1)*(0.5-0.5*Math.cos(2*Math.PI*t/C.vremeScene));
  const m=crtaPlank(g,T,C.bojaR,1,3);
  al(0.8);
  ctx.strokeStyle=C.bojaL; ctx.lineWidth=1.4; ctx.setLineDash([5,6]);
  ctx.beginPath(); ctx.moveTo(m.x,g.y0+g.h); ctx.lineTo(m.x,m.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=C.bojaL;
  ctx.beginPath(); ctx.arc(m.x,m.y,5.5,0,6.2832); ctx.fill();
  txt('λmax = '+Math.round(m.lm)+' nm',m.x,m.y-20,C.bojaL,15,'center',true);
  txt('T = '+Math.round(T)+' K',g.x0+g.w-8,g.y0+15,C.bojaT,19,'right',true);
}

// 3) Wien-féle eltolódási törvény
function scena3(t){
  const g=graf(W*0.08,H*0.18,W*0.84,H*0.56,0,2000,0,1.08);
  ose(g,'λ (nm)','R (rel.)',[0,500,1000,1500,2000],[0,0.5,1]);
  const Ts=[4000,5000,6000];
  for(let i=0;i<3;i++){
    const a=ease(sm(i*1.2,i*1.2+1,t));
    if(a<=0)continue;
    const m=crtaPlank(g,Ts[i],C.bojaL,a,2.4);
    al(a); ctx.fillStyle=C.bojaL;
    ctx.beginPath(); ctx.arc(m.x,m.y,5.5,0,6.2832); ctx.fill();
    txt(Ts[i]+' K',m.x+40,m.y-14,C.bojaT,14,'center',true,a);
  }
  const ah=ease(sm(3,4.2,t));
  if(ah>0){
    al(ah*0.9);
    ctx.strokeStyle=C.bojaTxt; ctx.lineWidth=1.6; ctx.setLineDash([5,7]);
    ctx.beginPath(); let ok=false;
    for(let T=3600;T<=7600;T+=40){
      const lm=C.b/T*1e9;
      const x=g.px(lm), y=g.py(Math.min(plankRel(lm,T)*sk(T),1.08));
      if(!ok){ctx.moveTo(x,y);ok=true;}else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.setLineDash([]);
    txt('λmax = b/T',g.px(1150),g.py(0.42),C.bojaTxt,14,'left',true,ah);
  }
  const T=C.T1+(C.T2-C.T1)*(0.5-0.5*Math.cos(2*Math.PI*t/C.vremeScene));
  const lm=C.b/T*1e9, ym=Math.min(plankRel(lm,T)*sk(T),1.08);
  al(0.85);
  ctx.strokeStyle=C.bojaL; ctx.lineWidth=1.4; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(g.px(lm),g.y0+g.h); ctx.lineTo(g.px(lm),g.py(ym)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=C.bojaL;
  ctx.beginPath(); ctx.arc(g.px(lm),g.py(ym),6,0,6.2832); ctx.fill();
  txt('T = '+Math.round(T)+' K  →  λmax = '+Math.round(lm)+' nm',g.x0+g.w-8,g.y0+15,C.bojaL,16,'right',true);
}

// 4) Ultraszóhillemet katasztrófa (ultraviola katasztrófa)
function scena4(t){
  const g=graf(W*0.08,H*0.16,W*0.84,H*0.58,0,2000,0,1.15);
  al(0.07); ctx.fillStyle=C.bojaU;
  ctx.fillRect(g.x0,g.y0,g.px(400)-g.x0,g.h);
  ose(g,'λ (nm)','R (rel.)',[0,500,1000,1500,2000],[0,0.5,1]);
  txt('UV',g.px(200),g.y0+15,C.bojaU,13,'center',true);
  const T=5000, prog=ease(sm(0.3,4.2,t));
  // vágás: a görbe "elszaladhat" a grafikonról — ez maga a katasztrófa
  ctx.save();
  ctx.beginPath(); ctx.rect(g.x0-2,g.y0-12,g.w+16,g.h+12); ctx.clip();
  const kr=crtaRJ(g,T,lerp(2000,60,prog),C.bojaKl,1,2.6);
  ctx.restore();
  if(t>4.2&&kr.x!==null){
    const a=sm(4.2,5,t);
    strelica(kr.x+46,kr.y+50,kr.x+46,g.y0-6,C.bojaKl,2.4,10);
    txt('R → ∞',kr.x+46,g.y0+13,C.bojaKl,17,'left',true,a);
    txt('ultraviola katasztrófa',g.x0+g.w*0.45,g.y0+13,C.bojaKl,16,'left',true,a);
  }
  txt('Rayleigh–Jeans (klasszikus fizika)',g.px(1550),g.py(0.35)-20,C.bojaKl,14,'left',true);
  const ap=ease(sm(4.8,6.2,t));
  if(ap>0){
    const m=crtaPlank(g,T,C.bojaKv,ap,3);
    txt('Planck (kvantumfizika)',g.px(720),g.py(0.62),C.bojaKv,15,'left',true,ap);
    al(ap); ctx.fillStyle=C.bojaKv;
    ctx.beginPath(); ctx.arc(m.x,m.y,5,0,6.2832); ctx.fill();
  }
}

// 5) Fotoeffektus — fotométer
const foto={fotoni:[],elektroni:[],zica:[],tajmer:0,broj:0};
function scena5(t,dt){
  foto.tajmer+=dt;
  while(foto.tajmer>0.8){foto.tajmer-=0.8; foto.fotoni.push({x:W*0.05,f:foto.broj++});}
  const cx=W*0.44, cy=H*0.55, r=Math.min(W,H)*0.3;
  const kx=cx-r*0.55, ax=cx+r*0.55;
  const kt=cy-r*0.42, kb=cy+r*0.42, wy=cy-r-32;
  let i;
  for(i=0;i<foto.fotoni.length;i++)foto.fotoni[i].x+=dt*C.brzF;
  for(i=foto.fotoni.length-1;i>=0;i--){
    if(foto.fotoni[i].x>=kx-8){foto.fotoni.splice(i,1);foto.elektroni.push({x:kx+8,f:Math.random()*6.28});}
  }
  for(i=0;i<foto.elektroni.length;i++)foto.elektroni[i].x+=dt*C.brzE;
  for(i=foto.elektroni.length-1;i>=0;i--){
    if(foto.elektroni[i].x>=ax-8){foto.elektroni.splice(i,1);foto.zica.push({d:0});}
  }
  const put=[[ax,kt],[ax,wy],[kx,wy],[kx,kt]];
  let duz=0;
  for(i=0;i<3;i++)duz+=Math.hypot(put[i+1][0]-put[i][0],put[i+1][1]-put[i][1]);
  for(i=0;i<foto.zica.length;i++)foto.zica[i].d+=dt*170;
  for(i=foto.zica.length-1;i>=0;i--)if(foto.zica[i].d>=duz)foto.zica.splice(i,1);
  // rajzolás
  al(0.5); ctx.strokeStyle='#5d6b7d'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.stroke();
  al(0.06); ctx.fillStyle='#8fa8c8';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.fill();
  al(1);
  ctx.strokeStyle='#6b7787'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(put[0][0],put[0][1]); ctx.lineTo(put[1][0],put[1][1]);
  ctx.lineTo(put[2][0],put[2][1]); ctx.lineTo(put[3][0],put[3][1]);
  ctx.stroke();
  ctx.fillStyle=C.bojaE; ctx.fillRect(kx-6,kt,12,kb-kt);
  ctx.fillStyle='#93a4b8'; ctx.fillRect(ax-6,kt,12,kb-kt);
  ctx.fillStyle=C.bojaPoz; ctx.strokeStyle='#93a4b8';
  ctx.beginPath(); ctx.arc(cx,wy,15,0,6.2832); ctx.fill(); ctx.stroke();
  txt('A',cx,wy+1,'#e9eef7',14,'center',true);
  for(i=0;i<foto.zica.length;i++){ // áram "pontocskák" a vezetékben
    let ost=foto.zica[i].d, px=ax, py=kt;
    for(let j=0;j<3;j++){
      const l=Math.hypot(put[j+1][0]-put[j][0],put[j+1][1]-put[j][1]);
      if(ost<=l){
        const u=ost/l;
        px=put[j][0]+(put[j+1][0]-put[j][0])*u;
        py=put[j][1]+(put[j+1][1]-put[j][1])*u;
        break;
      }
      ost-=l;
    }
    ctx.fillStyle=C.bojaE;
    ctx.beginPath(); ctx.arc(px,py,3.4,0,6.2832); ctx.fill();
  }
  const fy=cy-r*0.1;
  for(i=0;i<foto.fotoni.length;i++)
    talas(foto.fotoni[i].x-28,fy,24,5,2,C.bojaF,-t*14+foto.fotoni[i].f,2,0);
  for(i=0;i<foto.elektroni.length;i++){
    const e=foto.elektroni[i];
    ctx.fillStyle=C.bojaE;
    ctx.beginPath(); ctx.arc(e.x,cy+Math.sin(e.f)*r*0.3,5,0,6.2832); ctx.fill();
  }
  txt('K',kx-2,kb+18,C.bojaE,16,'center',true);
  txt('anód',ax,kb+18,'#c6d0dc',13);
  txt('hν',W*0.09,fy-18,C.bojaF,16,'center',true);
  txt('ν > ν₀  ⇒  I > 0',cx,wy-30,C.bojaI,15,'center',true);
}

// 6) Einstein-egyenlet a fotoeffektusra
function scena6(t){
  talas(W*0.05,H*0.25,W*0.13,6,3,C.bojaF,-t*12,2.2,0);
  txt('hν',W*0.115,H*0.17,C.bojaF,15,'center',true);
  const ex=W*0.11, ey=H*0.42;
  ctx.fillStyle=C.bojaE;
  ctx.beginPath(); ctx.arc(ex,ey,8,0,6.2832); ctx.fill();
  strelica(ex+12,ey,ex+50,ey,C.bojaE,2,9);
  txt('e⁻ (Ek)',ex+32,ey+24,C.bojaE,14,'center',true);
  const g=graf(W*0.32,H*0.16,W*0.6,H*0.6,0,12,-2.5,3);
  ose(g,'ν (10¹⁴ Hz)','Ek (eV)',[0,2,4,6,8,10,12],[-2,-1,0,1,2,3]);
  al(0.25);
  ctx.strokeStyle=C.bojaTxt; ctx.lineWidth=1; ctx.setLineDash([4,6]);
  ctx.beginPath(); ctx.moveTo(g.x0,g.py(0)); ctx.lineTo(g.x0+g.w,g.py(0)); ctx.stroke();
  ctx.setLineDash([]); al(1);
  const A=2, hE=0.4136; // eV, egységenként (10¹⁴ Hz)
  const aL=ease(sm(0.6,3,t));
  if(aL>0){
    ctx.strokeStyle=C.bojaI; ctx.lineWidth=2.8;
    ctx.beginPath();
    ctx.moveTo(g.px(0),g.py(-A));
    ctx.lineTo(g.px(12*aL),g.py(hE*12*aL-A));
    ctx.stroke();
  }
  const am=ease(sm(3.2,4,t));
  if(am>0){
    al(am);
    ctx.fillStyle=C.bojaU;
    ctx.beginPath(); ctx.arc(g.px(0),g.py(-A),5.5,0,6.2832); ctx.fill();
    txt('A = 2,00 eV (kilépési munka)',g.px(0)+10,g.py(-A)-6,C.bojaU,14,'left',true,am);
    const v0=A/hE;
    ctx.strokeStyle=C.bojaU; ctx.lineWidth=1.4; ctx.setLineDash([3,5]);
    ctx.beginPath(); ctx.moveTo(g.px(v0),g.py(-A)); ctx.lineTo(g.px(v0),g.py(0)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=C.bojaU;
    ctx.beginPath(); ctx.arc(g.px(v0),g.py(0),5,0,6.2832); ctx.fill();
    txt('ν₀ = A/h (küszöb)',g.px(v0),g.py(0)+18,C.bojaU,13,'center',true,am);
  }
  const v=4.9+6.1*(0.5-0.5*Math.cos(2*Math.PI*t/C.vremeScene));
  const ek=hE*v-A;
  ctx.strokeStyle=C.bojaF; ctx.lineWidth=1.2; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(g.px(v),g.py(0)); ctx.lineTo(g.px(v),g.py(ek)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=C.bojaF;
  ctx.beginPath(); ctx.arc(g.px(v),g.py(ek),6,0,6.2832); ctx.fill();
  txt('ν = '+fmt(v,1)+'·10¹⁴ Hz',g.px(v),g.py(ek)-32,C.bojaF,13,'center',true);
  txt('Ek = '+fmt(ek,2)+' eV',g.px(v),g.py(ek)-16,C.bojaI,14,'center',true);
}

// 7) Compton-effektus
function scena7(t){
  const P=C.periodSudara, u=t%P, tK=1;
  const fd=clamp(Math.min(u/0.25,(P-u)/0.45),0,1);
  const th=(90+30*Math.sin(2*Math.PI*t/C.vremeScene))*Math.PI/180;
  const xc=W*0.46, yc=H*0.5, x0=W*0.06;
  const v=(xc-x0)/tK;
  const dl=C.lamC*(1-Math.cos(th));
  al(fd);
  ctx.fillStyle=C.bojaE;
  ctx.beginPath(); ctx.arc(xc,yc,7,0,6.2832); ctx.fill();
  txt('e⁻',xc,yc+24,C.bojaE,15,'center',true);
  if(u<tK){
    const gl=xc-v*(tK-u);
    const sx=Math.max(x0,gl-90);
    talas(sx,yc,Math.min(90,gl-sx),8,3,C.bojaF,-u*14,2.2,0);
    txt('hν',x0+34,yc-22,C.bojaF,15,'center',true,true,fd);
    txt('λ = '+fmt(C.lam,1)+' pm',sx+45,yc+26,C.bojaL,15,'center',true,fd);
  }else{
    const d=(u-tK)*v;
    al(fd*0.35);
    ctx.strokeStyle=C.bojaF; ctx.lineWidth=1.2; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(xc,yc); ctx.lineTo(xc+W*0.4,yc); ctx.stroke();
    ctx.setLineDash([]);
    al(fd);
    const ds=Math.min(d,W*0.42);
    talas(xc,yc,ds,7,2,C.bojaF,-(u-tK)*14,2.2,-th);
    const hx=xc+Math.cos(th)*ds, hy=yc-Math.sin(th)*ds;
    txt('λ′ = '+fmt(C.lam+dl,2)+' pm',hx,hy-20,C.bojaL,15,'center',true,fd);
    const thE=th/2, de=d*0.32;
    const ex=xc+Math.cos(thE)*de, ey=yc+Math.sin(thE)*de;
    ctx.fillStyle=C.bojaE;
    ctx.beginPath(); ctx.arc(ex,ey,7,0,6.2832); ctx.fill();
    strelica(ex,ey,ex+Math.cos(thE)*34,ey+Math.sin(thE)*34,C.bojaE,2,8);
    ctx.strokeStyle=C.bojaTxt; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(xc,yc,40,-th,0); ctx.stroke();
    txt('θ = '+Math.round(th*180/Math.PI)+'°',xc+Math.cos(th/2)*60,yc-Math.sin(th/2)*60,C.bojaTxt,14,'center',true,fd);
  }
  al(fd);
  txt('Δλ = λ′ − λ = '+fmt(dl,2)+' pm',W*0.5,H*0.9,C.bojaL,16,'center',true);
}

/* ===================== FŐ CIKLUS ===================== */
const uk=SC.length*C.vremeScene;
let vt=0, proslo=performance.now(), tek=-1;
function frejm(){
  const sada=performance.now();
  const dt=Math.min((sada-proslo)/1000,0.05);
  proslo=sada;
  if(!pauza)vt=(vt+dt)%uk; // végtelen ciklus
  ctx.globalAlpha=1;
  ctx.fillStyle=C.bojaPoz;
  ctx.fillRect(0,0,W,H);
  const i=Math.min(Math.floor(vt/C.vremeScene),SC.length-1);
  const t=vt-i*C.vremeScene;
  const hp=C.prelaz/2;
  let a=1;
  if(t<hp)a=t/hp;
  if(C.vremeScene-t<hp)a=(C.vremeScene-t)/hp;
  aS=ease(clamp(a,0,1));
  SC[i].c(t,dt); // jelenet kirajzolása
  ctx.globalAlpha=1;
  if(i!==tek){ // panel szinkronizálása
    tek=i;
    document.getElementById('naslov').textContent=SC[i].n;
    document.getElementById('opis').textContent=SC[i].o;
    document.getElementById('formula').innerHTML=SC[i].f;
    document.getElementById('ntekst').textContent='Jelenet '+(i+1)+'/'+SC.length+' — '+SC[i].n;
    const tck=document.getElementById('tacke').children;
    for(let j=0;j<tck.length;j++)tck[j].className='tacka'+(j===i?' on':'');
    const wr=document.getElementById('wrap'), fo=document.getElementById('formula');
    wr.className=''; fo.className='formula';
    void wr.offsetWidth;
    wr.className='anim'; fo.className='formula anim';
  }
  document.getElementById('ispuna').style.width=(vt/uk*100)+'%';
  requestAnimationFrame(frejm);
}
