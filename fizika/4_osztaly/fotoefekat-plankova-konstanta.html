<!doctype html>
<!--
PLAN TRI ČASA — Fotoelektrični efekat: određivanje Plankove konstante (IV razred gimnazije)
Izvor: skripta „Kvantna priroda elektromagnetnog zračenja“, pogl. 2 (Ajnštajnova jednačina, izlazni rad, crvena granica).

A. ANALIZA SKRIPTE
- Zakon: h·ν = Ai + ½·m·v²  →  e·Uz = h·ν − Ai  →  Uz = (h : e)·ν − Ai : e
- Meri se: zaustavni napon Uz (digitalni voltmetar, rezolucija 0,01 V); trenutak „struja = 0“ učenik
  sam uočava na mikroampermetru (rezolucija 0,01 nA).
- Nezavisna promenljiva: ν = c : λ (λ bira učenik na monohromatoru, 250–700 nm, korak 1 nm).
- Linearizacija: Uz(ν) je prava; nagib k = h : e, odsečak n = −Ai : e.
- Konstanta: h = e·k (k u V po 10¹⁴ Hz → h = 16,0·k ·10⁻³⁴ J·s); Ai = −n (eV); ν0 = −n : k; λ0 = c : ν0.
- Referentne vrednosti iz skripte: h = 6,626·10⁻³⁴ J·s; katoda cezijum Ai ≈ 2,0 eV, λ0 ≈ 620 nm.
- Nesigurnost: granične prave, Δh = (hmax − hmin) : 2.
- Pretpostavke (skripta nema protokol vežbe): ΔUz ≈ 0,03 V (procena trenutka kada struja padne na nulu);
  monohromator ±2 nm (zanemareno u intervalima greške); kontaktni potencijal 0,06 V i termalno razmazivanje
  energija elektrona 0,012 eV (efekti drugog reda); jačina svetlosti 10–100 % (podrazumevano 60 %).
- Uslov pokrivenosti: bar 6 različitih λ sa fotoefektom (Uz > 0), raspon frekvencija bar 3·10¹⁴ Hz.

B. PROCENA TRAJANJA I RASPORED
| Čas | Pogledi            | Koraci                                                     | Procena   | Čeklista                                              |
|-----|--------------------|------------------------------------------------------------|-----------|-------------------------------------------------------|
| 1   | Priprema, Merenje  | uvod, podaci; 7–8 tačaka × (podesi λ ~1 min + traži U pri  | ~42 min   | podaci učenika; ≥ 6 λ sa fotoefektom; raspon ν ≥ 3   |
|     |                    | kom I = 0 ~1,5 min + upis ~0,5 min) ≈ 25–30 min            |           |                                                       |
| 2   | Obrada I           | tabela ν (8 redova × ~1,5 min = 12 min), grafici 5 min,     | ~35 min   | tabela tačna; A i B na pravoj; nagib k i odsečak n    |
|     |                    | nagib iz dve tačke 8 min, odsečak 5 min (+ čitanje uputstva)|           |                                                       |
| 3   | Obrada II,         | podsetnik; h 5 min; Ai, ν0, λ0 7 min; Δh 10 min;            | ~45 min   | h; Ai, ν0, λ0; Δh; rezultat; zaključak               |
|     | Zaključak          | rezultat 5 min; zaključak 15–20 min                        |           |                                                       |
Procena: tempo iz univerzalnog prompta (izvedena kolona ~1–2 min po redu, nagib ~8 min, nesigurnost ~10 min).
Merenje je stacionarno (nema vremenske simulacije), pa nema ni izbora brzine ×1/×2.
Preseci su na prirodnim prelomima: posle merenja, posle nagiba i odsečka.
C. SVESKA I RAČUNANJE (dopuna)
- Učenik svako merenje odmah prepisuje u svesku. Prozor „čas je završen“ posle 1. i 2. časa pokazuje
  šta mora da ima zapisano (merenja, izračunate kolone, A, B, nagib, rezultat).
- Na obradi i zaključku kartica „Podaci iz sveske“ služi za ponovni unos merenja i izračunatih kolona
  (drugi uređaj ili izgubljeni podaci). Na 3. času se iz sveske unose i A, B i nagib i odsečak n.
- Sve računa učenik digitronom; program crta grafike i proverava. Granične prave idu kroz krajeve
  intervala greške prve i poslednje tačke; učenik računa k_max i k_min, Δ i odstupanje δ u %.
  Automatsko popunjavanje tabele i linearna regresija vidljivi su samo uz „Pomoć“ (za nastavnika).
-->
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffcf7">
<title>Fotoefekat — Plankova konstanta — virtuelna laboratorija</title>
<style>
:root{
  --bg:#f5f1ea;--surface:#fffcf7;--surface2:#efe9df;--ink:#23272f;--muted:#646b77;--line:#e1d9cc;
  --acc:#c95b26;--acc-soft:#fae4d6;--acc-ink:#8a3a12;
  --blue:#2c69ab;--blue-soft:#e0ebf6;--blue-ink:#1d4a7c;
  --ok:#2b8352;--ok-soft:#e0f2e6;--bad:#bf3f39;--bad-soft:#f8e0de;--warn:#a96f14;--warn-soft:#faefd6;
  --stage:#1b222d;--stage2:#262f3d;--stage3:#323d4f;--stage-ink:#e7edf5;--stage-muted:#97a4b6;
  --r:16px;--shadow:0 1px 2px rgba(35,30,25,.05),0 6px 18px rgba(35,30,25,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.num,table,output,.readout b,.pill,.kv dd{font-variant-numeric:tabular-nums}
h2,h3,h4{line-height:1.25;letter-spacing:-.01em}
p{margin:0 0 10px}
ul{margin:0 0 10px;padding-left:20px}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--surface);padding:10px 14px;border-radius:10px}
.skip:focus{left:10px;top:10px}
.muted{color:var(--muted)}.small{font-size:14px}
sub,sup{line-height:0}

/* ---------- gornja traka ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,252,247,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) 8px calc(env(safe-area-inset-left) + 14px)}
.tb-row{display:flex;align-items:center;gap:8px;max-width:1320px;margin:0 auto}
.brand{flex:1;min-width:0;font-weight:750;font-size:15px;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--acc);margin-right:6px;vertical-align:1px}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font:inherit;font-size:13px;font-weight:600;padding:0 11px;cursor:pointer;color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lesson-ind{display:flex;align-items:center;gap:10px;max-width:1320px;margin:6px auto 0}
.li-t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.segs{display:flex;gap:4px;flex:0 0 120px;margin-left:auto}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.segs i.done{background:var(--ok)}
.segs i.cur{background:var(--acc)}

/* ---------- raspored ---------- */
.layout{max-width:1320px;margin:0 auto}
main{padding:14px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 14px);min-width:0;outline:none}
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;background:rgba(255,252,247,.97);border-top:1px solid var(--line);
  padding:4px calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 4px) calc(env(safe-area-inset-left) + 4px)}
.tabbar button{flex:1;min-width:0;min-height:54px;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;cursor:pointer;padding:2px}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button small{font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.8}
.tabbar button[aria-current="page"]{color:var(--acc-ink);background:var(--acc-soft)}
.tabbar button.done small::after{content:" ✓";color:var(--ok)}
.navgrp{margin-bottom:16px}
.navh{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--muted);padding:4px 12px 6px}
.navh span{display:block;font-weight:500;letter-spacing:0;font-size:12px;margin-top:1px}
.navh.done{color:var(--ok)}
.side button{display:block;width:100%;text-align:left;min-height:44px;border:0;background:none;border-radius:12px;padding:8px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.side button:hover{background:var(--surface2)}
.side button[aria-current="page"]{background:var(--acc-soft);color:var(--acc-ink);font-weight:700}
@media(min-width:1000px){
  .layout{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .side{display:block;position:sticky;top:96px;align-self:start;padding:18px 0 18px 14px;max-height:calc(100vh - 100px);overflow:auto}
  .tabbar{display:none}
  main{padding:18px 22px 48px}
}

.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vh{font-size:22px;margin:4px 0 12px}

/* ---------- kartice ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:0 0 8px;font-size:18px}
.card h4{margin:14px 0 6px;font-size:15px}
.hero{display:grid;gap:14px;background:linear-gradient(160deg,var(--surface) 55%,var(--acc-soft))}
.hero h2{font-size:25px;margin:6px 0 6px}
.hero figure{margin:0;background:var(--stage);border-radius:14px;padding:10px;color:var(--stage-ink)}
.hero figure svg{width:100%;height:auto;display:block}
.hero figcaption{color:var(--stage-muted);font-size:13px;margin-top:6px}
@media(min-width:720px){.hero{grid-template-columns:1.1fr 1fr;align-items:center}}
.law{border:2px solid var(--acc);border-radius:14px;padding:10px 14px;background:var(--surface);font-size:19px;text-align:center;margin:10px 0 4px;line-height:2.1}
.law small{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.grid2{display:grid;gap:14px}
.grid2>*{min-width:0}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;gap:10px}
@media(min-width:600px){.grid3{grid-template-columns:2fr 1fr 1fr}}

/* ---------- dugmad ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;font:inherit;font-weight:650;cursor:pointer;background:var(--acc);color:#fffaf5;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.blue{background:var(--blue)}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.xl{min-height:56px;font-size:18px;padding:0 24px}
.btn.wide{width:100%}
.btn.sm{font-size:14px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--acc-soft);color:var(--acc-ink)}
.banner{border-radius:12px;padding:10px 14px;background:var(--blue-soft);color:var(--blue-ink);margin:0 0 12px;font-size:15px}
.banner.warn{background:var(--warn-soft);color:#6f4a0c}
.banner.ok{background:var(--ok-soft);color:#1d5e3a}
.banner.acc{background:var(--acc-soft);color:var(--acc-ink)}

/* ---------- klizači (stp) ---------- */
.stp{margin:0 0 14px}
.stp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.stp-h label{font-weight:650;font-size:15px}
.stp-h output{font-weight:800;font-size:19px;color:var(--blue);white-space:nowrap}
.stp-row{display:flex;align-items:center;gap:8px}
.stp-row .slider{flex:1;min-width:0}
.sq{width:44px;height:44px;min-width:44px;padding:0;font-size:22px;font-weight:700}
.stp-lim{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 52px}
.slider{-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;cursor:pointer}
.slider::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue-soft),var(--line))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--blue);margin-top:-10px;border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.slider::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid var(--surface)}
.stage .stp-h output{color:#8cc0f5}

/* ---------- čipovi ---------- */
.chips{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.chip{min-height:40px;min-width:48px;border:0;background:none;border-radius:9px;padding:0 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ---------- polja ---------- */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:650;font-size:14px}
.in{font:inherit;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.in:focus{border-color:var(--blue)}
.in.ok{border-color:var(--ok);background:var(--ok-soft)}
.in.bad{border-color:var(--bad);background:var(--bad-soft)}
textarea.in{resize:vertical;line-height:1.5}
.inrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inrow .in{width:auto;flex:0 1 150px;min-width:96px;text-align:center}
.inrow label{font-weight:650}
.unit{color:var(--muted);font-weight:650}
.fb{font-size:14px;margin-top:8px;min-height:1px}
.fb:empty{display:none}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--warn)}
.fb .w{display:block;color:var(--warn);margin-top:3px}
.formula{font-size:18px;margin:12px 0;line-height:2.2;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}
.formula .in{width:130px;flex:0 0 auto;text-align:center}
.qrow{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.qrow:first-of-type{border-top:0}
.qrow .qname{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 -6px}
.stepnum{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-right:8px;vertical-align:2px}
.ab{display:grid;gap:8px;margin:8px 0}
.abrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:8px 10px}
.abrow b{width:22px;color:var(--acc-ink);font-size:17px}
.abc{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
.abrow .in{width:96px;flex:0 0 auto;text-align:center;min-height:42px}
.abrow .lbl{font-weight:650;margin-left:4px}

/* ---------- tabela ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;min-width:430px;font-size:15px}
.tbl th{font-size:13px;color:var(--muted);text-align:center;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap;font-weight:700}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl td.ix{color:var(--muted);font-size:13px;width:28px}
.tbl input{width:100%;min-width:92px;min-height:42px;border:1.5px dashed #c9bba6;border-radius:9px;text-align:center;font:inherit;background:var(--surface);color:var(--ink)}
.tbl input:focus{border-style:solid;border-color:var(--blue)}
.tbl input.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.tbl input.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.tbl tr.excl td{color:var(--muted);opacity:.7}
.tbl tr.exclnote td{font-size:13px;color:var(--warn);text-align:left;border-bottom:1px solid var(--line);white-space:normal}

/* ---------- grafici ---------- */
figure.gr{margin:0}
figure.gr figcaption{font-size:14px;font-weight:650;color:var(--muted);margin-bottom:4px}
canvas.plot{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#fffdf9;touch-action:manipulation}
canvas.plot.picking{cursor:crosshair;outline:3px solid var(--acc-soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:20px;height:0;border-top:2.5px solid}
.legend i.dash{border-top-style:dashed}
.legend i.dot{width:10px;height:10px;border-radius:50%;border:0}

/* ---------- pozornica ---------- */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:var(--r);padding:12px;margin:0 0 14px;box-shadow:var(--shadow)}
.stage svg{width:100%;height:auto;display:block}
.stage .cap{font-size:12px;color:var(--stage-muted);margin:4px 2px 0}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-top:10px}
.readout{background:var(--stage2);border-radius:12px;padding:8px 12px;min-width:0}
.readout small{display:block;color:var(--stage-muted);font-size:12px;font-weight:600}
.readout b{display:block;font-size:22px;font-weight:750;letter-spacing:.01em;white-space:nowrap}
.readout.big b{font-size:26px;color:#ffd79a}
.minip{margin-top:10px}
.minip canvas.plot{border-color:var(--stage3);background:var(--stage)}
.meas-grid{display:block}
@media(min-width:1000px){
  .meas-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:14px;align-items:start}
  .meas-grid .stage{position:sticky;top:100px}
}
.ctl h3{display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:800}
.recs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.rec{display:inline-flex;align-items:center;gap:2px;background:var(--blue-soft);color:var(--blue-ink);border-radius:999px;padding:0 0 0 12px;font-size:14px;font-weight:600}
.rec.warnrec{background:var(--warn-soft);color:#6f4a0c}
.rec button{width:44px;height:40px;border-radius:999px;border:0;background:none;cursor:pointer;font-size:18px;color:inherit}
.rec button:hover{background:rgba(0,0,0,.06)}
.cov{display:grid;gap:6px;margin-top:8px}
.covbar{display:flex;align-items:center;gap:8px;font-size:14px}
.covbar .bar{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.covbar .bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.covbar.ok .bar i{background:var(--ok)}
.covbar .t{flex:0 0 auto;min-width:46%}

/* ---------- cilj časa / podsetnik / kraj ---------- */
.goal{border-left:6px solid var(--acc)}
.goal .gh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.goal h3{margin:0 0 4px}
.goal ul{list-style:none;margin:8px 0 0;padding:0}
.goal li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:15px}
.goal li .bx{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid #cdbfa9;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;margin-top:1px}
.goal li.ok .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.goal li.ok .t{color:var(--muted)}
.goal .time{font-size:13px;color:var(--muted);margin:8px 0 0}
.remind{border-left:6px solid var(--blue);background:#f6f9fc}
.remind .kv{margin-bottom:8px}
.endcard{text-align:center;background:var(--surface2);box-shadow:none}
.empty{text-align:center;padding:26px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.resbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:var(--surface)}
.resbox .rbn{font-weight:800;margin-bottom:6px}
details{margin-top:10px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:650;color:var(--blue)}
.helponly{display:none!important}
body.help .helponly{display:block!important}
.teach{border:1.5px dashed var(--warn);background:var(--warn-soft);color:#6f4a0c;border-radius:12px;padding:8px 12px;font-size:14px;margin-top:10px}

/* ---------- razlomci ---------- */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .22em}
.frac>span{padding:0 .3em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.08em}
.frac>span:last-child{padding-top:.08em}

/* ---------- modal i toast ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(22,26,34,.45)}
.modal.open{display:flex}
.mbox{background:var(--surface);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.mbox h2{margin:0 0 10px;font-size:21px}
.mbox .kv{margin:8px 0}
@media(min-width:720px){.modal{align-items:center}.mbox{max-width:580px;border-radius:20px;padding:22px 24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.tst{background:#2b3241;color:#fff;border-radius:14px;padding:11px 16px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:up .2s ease;text-align:center}
.tst.ok{background:#22693f}.tst.bad{background:#9a332e}.tst.warn{background:#865810}
@media(min-width:1000px){#toast{bottom:26px}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* boje i animacije ove vežbe */
:root{--acc:#7a4fd6;--acc-soft:#ece4fb;--acc-ink:#4b2a96}
.ph{animation:phMove 2.4s linear infinite}
.ph1{animation-delay:.8s}.ph2{animation-delay:1.6s}
@keyframes phMove{0%{transform:translateX(-30px);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateX(60px);opacity:0}}
.hel{animation:elFly 2.4s ease-out infinite;opacity:0}
.he1{animation-delay:.6s}.he2{animation-delay:1.2s}.he3{animation-delay:1.8s}
@keyframes elFly{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(85px,-10px);opacity:0}}
@media (prefers-reduced-motion: reduce){.hel{opacity:1}}


/* sveska: unos podataka iz sveske */
.paper{border-left:6px solid var(--blue)}
.paper summary{gap:8px;flex-wrap:wrap}
.paper summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.paper[open] summary::after{content:"▴"}
.tbl.ptbl,.tbl.ctbl{min-width:0}
.tbl.ptbl th,.tbl.ptbl td,.tbl.ctbl th,.tbl.ctbl td{padding:4px 3px}
.tbl.ptbl input{min-width:52px;width:64px;min-height:40px;padding:4px 3px}
.tbl.ptbl .pc{background:var(--blue-soft)}
.tbl.ptbl .sq{width:34px;min-width:34px;height:40px;font-size:16px}
@media(min-width:520px){.tbl.ptbl input{width:88px}.tbl.ptbl th,.tbl.ptbl td,.tbl.ctbl th,.tbl.ctbl td{padding:5px 7px}}
</style>
</head>
<body>
<a class="skip" href="#main">Preskoči na sadržaj</a>
<header class="topbar">
  <div class="tb-row">
    <div class="brand" id="brand"></div>
    <button class="iconbtn" id="btnAbout" type="button">O modelu</button>
    <button class="iconbtn" id="btnHelp" type="button" aria-pressed="false" aria-label="Pomoć (za nastavnika)" title="Pomoć (za nastavnika)">Pomoć</button>
  </div>
  <div class="lesson-ind"><span class="li-t" id="liT" aria-live="polite"></span><div class="segs" id="segs" role="img"></div></div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Pogledi po časovima"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Pogledi po časovima"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mbox"><h2 id="mTitle"></h2><div id="mBody"></div><div class="btnrow" id="mActs" style="margin-top:16px"></div></div></div>
<script>
(function(){
'use strict';
/* =====================================================================
   JEZGRO — zajedničko za sve tri laboratorije
   (stanje, časovi, navigacija, klizači, grafici, obrada, zaključak)
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const SUPM={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(c=>SUPM[c]||c).join('');
function fmt(x,d){ if(x==null||!isFinite(x)) return '—'; d=d==null?2:d; let s=Number(x).toFixed(d); if(/^-0(\.0*)?$/.test(s)) s=s.slice(1); return s.replace('.',',').replace('-','−'); }
function fmtIn(x,d){ return fmt(x,d).replace('−','-'); }
function parseNum(s){ if(s==null) return NaN; s=String(s).trim().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(',','.'); if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN; return parseFloat(s); }
function decOf(s){ s=String(s==null?'':s).trim().replace(',','.'); const i=s.indexOf('.'); return i<0?0:s.length-i-1; }
function sigOf(s){ s=String(s==null?'':s).trim().replace(/[-+−]/g,'').replace(',','.').replace('.','').replace(/^0+/,''); return s.length; }
const within=(a,t,abs,rel)=>isFinite(a)&&isFinite(t)&&Math.abs(a-t)<=abs+Math.abs(t)*rel;
const FR=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){ const d=new Date(); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}.`; }
function randn(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function poisson(l){ if(!(l>0)) return 0; if(l<30){ const L=Math.exp(-l); let k=0,p=1; do{ k++; p*=Math.random(); }while(p>L&&k<200); return k-1; } return Math.max(0,Math.round(l+Math.sqrt(l)*randn())); }
const softplus=x=>x>30?x:Math.log1p(Math.exp(x));
const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function roundUnc(d){ if(!(d>0)) return {d:0,dec:0}; const e=Math.floor(Math.log10(d)); const lead=d/Math.pow(10,e); const sig=lead<2.95?2:1; const dec=Math.max(0,sig-1-e); return {d:+d.toFixed(dec),dec}; }

/* ---------- toast i modal ---------- */
function toast(msg,kind){ const box=$('#toast'); if(!box) return; const el=document.createElement('div'); el.className='tst'+(kind?' '+kind:''); el.textContent=msg; box.appendChild(el); while(box.children.length>3) box.removeChild(box.firstChild); setTimeout(()=>el.remove(),4300); }
let lastFocus=null;
function modal(o){
  lastFocus=document.activeElement;
  $('#mTitle').innerHTML=o.title||''; $('#mBody').innerHTML=o.html||'';
  const a=$('#mActs'); a.innerHTML='';
  (o.actions&&o.actions.length?o.actions:[{label:'Zatvori'}]).forEach((b,i)=>{ const el=document.createElement('button'); el.type='button'; el.className='btn '+(b.cls||(i?'ghost':'')); el.innerHTML=b.label; el.addEventListener('click',()=>{ closeModal(); if(b.fn) b.fn(); }); a.appendChild(el); });
  $('#modal').classList.add('open');
  setTimeout(()=>{ const f=a.querySelector('button'); if(f) f.focus(); },40);
}
function closeModal(){ $('#modal').classList.remove('open'); if(lastFocus&&document.contains(lastFocus)){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} } }

/* ---------- stanje i trajnost ---------- */
let S=null;
const ANS={};
const plain=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
function merge(d,o){
  if(!plain(o)) return d;
  Object.keys(d).forEach(k=>{
    if(!(k in o)) return; const a=d[k], b=o[k];
    if(plain(a)){ if(plain(b)) d[k]=Object.keys(a).length?merge(a,b):b; }
    else if(Array.isArray(a)){ if(Array.isArray(b)) d[k]=b; }
    else if(a===null||typeof a===typeof b){ if(typeof b!=='number'||isFinite(b)) d[k]=b; }
  });
  return d;
}
function DEF(){ return Object.assign({ver:1,student:{name:'',group:'',date:today()},view:'priprema',done:{'1':false,'2':false,'3':false},started:false,help:false,speed:1,records:[],proc:{},concl:'',scan:{key:'',pts:[]},paper:false,devs:{}},LAB.defState()); }
function sanitize(){
  if(!LAB.views.some(v=>v.id===S.view)) S.view='priprema';
  if(S.speed!==2) S.speed=1;
  S.records=S.records.filter(r=>plain(r)&&r.id&&(!LAB.validRecord||LAB.validRecord(r)));
  if(!plain(S.scan)||!Array.isArray(S.scan.pts)) S.scan={key:'',pts:[]};
  S.scan.pts=S.scan.pts.filter(p=>plain(p)&&isFinite(p.x)&&isFinite(p.y)).slice(-80);
  Object.values(ANS).forEach(a=>a.sanitize());
  if(LAB.sanitize) LAB.sanitize();
}
function load(){ let had=false; S=DEF(); try{ const raw=localStorage.getItem(LAB.key); if(raw){ S=merge(DEF(),JSON.parse(raw)); had=true; } }catch(e){ S=DEF(); } sanitize(); return had; }
let saveT=0;
function save(now){ clearTimeout(saveT); const f=()=>{ try{ localStorage.setItem(LAB.key,JSON.stringify(S)); }catch(e){} }; if(now) f(); else saveT=setTimeout(f,350); }

/* ---------- časovi i navigacija ---------- */
const viewDef=id=>LAB.views.find(v=>v.id===id)||LAB.views[0];
const firstView=n=>LAB.views.find(v=>v.lesson===n).id;
const lastViewOf=n=>{ const a=LAB.views.filter(v=>v.lesson===n); return a[a.length-1].id; };
const lessonOf=id=>viewDef(id).lesson;
function evalChecks(n){ return LAB.lessons[n-1].checks.map(c=>{ let ok=false; try{ ok=!!c.ok(); }catch(e){ ok=false; } return {label:c.label,ok}; }); }
function renderNav(){
  let h='';
  LAB.lessons.forEach(L=>{
    h+=`<div class="navgrp"><div class="navh${S.done[L.n]?' done':''}">ČAS ${L.n}${S.done[L.n]?' ✓':''}<span>${L.title}</span></div>`;
    LAB.views.filter(v=>v.lesson===L.n).forEach(v=>{ h+=`<button type="button" data-go="${v.id}"${S.view===v.id?' aria-current="page"':''}>${v.label}</button>`; });
    h+='</div>';
  });
  $('#side').innerHTML=h;
  $('#tabbar').innerHTML=LAB.views.map(v=>`<button type="button" data-go="${v.id}" class="${S.done[v.lesson]?'done':''}"${S.view===v.id?' aria-current="page"':''}><small>ČAS ${v.lesson}</small><span>${v.label}</span></button>`).join('');
}
function renderInd(){
  const v=viewDef(S.view), L=LAB.lessons[v.lesson-1];
  $('#liT').textContent=`Čas ${L.n} / 3 · ${L.title}`;
  $('#segs').innerHTML=[1,2,3].map(n=>`<i class="${S.done[n]?'done':''}${n===L.n?' cur':''}"></i>`).join('');
  $('#segs').setAttribute('aria-label',`Napredak: završeno ${[1,2,3].filter(n=>S.done[n]).length} od 3 časa`);
}
function renderGoals(){
  $$('[data-goal]').forEach(el=>{
    const n=+el.dataset.goal, L=LAB.lessons[n-1], cs=evalChecks(n), k=cs.filter(c=>c.ok).length;
    el.innerHTML=`<div class="gh"><h3>Cilj ${n}. časa — ${L.title}</h3><span class="pill ${k===cs.length?'ok':'acc'}">${k} / ${cs.length}</span></div><p class="small" style="margin:0">${L.goal}</p><ul>${cs.map(c=>`<li class="${c.ok?'ok':''}"><span class="bx" aria-hidden="true">${c.ok?'✓':''}</span><span class="t">${c.label}</span><span class="sr">${c.ok?' — urađeno':' — nije urađeno'}</span></li>`).join('')}</ul><p class="time">Okvirno vreme: ${L.time}</p>`;
  });
  $$('[data-end]').forEach(b=>{ const n=+b.dataset.end; b.textContent=S.done[n]?`${n}. čas je završen ✓ — završi ponovo`:(n<3?`Završi ${n}. čas`:'Završi 3. čas i vežbu'); });
}
function renderLock(id){
  const slot=$(`#v-${id} .lockslot`); if(!slot) return;
  const m=LAB.needs&&LAB.needs[id]?LAB.needs[id]():null;
  slot.innerHTML=m?`<div class="banner warn" role="note"><b>Pažnja:</b> ${m.text}<div class="btnrow" style="margin-top:8px"><button type="button" class="btn ghost sm" data-go="${m.back}">← ${m.backLabel}</button></div></div>`:'';
}
function go(id){
  if(!LAB.views.some(v=>v.id===id)) id=LAB.views[0].id;
  S.view=id;
  $$('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+id));
  renderNav(); renderInd(); renderLock(id);
  const v=viewDef(id);
  if(v.kind==='proc') mountProc(v);
  if(v.kind==='concl') renderConcl();
  if(LAB.onView) LAB.onView(id);
  refresh(); save();
  window.scrollTo(0,0);
}
function refresh(){ renderGoals(); syncSteppers(); if(LAB.refresh) LAB.refresh(); }
function endLesson(n){
  const L=LAB.lessons[n-1], miss=evalChecks(n).filter(c=>!c.ok);
  S.done[n]=true; save(true);
  let html=`<div class="banner ok">${LAB.lessonSummary(n)}</div>`;
  if(n<3) html+=copyHTML(n);
  if(miss.length) html+=`<p class="small"><b>Još nije urađeno:</b> ${miss.map(c=>c.label).join('; ')}. Možeš se vratiti i dovršiti.</p>`;
  html+=`<p><b>Podaci su sačuvani na ovom uređaju.</b> ${n<3?`Sledeći čas: <b>${LAB.lessons[n].title}</b>.`:'Vežba je završena — rezultate i zaključak prepiši u vežbanku.'}</p>`;
  modal({title:`${n}. čas je završen`,html,actions:n<3?[{label:`Pređi na ${n+1}. čas →`,fn:()=>go(firstView(n+1))},{label:'Ostani ovde'}]:[{label:'U redu'}]});
  renderNav(); renderInd(); renderGoals();
}
function resume(){
  const v=viewDef(S.view), L=LAB.lessons[v.lesson-1];
  modal({title:'Nastavak vežbe',html:`<p>${S.student.name?`Zdravo, <b>${esc(S.student.name)}</b>! `:''}Nastavljaš <b>${L.n}. čas — ${L.title}</b> (pogled „${v.label}“).</p><p class="small muted">Zabeleženih merenja: ${S.records.length}. Svi podaci su sačuvani samo na ovom uređaju.</p>`,actions:[{label:'Nastavi →',fn:()=>go(S.view)},{label:'Počni ispočetka',fn:wipe}]});
}
function wipe(){
  if(!confirm('Obrisati sve podatke ove vežbe na ovom uređaju? Ovo se ne može poništiti.')) return;
  try{ localStorage.removeItem(LAB.key); }catch(e){}
  S=DEF(); sanitize(); if(LAB.reset) LAB.reset();
  $$('[data-stu]').forEach(i=>{ i.value=S.student[i.dataset.stu]||''; });
  go('priprema'); toast('Svi podaci su obrisani.');
}

/* ---------- klizač sa − / + (parametar u intervalu) ---------- */
const STEPPERS=[];
function mountStepper(host,p,get,set){
  const id='p-'+p.id+'-'+STEPPERS.length;
  host.innerHTML=`<div class="stp"><div class="stp-h"><label for="${id}">${p.label}</label><output for="${id}"></output></div><div class="stp-row"><button type="button" class="btn ghost sq" data-s="-1" aria-label="Smanji: ${p.label}">−</button><input type="range" class="slider" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}"><button type="button" class="btn ghost sq" data-s="1" aria-label="Povećaj: ${p.label}">+</button></div><div class="stp-lim"><span>${fmt(p.min,p.dec)}${p.unit==='°'?'':' '}${p.unit}</span><span>${fmt(p.max,p.dec)}${p.unit==='°'?'':' '}${p.unit}</span></div>${p.hint?`<p class="small muted" style="margin:4px 0 0">${p.hint}</p>`:''}</div>`;
  const sl=host.querySelector('input'), out=host.querySelector('output');
  const upd=()=>{ const v=get(); if(document.activeElement!==sl) sl.value=v; const sp=p.unit==='°'?'':' '; out.textContent=`${fmt(v,p.dec)}${sp}${p.unit}`; sl.setAttribute('aria-valuetext',`${fmt(v,p.dec)}${sp}${p.unit}`); };
  const apply=v=>{ v=p.min+Math.round((clamp(v,p.min,p.max)-p.min)/p.step)*p.step; v=+clamp(v,p.min,p.max).toFixed(6); if(v!==get()) set(v); syncSteppers(); };
  sl.addEventListener('input',()=>apply(+sl.value));
  sl.addEventListener('change',()=>{ sl.value=get(); });
  host.querySelectorAll('[data-s]').forEach(b=>{
    let t=null,t2=null; const stop=()=>{ clearTimeout(t); clearInterval(t2); };
    b.addEventListener('click',e=>{ if(e.detail===0) apply(get()+(+b.dataset.s)*p.step); });
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); apply(get()+(+b.dataset.s)*p.step); t=setTimeout(()=>{ t2=setInterval(()=>apply(get()+(+b.dataset.s)*p.step),70); },420); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  });
  STEPPERS.push(upd); upd();
}
function syncSteppers(){ STEPPERS.forEach(f=>f()); }
function speedChips(){ return `<div class="btnrow"><span class="small muted">Brzina simulacije:</span><div class="chips" role="group" aria-label="Brzina simulacije"><button type="button" class="chip" data-speed="1">×1</button><button type="button" class="chip" data-speed="2">×2</button></div></div>`; }
function paintSpeed(){ $$('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.speed===S.speed))); }

/* ---------- grafici (canvas, bez biblioteka) ---------- */
function setupCanvas(cv){
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(240,Math.round(cv.clientWidth||(cv.parentNode&&cv.parentNode.clientWidth)||300));
  const h=Math.round(clamp(w*(+cv.dataset.ratio||0.66),190,+cv.dataset.max||420));
  cv.style.height=h+'px'; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const c=cv.getContext&&cv.getContext('2d'); if(c) c.setTransform(dpr,0,0,dpr,0,0);
  return {c,w,h};
}
function niceStep(range,target){ const raw=range/(target||6); const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function ticksArr(min,max,target){ const st=niceStep(max-min,target); const a=[]; for(let v=Math.ceil(min/st-1e-9)*st,i=0;v<=max+st*1e-9&&i<60;v+=st,i++) a.push(+v.toFixed(12)); return {ticks:a,step:st}; }
function niceRange(min,max){ if(!(isFinite(min)&&isFinite(max))) return [0,1]; if(max-min<1e-12){ const d=Math.abs(min)*0.1||1; min-=d; max+=d; } const pad=(max-min)*0.04; min-=pad; max+=pad; const st=niceStep(max-min,6); return [Math.floor(min/st)*st,Math.ceil(max/st)*st]; }
function plot(cv,o){
  const {c,w,h}=setupCanvas(cv); if(!c) return;
  const dark=!!o.dark;
  const col={bg:dark?'#1b222d':'#fffdf9',grid:dark?'#2c3646':'#eee7dc',axis:dark?'#7f8da1':'#8d8576',txt:dark?'#c3cdda':'#59606c',pt:dark?'#8cc0f5':'#2c69ab',ex:'#9a9a9a'};
  c.fillStyle=col.bg; c.fillRect(0,0,w,h);
  const pad={l:o.padL||(w<380?50:58),r:12,t:12,b:42};
  let xs=[],ys=[];
  (o.pts||[]).forEach(p=>{ if(!isFinite(p.x)||!isFinite(p.y)) return; xs.push(p.x); ys.push(p.y-(p.ey||0),p.y+(p.ey||0)); });
  if(o.xr) xs.push(...o.xr); if(o.yr) ys.push(...o.yr);
  if(o.zeroX) xs.push(0); if(o.zeroY) ys.push(0);
  if(!xs.length){ xs=[0,1]; } if(!ys.length){ ys=[0,1]; }
  const [x0,x1]=o.xfix||niceRange(Math.min(...xs),Math.max(...xs));
  const [y0,y1]=o.yfix||niceRange(Math.min(...ys),Math.max(...ys));
  const pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
  const X=x=>pad.l+(x-x0)/(x1-x0)*pw, Y=y=>pad.t+ph-(y-y0)/(y1-y0)*ph;
  const tx=ticksArr(x0,x1,w<420?4:7), ty=ticksArr(y0,y1,h<260?4:6);

function legendHTML(items){ return items.map(it=>`<span><i class="${it.dash?'dash':''}${it.dot?'dot':''}" style="${it.dot?'background':'border-top-color'}:${it.color}"></i>${it.label}</span>`).join(''); }

/* granične prave: kroz krajeve intervala greške prve i poslednje tačke (po x); nagibe računa učenik */

/* ---------- OBRADA: tabela → grafici → nagib → konstanta → nesigurnost → rezultat ---------- */
function makeAnalysis(cfg){

  A.sanitize=()=>{ const s=S.proc[cfg.id]; S.proc[cfg.id]=plain(s)?merge(D0(),s):D0(); };
  const st=()=>S.proc[cfg.id];
  const inCols=cfg.cols.filter(c=>c.input), colBy=k=>cfg.cols.find(c=>c.key===k);
  const rows=()=>cfg.rows(), valid=r=>cfg.valid?cfg.valid(r):true;
  const q0=cfg.consts[0];
  function exG(r){ const m={}; const g=k=>{ if(k in m) return m[k]; const c=colBy(k); return (m[k]=c.input?c.exact(r,g):c.val(r)); }; return g; }
  function stG(r){ const T=st().tbl[r.key]||{}, e=exG(r); return k=>{ const c=colBy(k); if(!c.input) return c.val(r); const v=parseNum(T[k]); return isFinite(v)?v:e(k); }; }

  A.tableDone=()=>{ const s=A.stats(); return s.n>=cfg.minRows&&s.ok===s.tot; };
  function pts(){ return rows().map(r=>{ const g=exG(r), v=valid(r); return {x:cfg.X(g,r),y:cfg.Y(g,r),ey:cfg.ey(r),valid:v,shown:v&&rowOk(r)}; }); }
  A.fitShown=()=>{ const P=pts().filter(p=>p.shown); return P.length>=2?linfit(P):null; };
  A.lims=()=>{ const P=pts().filter(p=>p.shown), f=P.length>=2?linfit(P):null, L=limitLines(P); if(!L) return null; const r=v=>+v.toFixed(cfg.kDec); return {kmax:r(L.kmax),kmin:r(L.kmin),L}; };
  const kS=()=>parseNum(st().k), nS=()=>parseNum(st().n);

  const back=`<button type="button" class="btn ghost" data-go="${cfg.backView}">← ${cfg.backLabel}</button>`;

    else { fb.className='fb bad'; const m=[]; if(!u.okMax||!u.okMin) m.push(`${q0.sym}<sub>max</sub> i ${q0.sym}<sub>min</sub> računaš istom formulom kao u koraku 4, samo sa k<sub>max</sub> i k<sub>min</sub>.`); if(!u.okD) m.push(`Δ${q0.sym} je polovina razlike ${q0.sym}<sub>max</sub> i ${q0.sym}<sub>min</sub> (uvek pozitivna).`); fb.innerHTML=m.join(' '); }
  }
  R.result=el=>{
    const s=st(), f=A.fitShown();
    el.innerHTML=`<div class="card"><h3><span class="stepnum">6</span>Konačan rezultat</h3>
      <p class="small">Nesigurnost zaokruži na <b>jednu značajnu cifru</b> (dve ako počinje sa 1 ili 2), a vrednost na <b>isto decimalno mesto</b>.</p>
      <div class="formula"><span>${q0.sym} = (</span><label class="sr" for="rc-${cfg.id}">vrednost</label><input class="in" id="rc-${cfg.id}" data-r="rc" inputmode="decimal" autocomplete="off" value="${esc(s.rc)}"><span>±</span><label class="sr" for="rd-${cfg.id}">nesigurnost</label><input class="in" id="rd-${cfg.id}" data-r="rd" inputmode="decimal" autocomplete="off" value="${esc(s.rd)}"><span>) ${q0.unit}</span></div>
      <button type="button" class="btn" data-rchk>Proveri rezultat</button><div class="fb" data-rfb aria-live="polite"></div>
      ${s.auto?'<p class="small muted" style="margin-top:8px">⚑ Deo obrade je popunjen automatski.</p>':''}
      <details class="helponly"><summary>Linearna regresija (pomoć za nastavnika)</summary><p class="small">${f?`Računar je kroz tvoje tačke povukao pravu metodom najmanjih kvadrata: nagib k = ${fmt(f.b,cfg.kDec+1)} ${cfg.ku}, što daje ${q0.sym} ≈ ${fmt(q0.f(f.b,f.a),q0.dec)} ${q0.unit}. Koeficijent determinacije R² = ${fmt(f.R2,4)} (što bliže 1, to tačke bolje leže na pravoj).`:'Prvo popuni tabelu.'}</p></details>
      <div class="helponly teach"><b>Za nastavnika:</b> <button type="button" class="btn ghost sm" data-allauto>Popuni celu obradu</button></div></div>`;
    el.querySelectorAll('[data-r]').forEach(i=>i.addEventListener('input',()=>{ st()[i.dataset.r]=i.value; i.classList.remove('ok','bad'); save(); }));
    el.querySelector('[data-rchk]').addEventListener('click',()=>{ showRes(el,true); refresh(); });
    el.querySelector('[data-allauto]').addEventListener('click',()=>{ A.autoAll(); save(); const v=viewDef(S.view); if(v.kind==='proc') mountProc(v); refresh(); toast('Obrada je popunjena automatski.','warn'); });
    if(s.rc||s.rd) showRes(el,false);
  };
  function showRes(el,loud){
    const r=A.rEval(), fb=el.querySelector('[data-rfb]');
    el.querySelectorAll('[data-r]').forEach(i=>{ i.classList.toggle('ok',r.ok); i.classList.toggle('bad',!r.ok&&!!st()[i.dataset.r]); });
    if(r.ok){ fb.className='fb ok'; fb.innerHTML=`✓ Rezultat je pravilno zapisan: ${q0.sym} = (${esc(st().rc)} ± ${esc(st().rd)}) ${q0.unitTxt||''}`; if(loud) toast('Rezultat je tačan!','ok'); }

  A.mount=(host,parts)=>{ host.innerHTML=parts.map(p=>`<div data-part="${p}"></div>`).join(''); parts.forEach(p=>R[p](host.querySelector(`[data-part="${p}"]`))); pick=null; };
  ANS[cfg.id]=A;
  return A;
}

/* ---------- podaci iz sveske (ponovni unos na 2. i 3. času) ---------- */
const PCOLS=()=>Object.values(ANS).flatMap(a=>a.cfg.cols.filter(c=>c.input).map(c=>({an:a.id,c})));
const pRows=()=>S.records.slice().sort(LAB.paper.order||(()=>0));
const tblOf=(an,id)=>(S.proc[an]&&S.proc[an].tbl[id])||{};
function pdRow(i,r){
  const F=LAB.paper.fields, PC=PCOLS();
  return `<tr><td class="ix">${i+1}</td>${F.map((f,j)=>`<td><input inputmode="decimal" autocomplete="off" data-pf="${f.key}" aria-label="${f.acc}, red ${i+1}" value="${esc(r.f[j]||'')}"></td>`).join('')}${PC.map((p,j)=>`<td class="pc"><input inputmode="decimal" autocomplete="off" data-pc="${p.an}|${p.c.key}" aria-label="${p.c.aria} (izračunato), red ${i+1}" value="${esc(r.c[j]||'')}"></td>`).join('')}<td><button class="btn ghost sq" type="button" data-pdrm aria-label="Ukloni red ${i+1}">✕</button></td></tr>`;
}
function paperCard(open,intro){
  const F=LAB.paper.fields, PC=PCOLS();
  const rows=pRows().map(r=>({f:F.map(f=>fmt(r[f.key],f.dec)),c:PC.map(p=>tblOf(p.an,r.id)[p.c.key]||'')}));
  while(rows.length<6) rows.push({f:[],c:[]});
  return `<details class="card paper" id="pd"${open?' open':''}><summary>✎ Podaci iz sveske ${S.records.length?`<span class="pill">${S.records.length} merenja</span>`:''}${S.paper?'<span class="pill ok">uneto iz sveske</span>':''}</summary>
  ${intro?`<div class="banner warn" style="margin-top:10px">${intro}</div>`:''}
  <p class="small muted">Ako si merio na drugom uređaju ili su podaci nestali, prepiši ih ovde iz sveske i klikni „Učitaj podatke iz sveske“. <b>Plave kolone</b> su vrednosti koje si izračunao digitronom na prethodnom času — upiši ih ako ih već imaš (inače ostaju prazne).</p>
  <div class="tblwrap"><table class="tbl ptbl"><thead><tr><th>#</th>${F.map(f=>`<th>${f.label}</th>`).join('')}${PC.map(p=>`<th class="pc">${p.c.label}</th>`).join('')}<th><span class="sr">Ukloni red</span></th></tr></thead><tbody id="pdBody">${rows.map((r,i)=>pdRow(i,r)).join('')}</tbody></table></div>
  <div class="btnrow" style="margin-top:10px"><button class="btn ghost sm" type="button" id="pdAdd">+ Dodaj red</button><button class="btn" type="button" id="pdLoad">Učitaj podatke iz sveske</button></div>
  <div class="fb" id="pdMsg" aria-live="polite"></div></details>`;
}
function pdAdd(){ const tb=$('#pdBody'); if(!tb) return; const n=tb.rows.length; tb.insertAdjacentHTML('beforeend',pdRow(n,{f:[],c:[]})); const i=tb.rows[n].querySelector('input'); if(i) i.focus(); }
function pdRm(btn){
  const tb=$('#pdBody'), tr=btn.closest('tr'); if(!tb||!tr) return;
  if(tb.rows.length<=1){ tr.querySelectorAll('input').forEach(x=>x.value=''); return; }
  tr.remove();
  Array.from(tb.rows).forEach((r,i)=>{ r.cells[0].textContent=i+1; r.querySelectorAll('[aria-label]').forEach(x=>x.setAttribute('aria-label',x.getAttribute('aria-label').replace(/\d+$/,String(i+1)))); });
}
function pdLoad(){
  const P=LAB.paper, F=P.fields, m=$('#pdMsg'), rows=[]; let bad='';
  const fail=t=>{ m.className='fb bad'; m.textContent=t; };
  $$('#pdBody tr').forEach((tr,i)=>{
    if(bad) return;
    const fv={}, cv={}; let any=false;
    F.forEach(f=>{ const v=tr.querySelector(`[data-pf="${f.key}"]`).value.trim(); if(v) any=true; fv[f.key]=v; });
    tr.querySelectorAll('[data-pc]').forEach(x=>{ const v=x.value.trim(); if(v){ any=true; cv[x.dataset.pc]=v.slice(0,24); } });
    if(!any) return;
    const rec={};
    for(const f of F){ const v=parseNum(fv[f.key]); if(!isFinite(v)){ bad=`Red ${i+1}: upiši ${f.acc}.`; return; } if(v<f.min||v>f.max){ bad=`Red ${i+1}: ${f.nom} mora biti između ${fmt(f.min,f.dec)} i ${fmt(f.max,f.dec)}.`; return; } rec[f.key]=+v.toFixed(f.dec); }
    for(const k in cv){ if(!isFinite(parseNum(cv[k]))){ bad=`Red ${i+1}: izračunata vrednost nije broj.`; return; } }
    rows.push({rec,cv});
  });
  if(bad) return fail(bad);
  if(rows.length<2) return fail('Upiši bar 2 merenja (za obradu treba bar 6).');
  const sig=r=>F.map(f=>fmt(r[f.key],f.dec)).join('|');
  const same=S.records.map(sig).sort().join(';')===rows.map(x=>sig(x.rec)).sort().join(';');
  if(!same){
    if(S.records.length&&!confirm(`Zameniti postojećih ${S.records.length} merenja podacima iz sveske?`)) return;
    S.records=rows.map(x=>Object.assign({id:uid()},P.make(x.rec)));
    Object.keys(ANS).forEach(k=>{ S.proc[k].tbl={}; });
    S.paper=true;
  }
  const used=new Set(); let nc=0;
  rows.forEach(x=>{ const r=S.records.find(q=>!used.has(q.id)&&sig(q)===sig(x.rec)); if(!r) return; used.add(r.id);
    Object.keys(x.cv).forEach(k=>{ const [an,ck]=k.split('|'); if(!S.proc[an]) return; const T=S.proc[an].tbl[r.id]||(S.proc[an].tbl[r.id]={}); if(T[ck]!==x.cv[k]){ T[ck]=x.cv[k]; nc++; } }); });
  if(same&&!nc){ m.className='fb ok'; m.textContent='✓ Ovi podaci su već učitani.'; return; }
  save(true); go(S.view);
  toast(same?'Izračunate vrednosti iz sveske su upisane u tabelu.':`Učitano iz sveske: ${rows.length} merenja.`+(nc?' Izračunate vrednosti su upisane u tabelu.':''),'ok');
}
function copyHTML(n){
  const F=LAB.paper.fields, rs=pRows(), PC=n>=2?PCOLS().filter(p=>rs.some(r=>String(tblOf(p.an,r.id)[p.c.key]||'').trim())):[];
  let h=`<div class="card remind" style="margin:10px 0 0"><h3>✎ Proveri svesku</h3><p class="small">Ovo mora da imaš zapisano u svesci. Ako se podaci na uređaju izgube (ili sledeći put radiš na drugom uređaju), uneseš ih ponovo na obradi.</p>`;
  h+=rs.length?`<div class="tblwrap"><table class="tbl ctbl"><thead><tr><th>#</th>${F.map(f=>`<th>${f.label}</th>`).join('')}${PC.map(p=>`<th>${p.c.label}</th>`).join('')}</tr></thead><tbody>${rs.map((r,i)=>`<tr><td class="ix">${i+1}</td>${F.map(f=>`<td>${fmt(r[f.key],f.dec)}</td>`).join('')}${PC.map(p=>`<td>${esc(tblOf(p.an,r.id)[p.c.key]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Još nema merenja.</p>';
  if(n>=2) Object.values(ANS).forEach(a=>{ const s=S.proc[a.id], c=a.cfg, q=c.consts[0], it=[];
    if(s.A.x||s.A.y) it.push(`A = (${esc(s.A.x)}; ${esc(s.A.y)})`); if(s.B.x||s.B.y) it.push(`B = (${esc(s.B.x)}; ${esc(s.B.y)})`);
    if(s.k) it.push(`k = ${esc(s.k)} ${c.ku}`); if(c.intercept&&s.n) it.push(`n = ${esc(s.n)} ${c.yu}`);
    c.consts.forEach(z=>{ if(s.ex[z.key]) it.push(`${z.sym} = ${esc(s.ex[z.key])} ${z.unit}`); });
    if(s.d) it.push(`Δ${q.sym} = ${esc(s.d)} ${q.unit}`); if(s.rc&&s.rd) it.push(`<b>${q.sym} = (${esc(s.rc)} ± ${esc(s.rd)}) ${q.unit}</b>`);
    if(it.length) h+=`<p class="small" style="margin:8px 0 0">${c.name?`<b>${c.name}:</b> `:''}${it.join(' · ')}</p>`; });
  return h+'</div>';
}
const devOk=(r,v)=>isFinite(r.c)&&isFinite(r.e)&&within(Math.abs(parseNum(v)),Math.abs(r.c-r.e)/Math.abs(r.e)*100,0.15,0.05);
function devsDone(){ try{ const R=LAB.results(); return R.some(r=>isFinite(r.c)&&isFinite(r.e))&&R.every((r,i)=>!(isFinite(r.c)&&isFinite(r.e))||devOk(r,S.devs[i])); }catch(e){ return false; } }

function mountProc(v){

function renderConcl(){

const conclDone=()=>String(S.concl||'').trim().length>=80;
function verdictFor(c,d,e){
  if(!isFinite(c)||!isFinite(e)) return {verdict:'Rezultat još nije upisan',cls:'',dev:'—',c:NaN,e};
  const dev=fmt(Math.abs(c-e)/Math.abs(e)*100,1)+' %';
  if(isFinite(d)&&Math.abs(c-e)<=d) return {verdict:'Slaže se u granicama nesigurnosti',cls:'ok',dev,c,e};
  if(isFinite(d)&&Math.abs(c-e)<=2*d) return {verdict:'Blizu — razlika je između Δ i 2Δ',cls:'warn',dev,c,e};
  return {verdict:'Ne slaže se u granicama nesigurnosti — potraži glavni izvor greške',cls:'bad',dev,c,e};
}

}

/* =====================================================================
   VEŽBA: FOTOELEKTRIČNI EFEKAT — ODREĐIVANJE PLANKOVE KONSTANTE
   ===================================================================== */
const HC=1239.84;          /* h·c u eV·nm */
const AI=2.00;             /* izlazni rad katode (cezijum), eV — skriveno do zaključka */
const UC=0.06;             /* kontaktni potencijal anoda–katoda, V (efekat drugog reda) */
const WT=0.012;            /* termalno razmazivanje energije elektrona, eV */
const P1={
  lam:{id:'lam',label:'Talasna dužina λ (monohromator)',unit:'nm',min:250,max:700,step:1,dec:0},
  inten:{id:'inten',label:'Jačina svetlosti lampe',unit:'%',min:10,max:100,step:5,dec:0,hint:'Jačina menja broj fotona u sekundi, a ne njihovu energiju.'},
  U:{id:'U',label:'Kočeći napon U',unit:'V',min:0,max:3,step:0.01,dec:2}
};
const nuOf=l=>2998/l;                                   /* ν u 10¹⁴ Hz */
const f1Y=l=>clamp(WT*softplus((HC/l-AI)/WT)/0.10,0,1); /* prinos emisije (prag na hν = Ai) */
const f1Ke=l=>HC/l-AI-UC;                               /* najveća energija koju „vidi“ kolo, eV */
const f1Isat=(l,i)=>30*(i/100)*f1Y(l)*(l/450);          /* struja zasićenja, nA */
const f1I=(l,i,U)=>f1Isat(l,i)*Math.min(1,WT*softplus((f1Ke(l)-U)/WT));
function f1Zero(l,i){ if(f1I(l,i,0)<0.005) return 0; let lo=0,hi=3.5; for(let k=0;k<60;k++){ const m=(lo+hi)/2; if(f1I(l,i,m)>0.005) lo=m; else hi=m; } return (lo+hi)/2; }
function wlRGB(nm){
  if(nm<380) return [150,90,255];
  let r=0,g=0,b=0;
  if(nm<440){ r=-(nm-440)/60; b=1; } else if(nm<490){ g=(nm-440)/50; b=1; } else if(nm<510){ g=1; b=-(nm-510)/20; }
  else if(nm<580){ r=(nm-510)/70; g=1; } else if(nm<645){ r=1; g=-(nm-645)/65; } else r=1;
  const f=nm<420?0.35+0.65*(nm-380)/40:nm>680?0.3+0.7*(700-nm)/20:1;
  return [r,g,b].map(x=>Math.round(255*Math.pow(clamp(x*f,0,1),0.8)));
}
function cov1(){ const L=[]; S.records.forEach(r=>{ if(r.Uz>0.02&&!L.some(x=>Math.abs(x-r.lam)<5)) L.push(r.lam); }); const nu=L.map(nuOf); return {n:L.length,span:nu.length?Math.max(...nu)-Math.min(...nu):0}; }

    {key:'nu0',sym:'ν<sub>0</sub>',name:'Crvena granica',formula:`ν<sub>0</sub> = ${FR('A<sub>i</sub>','h')} = −${FR('n','k')} =`,unit:'· 10¹⁴ Hz',dec:2,tol:{abs:0.02,rel:0.01},f:(k,n)=>-n/k,hint:'ν₀ je mesto gde prava seče ν-osu: ν₀ = −n : k.'},
    {key:'lam0',sym:'λ<sub>0</sub>',name:'',formula:`λ<sub>0</sub> = ${FR('c','ν<sub>0</sub>')} =`,unit:'nm',dec:0,tol:{abs:2,rel:0.01},f:(k,n)=>2998/(-n/k),hint:'λ₀ = c : ν₀; sa ν₀ u 10¹⁴ Hz to je 3000 : ν₀ (u nm).'}
  ]
});

    const c=cov1();
    $('#cov').innerHTML=`<div class="covbar ${c.n>=6?'ok':''}"><span class="t">λ sa fotoefektom: <b>${c.n} / 6</b></span><span class="bar"><i style="width:${Math.min(100,c.n/6*100)}%"></i></span></div><div class="covbar ${c.span>=3?'ok':''}"><span class="t">Raspon ν: <b>${fmt(c.span,2)} / 3,00</b> · 10¹⁴ Hz</span><span class="bar"><i style="width:${Math.min(100,c.span/3*100)}%"></i></span></div>`;
    nextBanner();
    $('#help1').innerHTML=`<b>Za nastavnika:</b> po modelu struja pada ispod 0,005 nA pri U ≈ ${fmt(f1Zero(l,S.p.inten),2)} V; prag fotoefekta (h · ν = A<sub>i</sub>) je λ ≈ ${Math.round(HC/AI)} nm.`;
  },
  tick(dt,rdt){
    const l=S.p.lam, i=S.p.inten, U=S.p.U;
    R1.I=S.lamp?f1I(l,i,U):0;
    R1.tRead+=rdt;
    if(R1.tRead>0.25){ R1.tRead=0; const n=R1.I+(0.002+0.01*R1.I)*randn(); R1.Idisp=Math.round(n*100)/100; const ro=$('#roI'); if(ro) ro.textContent=fmt(R1.Idisp,2)+' nA'; if(S.view==='merenje') nextBanner(); }
    const tgt=-55+110*clamp(R1.I/30,0,1); R1.needle+=(tgt-R1.needle)*Math.min(1,rdt*6);
    const nd=$('#needle'); if(nd) nd.setAttribute('transform',`rotate(${R1.needle.toFixed(1)} 306 212)`);
    if(S.view!=='merenje') return;
    /* animacija elektrona (vizuelno; zaustavljaju se kod x = K : (U + Uc)) */
    const g=$('#elec'); if(!g) return;
    if(RM){ g.innerHTML=''; return; }
    const Kph=Math.max(0,HC/l-AI);
    if(S.lamp&&Kph>0){ R1.spawn+=rdt*Math.min(45,2+f1Isat(l,i)*1.6); while(R1.spawn>1&&R1.el.length<70){ R1.spawn-=1; const K=Kph*Math.sqrt(Math.random()); R1.el.push({x:0,v:2.2*Math.sqrt(K)+0.05,y:(Math.random()*2-1)*26}); } }
    else R1.spawn=0;
    const a=2.42*(U+UC);
    R1.el.forEach(e=>{ e.v-=a*rdt; e.x+=e.v*rdt; });
    R1.el=R1.el.filter(e=>e.x>=0&&e.x<=1);
    g.innerHTML=R1.el.map(e=>`<circle cx="${(156+e.x*94).toFixed(1)}" cy="${(114+e.y*(1-0.5*e.x)).toFixed(1)}" r="2.6" fill="#6fd0ff"/>`).join('');
  },
  lessonSummary(n){
    if(n===1){ const c=cov1(); return `Zabeleženo tačaka: <b>${S.records.length}</b> (sa fotoefektom: ${c.n}); raspon frekvencija: ${fmt(c.span,2)} · 10¹⁴ Hz.`; }
    const s=S.proc.A;
    if(n===2) return `Nagib k = <b>${esc(s.k||'—')}</b> V po 10¹⁴ Hz, odsečak n = <b>${esc(s.n||'—')}</b> V.`;
    return `Rezultat: h = <b>(${esc(s.rc||'—')} ± ${esc(s.rd||'—')}) · 10⁻³⁴ J·s</b>; A<sub>i</sub> = ${esc(s.ex.Ai||'—')} eV.`;
  },
  results(){
    const s=ANS.A.summary(), v=verdictFor(s.ok?s.c:NaN,s.d,6.626), st=S.proc.A;
    const L=S.records.filter(r=>r.Uz>0.02), P=L.map(r=>({x:nuOf(r.lam),y:Math.round(f1Zero(r.lam,r.inten||60)*100)/100}));
    const f=P.length>=2?linfit(P):null;
    const Ai=parseNum(st.ex.Ai), lam0=parseNum(st.ex.lam0);
    const okAi=isFinite(Ai)&&Math.abs(Ai-AI)<=0.1;
    return [
      Object.assign({name:'Plankova konstanta h',got:s.ok?`(${esc(s.rc)} ± ${esc(s.rd)}) · 10⁻³⁴ J·s`:'— (završi korak 6 u Obradi II)',exp:'6,63 · 10⁻³⁴ J·s (tablično, skripta: 6,626 · 10⁻³⁴ J·s)',
        note:(f?`Za tvoje talasne dužine model aparature (sa kontaktnim potencijalom i raspodelom energija elektrona) daje h ≈ ${fmt(16.02*f.b,2)} · 10⁻³⁴ J·s. `:'')+(s.auto?'⚑ Deo obrade je popunjen automatski.':'')},v),
      {name:'Izlazni rad katode A<sub>i</sub>',got:isFinite(Ai)?`${fmt(Ai,2)} eV${isFinite(lam0)?` (crvena granica λ<sub>0</sub> ≈ ${fmt(lam0,0)} nm)`:''}`:'—',exp:'2,0 eV, λ<sub>0</sub> ≈ 620 nm (cezijum)',dev:isFinite(Ai)?fmt(Math.abs(Ai-AI)/AI*100,1)+' %':'—',c:isFinite(Ai)?Ai:NaN,e:AI,verdict:isFinite(Ai)?(okAi?'Dobro slaganje (unutar 0,1 eV)':'Odstupa više od 0,1 eV'):'Još nije izračunato',cls:isFinite(Ai)?(okAi?'ok':'warn'):''}
    ];
  },
  reveal:()=>'Katoda je bila od <b>cezijuma</b> (A<sub>i</sub> ≈ 2,0 eV, crvena granica oko 620 nm), kao u primeru iz skripte. Svetlost talasne dužine veće od ≈ 620 nm nije izbacivala elektrone, ma koliko jaka bila.',
  conclHints:['koliku si vrednost h dobio (sa nesigurnošću) i da li se slaže sa 6,63 · 10⁻³⁴ J·s','da li tačke leže na pravoj, tj. da li važi Ajnštajnova jednačina','koliki je izlazni rad katode i gde je crvena granica','glavni izvor greške (npr. teško je tačno uočiti trenutak kada struja padne na nulu)'],
  about:`<p><b>Jednačina.</b> Za svaku talasnu dužinu najbrži elektroni imaju energiju h · ν − A<sub>i</sub>. Struja kroz fotoćeliju opada sa kočećim naponom U i nestaje kad je e · U veće od te energije. Model: I = I<sub>z</sub> · min(1, K<sub>ef</sub> − e · U), gde je I<sub>z</sub> ∝ jačina svetlosti · prinos fotoefekta · λ (broj fotona za istu snagu).</p>
  <p><b>Efekti drugog reda.</b> Kontaktni potencijal između anode i katode (0,06 V) pomera sve U<sub>z</sub> za isti iznos — to ne menja nagib, ali menja odsečak. Toplotno kretanje elektrona (≈ 0,012 eV) daje mali „rep“ struje, pa trenutak kada struja padne na nulu nije sasvim oštar. Mikroampermetar ima šum ≈ 0,002 nA + 1 % i rezoluciju 0,01 nA; voltmetar 0,01 V.</p>
  <p><b>Pretpostavke</b> (skripta ne daje protokol vežbe): katoda od cezijuma, A<sub>i</sub> = 2,0 eV; monohromator 250–700 nm; nesigurnost U<sub>z</sub> ≈ ±0,03 V (procena trenutka kad struja padne na nulu), to su intervali greške na grafiku; nesigurnost talasne dužine (±2 nm) je zanemarena. Granične prave prolaze kroz krajeve intervala greške prve i poslednje tačke na grafiku; njihove nagibe učenik računa sam digitronom.</p>
  <p><b>Podaci</b> se čuvaju samo u ovom pregledaču, na ovom uređaju. Aplikacija ne šalje ništa na mrežu.</p>`
};

function nextBanner(){
  const b=$('#next1'); if(!b) return;
  const c=cov1(); let t;
  if(!S.lamp) t='Uključi lampu (kartica 1).';
  else if(f1Isat(S.p.lam,S.p.inten)<0.01||(S.p.U<0.005&&R1.Idisp<=0.0)) t='Mikroampermetar pokazuje nulu i pri U = 0: ova svetlost ne izbacuje elektrone. Za nju je U<sub>z</sub> = 0 — izaberi kraću talasnu dužinu.';
  else if(R1.Idisp>0) t='Struja teče. Povećavaj kočeći napon U dok struja ne padne na <b>0,00 nA</b>.';
  else t='Struja je pala na nulu. Smanji napon za 0,01 V i proveri da li struja ponovo teče — tako znaš da je ovo <b>najmanji</b> takav napon. Zatim upiši U<sub>z</sub> sa voltmetra i klikni „Zabeleži“.';
  if(c.n>=6&&c.span>=3) t+=' <br><b>Uslov pokrivenosti je ispunjen</b> — možeš dodati još tačaka ili završiti 1. čas.';
  if(b.innerHTML!==t) b.innerHTML=t;
}
function record(){
  const inp=$('#uzIn'), Uz=parseNum(inp.value), l=S.p.lam, i=S.p.inten;
  if(!isFinite(Uz)){ toast('Upiši zaustavni napon očitan sa voltmetra (npr. 0,85).','bad'); inp.focus(); return; }
  const z=Math.round(f1Zero(l,i)*100)/100;
  S.records.push({id:uid(),lam:l,inten:i,Uz:Math.round(Uz*100)/100,lamp:S.lamp});
  inp.value=''; save(); refresh();
  if(Uz<0||Uz>3.2) toast('Napon mora biti između 0 i 3 V — proveri očitavanje voltmetra. Tačka je zabeležena kako si upisao.','warn');
  else if(!S.lamp) toast('Lampa je bila isključena! Uključi je i ponovi merenje za ovu talasnu dužinu.','warn');
  else if(z===0&&Uz>0.05) toast('Pri ovoj talasnoj dužini struje nema ni pri U = 0, pa je U_z = 0. Proveri i ponovi.','warn');
  else if(Math.abs(Uz-z)>0.15) toast('Ova vrednost dosta odstupa — traži najmanji napon pri kom struja tek padne na 0,00 nA i ponovi merenje.','warn');
  else if(Math.abs(Uz-S.p.U)>0.06&&Uz>0) toast(`Zabeleženo: λ = ${l} nm, Uz = ${fmt(Uz,2)} V (napon na voltmetru je sada ${fmt(S.p.U,2)} V — proveri da li si dobro prepisao).`,'warn');
  else toast(`Zabeleženo: λ = ${l} nm, Uz = ${fmt(Uz,2)} V`,'ok');
}

init();
})();
</script>
